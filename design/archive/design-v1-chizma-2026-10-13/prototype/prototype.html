<title>METRX Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: desktop shows the phone in a device frame beside a prototype control panel; under 600px the app fills the screen and the panel becomes a drawer. */
:root{
  --bg:#E9EDF3; --fg:#14213A; --muted:#4D5970; --panel:#FFFFFF; --line:#CFD7E3; --accent:#1C4BD1; --accent-ink:#FFFFFF; --done:#1B6B3A; --bezel:#1A2233; --shadow:rgba(14,28,54,.28);
  --f-ui:"IBM Plex Sans","Segoe UI",Roboto,system-ui,sans-serif;
  --f-num:"IBM Plex Sans Condensed","IBM Plex Sans","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1522; --fg:#E6EBF3; --muted:#A3AEC2; --panel:#182134; --line:#2C374D; --accent:#9DB4FF; --accent-ink:#0E1C36; --done:#7FD3A0; --bezel:#000000; --shadow:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1522; --fg:#E6EBF3; --muted:#A3AEC2; --panel:#182134; --line:#2C374D; --accent:#9DB4FF; --accent-ink:#0E1C36; --done:#7FD3A0; --bezel:#000000; --shadow:rgba(0,0,0,.6); color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-ui);overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#stage{height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding-inline:24px;padding-block:20px}
#deviceWrap{flex:none;display:grid;place-items:center}
#device{position:relative;border-radius:46px;box-shadow:0 0 0 9px var(--bezel),0 30px 60px -24px var(--shadow);overflow:hidden;background:#F3F6FA}
#device[data-size="s"]{width:360px;height:740px}
#device[data-size="m"]{width:393px;height:852px}
#device[data-size="l"]{width:440px;height:956px}
#app{position:absolute;inset:0}
#panel{width:340px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 22px;display:grid;gap:18px;align-content:start}
#panel h1{font-size:18px;margin:0;line-height:1.2}
#panel h2{font-size:13px;margin:0;color:var(--muted);font-weight:600}
#panel p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.pgroup{display:grid;gap:8px}
.pbtns{display:flex;flex-wrap:wrap;gap:6px}
.pbtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;min-height:34px}
.pbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pbtn.wide{flex:1}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13px}
.checks li{display:grid;grid-template-columns:20px 1fr;gap:6px;align-items:start;line-height:1.35}
.checks li .mk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;margin-top:1px}
.checks li.ok .mk{background:var(--done);border-color:var(--done);color:var(--panel)}
.checks li.ok .mk::after{content:"✓";font-weight:700}
.checks small{display:block;color:var(--muted);font-size:12px}
#drawerBtn{display:none}
#compare{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;overflow:auto;padding-inline:20px;padding-block:18px 30px}
#compare.on{display:block}
.cmp-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:16px}
.cmp-head h2{font-size:18px;margin:0}
.cmp-row{display:flex;gap:34px;overflow-x:auto;padding:12px 12px 20px}
.cmp-col{flex:none;display:grid;gap:10px;justify-items:start}
.cmp-col h3{margin:0;font-size:14px}
.cmp-col h3 span{font-weight:400;color:var(--muted)}
.cmp-dev{position:relative;border-radius:40px;box-shadow:0 0 0 8px var(--bezel);overflow:hidden;pointer-events:none;background:#F3F6FA}

@media (max-width:599px){
  body{overflow:hidden}
  #stage{padding:0;gap:0;display:block}
  #deviceWrap{height:100%;display:block}
  #device{width:100%!important;height:100%!important;border-radius:0;box-shadow:none;zoom:1!important}
  #panel{position:fixed;z-index:40;inset:auto 0 0 0;width:auto;max-height:82%;border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .25s ease;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  #panel.open{transform:none}
  #drawerBtn{display:block;position:fixed;z-index:41;left:0;top:34%;background:var(--fg);color:var(--bg);border:0;border-radius:0 6px 6px 0;padding:6px 5px 6px 4px;font-size:10px;font-weight:600;line-height:1;opacity:.55}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

/* ───────── App (Direction A: Chizma) ───────── */
.app{--ink:#0E1C36;--ink2:#3E4A61;--ink3:#5F6B82;--paper:#F3F6FA;--sheet:#FFFFFF;--rule:#C3CEDF;--rule2:#DCE4F0;--cobalt:#1C4BD1;--cobalt2:#1238A8;--wash:#E7EEFD;--amber:#9A4D00;--amberw:#FFF1DF;--err:#B42318;--errw:#FDEDEB;--lockw:#EEF0F4;
  position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:400 15px/1.4 var(--f-ui);font-variant-numeric:tabular-nums;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.app *{box-sizing:border-box}
:where(.app) button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
.app .cd{font-family:var(--f-num)}
.app p{margin:0}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:18px;height:18px}.i.xs{width:15px;height:15px}.i.l{width:30px;height:30px}
.sb{flex:none;height:34px;display:flex;align-items:center;justify-content:space-between;padding:4px 28px 0 34px;font:600 14px/1 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--sheet)}
.sb .r{display:flex;gap:6px;align-items:center}
.homebar{flex:none;height:20px;display:grid;place-items:center;background:var(--sheet)}
.homebar::after{content:"";width:120px;height:4px;border-radius:2px;background:var(--ink);opacity:.85}
.full .sb,.full .homebar{display:none}
.full .homebar.safe{display:block;height:env(safe-area-inset-bottom,0px)}
.area{flex:1;min-height:0;position:relative;overflow:hidden}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.page.push{animation:pushIn .24s cubic-bezier(.2,.7,.2,1)}
.page.pop{animation:popIn .2s ease-out}
@keyframes pushIn{from{transform:translateX(36%);opacity:.4}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-16%);opacity:.6}to{transform:none;opacity:1}}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pad{padding:0 16px 20px}

.bar{flex:none;display:flex;align-items:center;gap:2px;min-height:52px;padding:0 6px;background:var(--paper)}
.bar .back{display:flex;align-items:center;gap:2px;min-height:44px;padding:0 8px 0 4px;color:var(--cobalt);font-weight:500;max-width:55%;min-width:0}
.bar .back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:4px;flex:none}
.ib:active,.ib.on{background:var(--wash)}
.ib[disabled]{opacity:.3;pointer-events:none}
.bar .ttl{flex:1;min-width:0;display:grid;line-height:1.2;padding-left:2px}
.bar .ttl b{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .ttl small{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .saved{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2);padding:0 4px;white-space:nowrap;min-width:0}
.bar .saved span{overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.wordmark{font:700 15px/1 var(--f-num);letter-spacing:.14em;padding:0 10px}
.h1{font-size:26px;font-weight:600;line-height:1.15;padding:2px 16px 10px;text-wrap:balance}

.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border-radius:4px;font-weight:600;font-size:15px;text-align:center!important;line-height:1.2}
.btn.pri{background:var(--cobalt);color:#fff}
.btn.pri:active{background:var(--cobalt2)}
.btn.sec{border:1.5px solid var(--ink);background:var(--sheet)}
.btn.ghost{color:var(--cobalt);padding:0 10px}
.btn.danger{color:var(--err);border:1.5px solid var(--err);background:var(--sheet)}
.btn[disabled],.btn.dis{opacity:.42;pointer-events:none}
.btn.locked{background:var(--lockw);color:var(--ink2);border:1.5px dashed var(--ink3)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.full{width:100%}
.btnrow{display:flex;gap:10px}
.btnrow>.btn{flex:1;min-width:0}
.footer{flex:none;background:var(--sheet);padding:10px 16px 12px;display:grid;gap:8px;box-shadow:0 -1.5px 0 var(--ink)}

/* bottom navigation: raised bubble that slides to the active tab (after the "Animated Mobile Navbar" community component) */
.tabbar{flex:none;position:relative;z-index:3;display:flex;height:64px;background:var(--sheet);box-shadow:0 -1px 0 var(--rule),0 -6px 16px rgba(14,28,54,.05);--n:5}
.tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;padding-bottom:9px;font-size:12px;color:var(--ink2);text-align:center!important}
.tabbar .ti{height:24px;display:grid;place-items:center;transition:opacity .18s}
.tabbar .on .ti{opacity:0}
.tabbar .on{color:var(--ink);font-weight:600}
.tabbar .tl{max-width:100%;padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar .bubble{position:absolute;top:-23px;left:calc(100% / var(--n) * var(--i) + 100% / var(--n) / 2);width:56px;height:56px;margin-left:-28px;border-radius:50%;background:var(--cobalt);color:#fff;display:grid;place-items:center;border:5px solid var(--sheet);box-shadow:0 6px 14px rgba(28,75,209,.28);pointer-events:none}
.tabbar .bubble.slide{animation:bslide .38s cubic-bezier(.34,1.3,.5,1)}
@keyframes bslide{from{left:calc(100% / var(--n) * var(--from) + 100% / var(--n) / 2)}}
.tabbar .bubble .i{width:23px;height:23px;stroke-width:2}
.has-tabs .page .footer{padding-bottom:26px}
.has-tabs .page .scroll{scroll-padding-bottom:30px}
.has-tabs .page .scroll>:last-child{margin-bottom:24px}
/* home, projects, board, profile, measure */
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:18px 16px 8px}
.sech b{font-size:16px;font-weight:600}
.sech button{color:var(--cobalt);font-weight:500;font-size:14px;min-height:36px}
.pcard{display:grid;grid-template-columns:64px 1fr;gap:4px 12px;align-items:start}
.pcard .th{grid-row:1/4;width:64px;height:56px;border:1px solid var(--rule);background:var(--paper);display:grid;place-items:center}
.pcard .t{grid-column:2}
.pcard .meta{grid-column:2}
.pcard .row{grid-column:1/-1}
.stg{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border:1px solid var(--ink2);border-radius:3px;white-space:nowrap;flex:none}
.stg.done{background:var(--ink);color:#fff;border-color:var(--ink)}
.cont{display:grid;grid-template-columns:64px 1fr 22px;gap:2px 12px;align-items:center;border:1.5px solid var(--cobalt);box-shadow:inset 4px 0 0 var(--cobalt)}
.cont .th{grid-row:1/4;width:64px;height:56px;background:var(--paper);border:1px solid var(--rule);display:grid;place-items:center}
.cont small{color:var(--cobalt);font-weight:600;font-size:12.5px}
.cont>small,.cont>b,.cont>.meta{grid-column:2}
.cont>.i{grid-column:3;grid-row:1/4}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 2px}
.chiprow,.kanban,.pages,.chips{scrollbar-width:none}
.chiprow::-webkit-scrollbar,.kanban::-webkit-scrollbar,.pages::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.chiprow .opt{flex:none;min-height:40px;padding:0 12px}
.chiprow .opt .n{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--rule2);font-size:12px;font-weight:600;padding:0 5px}
.chiprow .opt.on .n{background:var(--cobalt);color:#fff}
.qa{display:flex;gap:10px;padding:12px 16px 0}
.qa .btn{flex:1}
.view2d{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-items:start}
.r2d{background:#fff;border:1px solid var(--ink);padding:6px;display:grid;justify-items:center;gap:4px;cursor:pointer}
.r2d svg{max-width:100%;height:auto}
.r2d:active{background:var(--wash)}
.flh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px;font-size:13px;color:var(--ink2)}
.flh b{font-size:15px;color:var(--ink)}
.p3d{height:340px;border:1px solid var(--ink);flex:none}
.kanban{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 16px 34px;flex:1;min-height:0;align-items:flex-start}
.col{flex:0 0 80%;scroll-snap-align:center;background:var(--paper);border:1px solid var(--ink);display:flex;flex-direction:column;max-height:100%;min-height:120px}
.col header{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--ink);background:var(--sheet);font-weight:600}
.col header .n{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;background:var(--rule2);font-size:12.5px}
.col .cards{overflow-y:auto;padding:8px;display:grid;gap:8px}
.kcard{background:var(--sheet);border:1px solid var(--rule);display:grid}
.kcard .km{display:grid;gap:3px;padding:10px 10px 8px;text-align:left;width:100%}
.kcard .km b{font-size:15.5px;font-weight:600}
.kcard .km .meta{font-size:13px;color:var(--ink2)}
.kcard .kn{font-size:13px;color:var(--ink);font-style:italic;border-left:2px solid var(--rule);padding-left:6px;margin-top:2px}
.kcard .kf{display:flex;justify-content:flex-end;border-top:1px solid var(--rule2)}
.prog{height:6px;background:var(--rule2);margin-top:4px;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--cobalt)}
.task{display:flex;align-items:center;gap:10px;min-height:48px;padding:4px 4px 4px 0;border-bottom:1px solid var(--rule2);width:100%;text-align:left}
.task .i{color:var(--cobalt)}
.task.done span{text-decoration:line-through;color:var(--ink2)}
.noteitem{padding:10px 0;border-bottom:1px solid var(--rule2);display:grid;gap:2px}
.noteitem small{color:var(--ink2);font-size:12.5px}
.profhead{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;margin:0 16px;padding:12px;border:1.5px solid var(--ink);background:var(--sheet)}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:600 20px var(--f-num)}
.profhead b{font-size:18px;font-weight:600;display:block}
.profhead small{color:var(--ink2);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:0 16px;border:1px solid var(--ink);border-top:0;background:var(--sheet)}
.stats div{padding:8px 10px;display:grid}
.stats div+div{border-left:1px solid var(--rule)}
.stats b{font:600 22px var(--f-num)}
.stats span{font-size:12.5px;color:var(--ink2)}
.meter{border:1.5px solid var(--ink);background:var(--sheet);display:grid}
.meter .mt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--ink2);min-height:40px}
.meter .mt button{color:var(--cobalt);font-size:13px;text-align:right!important;min-height:36px}
.meter .mv{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:18px 10px 14px}
.meter .mv .v{font:600 60px/1 var(--f-num);letter-spacing:-.01em}
.meter .mv .u{font-size:22px;color:var(--ink2)}
.meter .mb{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink2);min-height:36px}
.live{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink2)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rule)}
.live.on{color:var(--cobalt)}
.live.on::before{background:var(--cobalt);animation:blink 1s steps(1) infinite}

.ptabs{flex:none;display:flex;margin:4px 16px 0;border-bottom:1px solid var(--rule)}
.ptabs button{flex:1 1 auto;min-width:0;height:44px;font-weight:500;color:var(--ink2);text-align:center!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.ptabs .cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;margin-left:5px;border-radius:10px;background:var(--rule2);color:var(--ink);font-size:12px;font-weight:600;vertical-align:1px}
.ptabs .on .cnt{background:var(--cobalt);color:#fff}
.ptabs .on{color:var(--cobalt);box-shadow:inset 0 -3px 0 var(--cobalt);font-weight:600}

.tblock{margin:0 16px;border:1.5px solid var(--ink);background:var(--sheet)}
.tblock .nm{font-size:21px;font-weight:600;line-height:1.2;padding:9px 12px 8px}
.tblock dl{display:grid;grid-template-columns:1fr 1fr;margin:0}
.tblock dl>div{padding:6px 12px 7px;border-top:1px solid var(--rule);min-width:0}
.tblock dl>div.l{border-right:1px solid var(--rule)}
.tblock dl>div.w{grid-column:1/-1}
.tblock dt{font-size:12.5px;color:var(--ink2)}
.tblock dd{margin:1px 0 0;font-size:15px;font-weight:500;overflow-wrap:anywhere}

.sched{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--ink)}
.sched th{font-size:12.5px;font-weight:500;color:var(--ink2);text-align:left;padding:5px 8px;border-bottom:1px solid var(--ink);border-right:1px solid var(--rule)}
.sched td{padding:8px;border-top:1px solid var(--rule);border-right:1px solid var(--rule);vertical-align:top;font-size:15px}
.sched td:last-child,.sched th:last-child{border-right:0}
.sched .n{width:28px;text-align:center;color:var(--ink2);padding-inline:4px}
.sched .r{text-align:right}
.sched b{font-weight:600}
.sched small{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink2);margin-top:2px}
.sched .pend{color:var(--amber);font-weight:600}
.sched .bad{color:var(--err);font-weight:600}
.sched tr.warn td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.sched tr.errrow td:first-child{box-shadow:inset 3px 0 0 var(--err)}
.sched tr.fl td{background:var(--paper);padding:5px 4px 5px 8px;border-right:0;border-top:1px solid var(--ink);font-size:13px;color:var(--ink2)}
.sched tr.fl .flrow{display:flex;align-items:center;gap:8px}
.sched tr.fl b{font-size:15px;color:var(--ink)}
.sched tr.rm{cursor:pointer}
.sched tr.rm:active td{background:var(--wash)}
.sched .menu{width:36px;padding:2px 0;text-align:center}
.sched .menu button{width:36px;height:40px;display:grid;place-items:center}
.sched .emptyrow td{padding:14px 12px;color:var(--ink2);font-size:14px}

.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:34px 24px 10px}
.empty h3{margin:0;font-size:19px;font-weight:600;text-wrap:balance}
.empty p{color:var(--ink2);max-width:30ch}
.empty .btnrow{flex-direction:column;width:100%;max-width:300px;margin-top:6px}

.card{background:var(--sheet);border:1px solid var(--ink);display:grid;gap:2px;padding:12px;text-align:left;width:100%}
.card+.card{margin-top:10px}
.card .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .t b{font-size:17px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.card .meta{font-size:13.5px;color:var(--ink2)}
.card .row{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-top:1px solid var(--rule2);padding-top:6px;margin-top:6px}

.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin:0 16px 10px;font-size:13.5px;line-height:1.35;background:var(--wash);box-shadow:inset 3px 0 0 var(--cobalt)}
.banner.warn{background:var(--amberw);box-shadow:inset 3px 0 0 var(--amber)}
.banner.err{background:var(--errw);box-shadow:inset 3px 0 0 var(--err)}
.banner.lock{background:var(--lockw);box-shadow:inset 3px 0 0 var(--ink3)}
.banner .tx{flex:1;min-width:0}
.banner .act{color:var(--cobalt);font-weight:600;white-space:nowrap;min-height:28px}
.banner.err .i{color:var(--err)}.banner.warn .i{color:var(--amber)}

.simtag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 7px;border:1px dashed var(--ink);border-radius:3px;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(14,28,54,.07) 6px 12px);white-space:nowrap;color:var(--ink)}
.devchip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border:1px solid var(--ink2);border-radius:4px;font-size:13px;background:var(--sheet);min-width:0}
.devchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.devchip.sim{border-style:dashed}
.devchip.bad{border-color:var(--amber);color:var(--amber);font-weight:600}

/* editor */
.subbar{flex:none;display:flex;align-items:center;gap:8px;padding:0 16px 8px}
.seg{display:flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden;flex:none}
.seg button{min-height:40px;padding:0 16px;font-weight:500;font-size:14px;text-align:center!important}
.seg .on{background:var(--ink);color:#fff}
.seg.wide{flex:1}.seg.wide button{flex:1;padding:0 6px}
.seg button[disabled]{opacity:.4}
.chips{flex:none;display:flex;gap:8px;padding:8px 16px;border-top:1px solid var(--rule);overflow-x:auto}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border:1px solid var(--ink2);border-radius:4px;background:var(--sheet);font-size:13.5px;white-space:nowrap}
.chip b{font-family:var(--f-num);font-weight:600;font-size:15px}
.chip.unset{border-style:dashed;color:var(--ink2)}
.chip.recv{border-color:var(--amber);background:var(--amberw)}
.chip.recv .i{color:var(--amber)}
.chip.sel{box-shadow:0 0 0 2px var(--cobalt);border-color:var(--cobalt)}
.canvas{flex:1;min-height:0;position:relative;display:grid;place-items:center;background:var(--paper);background-image:linear-gradient(var(--rule2) 1px,transparent 1px),linear-gradient(90deg,var(--rule2) 1px,transparent 1px);background-size:23px 23px;border-bottom:1px solid var(--rule)}
.canvas svg{width:100%;height:100%;display:block}
.canvas.top{place-items:start center}
.canvas.top svg{height:auto;max-height:100%}
.canvas svg [data-a]{cursor:pointer}
.hintline{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;background:var(--sheet);border-bottom:1px solid var(--rule);font-size:14px;color:var(--ink2);text-align:center}
.hintline button{color:var(--cobalt);font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.tools{flex:none;display:flex;height:62px;background:var(--sheet);border-top:1px solid var(--rule)}
.tools button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--ink2);text-align:center!important}
.tools button span{max-width:100%;padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools button.on{color:var(--cobalt);font-weight:600;background:var(--wash);box-shadow:inset 0 2px 0 var(--cobalt)}
.tools button.lk{opacity:.5}
.three{position:relative;flex:1;min-height:0;background:#F3F6FA;overflow:hidden;touch-action:none}
.three canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
.three .lbl{position:absolute;min-width:24px;height:24px;transform:translate(-50%,-50%);padding:0 6px;white-space:nowrap;border-radius:12px;background:#fff;border:1.5px solid var(--ink);display:grid;place-items:center;font:600 12px var(--f-ui);pointer-events:none}
.three .hint{position:absolute;left:12px;bottom:10px;font-size:12.5px;color:var(--ink2);background:rgba(255,255,255,.86);padding:4px 8px;pointer-events:none}
.three .fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink2)}
.ctl3d{flex:none;background:var(--sheet);border-top:1px solid var(--rule);padding:10px 16px 12px;display:grid;gap:10px}
.swrow{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2)}
.swrow>span{min-width:0;flex:1}
.sw{width:34px;height:34px;border-radius:4px;border:1px solid var(--rule);flex:none;position:relative}
.sw.on::after{content:"";position:absolute;inset:-4px;border:2px solid var(--cobalt);border-radius:6px}

/* fields */
.form{display:grid;gap:14px}
.fld{display:grid;gap:5px}
.fld>label,.fld>.lab{font-size:13.5px;color:var(--ink2);font-weight:500;display:flex;gap:6px;align-items:baseline;justify-content:space-between}
.fld>label small,.fld>.lab small{font-weight:400;color:var(--ink3)}
.box{min-height:48px;display:flex;align-items:center;gap:6px;padding:0 12px;border:1.5px solid var(--rule);border-radius:4px;background:var(--sheet);cursor:text;font-size:16px;text-align:left}
.box .v{flex:1;min-width:0;overflow-wrap:anywhere;padding:10px 0;white-space:pre-wrap}
.box .ph{color:var(--ink3)}
.box .suf{color:var(--ink2);font-size:15px;flex:none}
.box.num .v{font-family:var(--f-num);font-size:19px;font-weight:600}
.box.f{border:2px solid var(--cobalt);box-shadow:0 0 0 3px var(--wash);padding:0 11px}
.box.bad{border-color:var(--err)}
.box.f.bad{box-shadow:0 0 0 3px var(--errw)}
.box.ro{background:var(--lockw);cursor:default}
.caret{display:inline-block;width:2px;height:1.15em;background:var(--cobalt);vertical-align:-.2em;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ferr{display:flex;gap:6px;align-items:flex-start;color:var(--err);font-size:13.5px;font-weight:500}
.fhint{font-size:13px;color:var(--ink2)}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:0 14px;border:1.5px solid var(--rule);border-radius:4px;background:var(--sheet);display:inline-flex;align-items:center;gap:8px;font-weight:500;text-align:left}
.opt.on{border-color:var(--cobalt);background:var(--wash);color:var(--cobalt2);font-weight:600}
.opt[disabled]{opacity:.55;cursor:default;border-style:dashed}
.opt small{font-weight:400;font-size:12px;color:var(--ink2)}
.optlist{display:grid;gap:8px}
.optlist .opt{width:100%;min-height:52px;justify-content:space-between}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(14,28,54,.42);animation:fade .2s}
.scrim.light{background:rgba(14,28,54,.12)}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--sheet);border-radius:8px 8px 0 0;box-shadow:0 -1.5px 0 var(--ink)}
.sheet.anim{animation:up .24s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{transform:translateY(40%);opacity:.3}}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--rule);margin:7px auto 0;flex:none}
.sheet .sh{flex:none;display:flex;align-items:center;gap:8px;padding:4px 6px 4px 16px;min-height:48px}
.sheet .sh h3{margin:0;flex:1;min-width:0;font-size:17px;font-weight:600;line-height:1.25}
.sheet .sb2{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 16px;display:grid;gap:12px;align-content:start}
.sheet .sf{flex:none;padding:10px 16px 12px;border-top:1px solid var(--rule);display:grid;gap:8px}
.reading{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.reading .v{font:600 48px/1 var(--f-num)}
.reading .u{font-size:20px;color:var(--ink2)}
.reading .simtag{margin-left:auto;align-self:center}
.state{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;font-size:14px;line-height:1.35;background:var(--amberw);box-shadow:inset 3px 0 0 var(--amber)}
.state .i{color:var(--amber)}
.state.ok{background:var(--wash);box-shadow:inset 3px 0 0 var(--cobalt)}
.state.ok .i{color:var(--cobalt)}
.wait{display:grid;justify-items:center;gap:8px;padding:4px 0 0;text-align:center}
.pulse{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--cobalt);color:var(--cobalt);position:relative}
.pulse::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--cobalt);animation:ring 1.4s ease-out infinite}
@keyframes ring{to{transform:scale(1.6);opacity:0}}
.simbtn{width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--ink);border-radius:4px;background:repeating-linear-gradient(135deg,var(--sheet) 0 8px,#F0F3F8 8px 16px);font-weight:600}
.kv{display:grid;grid-template-columns:1fr auto;gap:0;border:1px solid var(--ink);background:var(--sheet)}
.kv>div{display:contents}
.kv span,.kv b{padding:7px 10px;border-top:1px solid var(--rule2);font-size:14px}
.kv>div:first-child span,.kv>div:first-child b{border-top:0}
.kv b{font-family:var(--f-num);font-weight:600;text-align:right;font-size:15px}
.kv .tot span,.kv .tot b{border-top:1px solid var(--ink);font-weight:600}
.note{display:flex;gap:8px;font-size:13px;color:var(--ink2);line-height:1.4}
.minidia{background:var(--paper);border:1px solid var(--rule);padding:6px}
.listrow{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 4px 8px 16px;background:var(--sheet);border-bottom:1px solid var(--rule2);width:100%;text-align:left}
.listrow .tx{flex:1;min-width:0;display:grid;gap:1px}
.listrow .tx b{font-weight:500;font-size:15.5px}
.listrow .tx small{font-size:13px;color:var(--ink2)}
.listrow .val{font-size:14px;color:var(--ink2);text-align:right;max-width:45%}
.listrow .i{color:var(--ink2)}
.group{margin:12px 0 0;border-top:1px solid var(--rule)}
.grouph{font-size:13px;color:var(--ink2);padding:14px 16px 6px;font-weight:500}

/* estimate */
.emeta{display:flex;justify-content:space-between;gap:8px;padding:10px 16px 0;font-size:13px;color:var(--ink2)}
.ledger{background:var(--sheet);border:1px solid var(--ink);margin-top:10px}
.lh{display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 12px;min-height:44px;border-bottom:1px solid var(--ink);font-weight:600}
.lh .add{display:inline-flex;align-items:center;gap:4px;color:var(--cobalt);font-weight:500;font-size:14px;min-height:44px;padding:0 8px}
.lrow{display:grid;grid-template-columns:1fr auto;gap:1px 12px;padding:8px 12px 9px;border-top:1px solid var(--rule);width:100%;text-align:left;cursor:pointer}
.lh+.lrow{border-top:0}
.lrow:active{background:var(--wash)}
.lrow .nm{font-weight:500;overflow-wrap:anywhere}
.lrow .q{font-size:13px;color:var(--ink2)}
.lrow .s{grid-row:1/3;grid-column:2;align-self:center;font:600 16px var(--f-num);text-align:right}
.lempty{padding:12px;font-size:14px;color:var(--ink2)}
.subt{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font-weight:600;border-top:1px solid var(--ink);font-size:14.5px}
.subt span{font:600 16px var(--f-num)}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tot span{font-size:13.5px;color:var(--ink2)}
.tot b{font:600 23px/1.15 var(--f-num);border-bottom:3px double var(--ink)}

/* ───────── Kit skin: soft surfaces after the "Mobile Apps – Prototyping Kit" community file ───────── */
.app{--paper:#F4F5F7;--sheet:#FFFFFF;--rule:#E3E6EB;--rule2:#EEF0F3;--fill:#EEF0F4;--ink2:#47536A;--ink3:#6B7486;--wash:#EAF0FE;--r:16px;--sh:0 1px 2px rgba(16,24,40,.05),0 2px 10px rgba(16,24,40,.06)}
.bar{background:var(--paper)}
.h1{font-size:28px;font-weight:700;letter-spacing:-.015em}
.wordmark{font-size:16px}
.btn{border-radius:12px}
.btn.sec{border:0;background:var(--fill);color:var(--ink)}
.btn.danger{border:0;background:var(--errw)}
.btn.locked{border-radius:12px}
.footer{box-shadow:0 -1px 0 var(--rule)}
.card{border:0;border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.card+.card{margin-top:12px}
.card .row{border-top-color:var(--rule2)}
.tblock{border:0;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.tblock .nm{padding:12px 14px 10px}
.tblock dl>div{border-top-color:var(--rule2);padding:8px 14px 9px}
.tblock dl>div.l{border-right-color:var(--rule2)}
.tblock dd .i{color:var(--cobalt)}
.sched{border:0;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;border-collapse:separate;border-spacing:0}
.sched th{border-bottom:1px solid var(--rule);border-right:0;background:var(--sheet);padding:8px}
.sched td{border-right:0;border-top:1px solid var(--rule2)}
.sched tr.fl td{border-top:0;background:var(--fill)}
.ptabs{border-bottom:1px solid var(--rule)}
.ptabs .on{box-shadow:none;color:var(--ink);position:relative}
.ptabs .on::after{content:"";position:absolute;left:50%;bottom:0;width:28px;height:3px;margin-left:-14px;border-radius:2px;background:var(--cobalt)}
.seg{border:0;border-radius:12px;background:var(--fill);padding:3px;gap:2px}
.seg button{border-radius:9px;color:var(--ink2)}
.seg .on{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.14);font-weight:600}
.opt{border:1px solid var(--rule);border-radius:12px}
.opt.on{border-color:var(--cobalt);background:var(--wash)}
.chiprow .opt{border-radius:999px}
.box{border:1.5px solid var(--rule);border-radius:12px}
.box.f{border:2px solid var(--cobalt)}
.box .pre{color:var(--ink2);font-family:var(--f-num);font-size:19px;font-weight:600;flex:none}
.banner{border-radius:12px;box-shadow:none}
.banner.warn,.banner.err,.banner.lock{box-shadow:none}
.state{border-radius:12px;box-shadow:none}
.sheet{border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(16,24,40,.18)}
.sheet .sf{border-top:1px solid var(--rule2)}
.toast{border-radius:12px}
.chip{border-radius:10px;border-color:var(--rule)}
.chip.unset{border-color:var(--ink3)}
.devchip{border-radius:10px;border-color:var(--rule)}
.simbtn{border-radius:12px}
.listrow{border-bottom-color:var(--rule2)}
.listrow>.i:first-child{width:36px;height:36px;padding:8px;border-radius:10px;background:var(--fill);color:var(--cobalt)}
.lgroup{margin:0 16px;background:var(--sheet);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.lgroup .listrow{padding-left:12px}
.lgroup .listrow:last-child{border-bottom:0}
.grouph{padding:18px 16px 8px}
.ledger{border:0;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-top:12px}
.lh{border-bottom:1px solid var(--rule)}
.subt{border-top:1px solid var(--rule)}
.kv{border:0;border-radius:12px;box-shadow:var(--sh);overflow:hidden}
.kv .tot span,.kv .tot b{border-top:1px solid var(--rule)}
.meter{border:0;border-radius:20px;box-shadow:var(--sh)}
.pcard .th,.cont .th{border:0;border-radius:12px;background:var(--fill)}
.cont{border:0;box-shadow:var(--sh)}
.stg{border:0;border-radius:999px;background:var(--fill);color:var(--ink);padding:3px 10px}
.stg.done{background:var(--ink);color:#fff}
.col{border:0;border-radius:18px;background:var(--fill)}
.col header{border-bottom:0;background:transparent;padding:10px 12px 4px}
.col header .n{background:var(--sheet)}
.kcard{border:0;border-radius:14px;box-shadow:var(--sh)}
.profhead{border:0;border-radius:var(--r) var(--r) 0 0;box-shadow:var(--sh)}
.stats{border:0;border-top:1px solid var(--rule2);border-radius:0 0 var(--r) var(--r);box-shadow:var(--sh)}
.r2d{border:0;border-radius:14px;box-shadow:var(--sh)}
.p3d{border:0;border-radius:var(--r);overflow:hidden}
.pthumb{border-radius:6px}
.kb .k{border-radius:8px}
.tools button.on{box-shadow:none;border-radius:12px}
.empty .ill{width:72px;height:72px;border-radius:20px;background:var(--wash);color:var(--cobalt);display:grid;place-items:center;margin-bottom:4px}
/* onboarding */
.onb{display:grid;gap:16px;padding:20px 16px 20px}
.onb .steps{display:flex;gap:6px}
.onb .steps i{height:4px;flex:1;border-radius:2px;background:var(--rule)}
.onb .steps i.on{background:var(--cobalt)}
.onb h2{margin:0;font-size:28px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.onb .lead{color:var(--ink2);font-size:15px}
.onb .optlist .opt{min-height:56px;border-radius:14px;background:var(--sheet)}
/*@@CSS:openings@@*/
/* doors & windows: drag to move */
.wv-draw,.canvas{position:relative}
.wv-draw [data-a="editOpening"],.canvas .ophit{cursor:grab;touch-action:none}
.dg-on [data-a="editOpening"],.dg-on .ophit{cursor:grabbing}
.dg-tip{position:absolute;z-index:4;transform:translate(-50%,-100%);padding:6px 10px;border-radius:10px;background:var(--ink);color:#fff;font:600 13px/1.3 var(--f-num);white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px rgba(14,28,54,.3)}
.dg-tip.bad{background:var(--err)}
.wv-draghint{display:flex;align-items:flex-start;gap:6px;padding:8px 16px 0;font-size:13px;line-height:1.35;color:var(--ink2)}
.wv-draghint span{flex:1;min-width:0}
.wv-approx{color:var(--amber)!important}
.sb2>.minidia{display:block;height:74px;min-height:74px}
/*@@CSS:workspace@@*/
/* workspaces: project → workspace (place) → room plans, free drawings, photos, notes */
.ws-list{margin:0}
.wsrow{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:10px 6px 10px 12px;background:var(--sheet);border-bottom:1px solid var(--rule2);text-align:left}
.ws-list .wsrow:last-child{border-bottom:0}
.wsrow:active{background:var(--fill)}
.ws-ic{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--wash);color:var(--cobalt)}
.wsrow .tx{flex:1;min-width:0;display:grid;gap:2px}
.wsrow .tx b{font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsrow .tx small{color:var(--ink2);font-size:13px;line-height:1.35}
.wsrow .ar{font:600 14px var(--f-num);white-space:nowrap}
.ws-empty{display:grid;justify-items:center;text-align:center;gap:10px;margin:14px 16px 0;padding:26px 20px 22px;background:var(--sheet);border-radius:var(--r);box-shadow:var(--sh)}
.ws-empty h3{margin:4px 0 0;font-size:19px;font-weight:700;text-wrap:balance}
.ws-empty p{color:var(--ink2);font-size:14.5px;max-width:34ch}
.ws-empty .btn{margin-top:6px}
.page.space{background:#fff}
.page.space .bar{background:#fff}
.ws-head{flex:none;display:flex;align-items:center;gap:12px;padding:0 16px 10px}
.ws-head>div{min-width:0;display:grid;gap:2px}
.ws-head h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.15;overflow-wrap:anywhere}
.ws-head small{color:var(--ink2);font-size:13px}
.ws-chips{flex:none;padding:0 16px 10px}
.ws-chips .opt{min-height:38px}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:2px 16px 104px}
.wcard{position:relative;min-width:0;background:#fff;border:1px solid var(--rule);border-radius:16px;overflow:hidden;-webkit-touch-callout:none}
.wcard:active{border-color:var(--ink3)}
.wc-open{display:grid;width:100%;text-align:left}
.wc-th{aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;background:var(--fill);border-bottom:1px solid var(--rule2)}
.wc-th svg{width:100%;height:100%;display:block}
.wc-th.plan{background:#fff;padding:8px}
.wc-th.paper{background:#fff}
.wc-th.photo{background:#0E1C36}
.wc-th.note{display:block;place-items:initial;padding:10px 12px;background:#FFFAEB;font-size:12.5px;line-height:1.35;color:var(--ink2);text-align:left}
.wc-th.note b{display:block;margin-bottom:4px;font-size:13.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
