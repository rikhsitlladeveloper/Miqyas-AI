/*SK-PURE-START*/
const SK_TOL=20;                       // mm: closure / diagonal tolerance
const SK_LETTERS='ABCDEFGJKLMNPQRSUVWYZ'; // skips H, I, O, T, X (height, thickness, diagonals, look-alikes)
function skWallIds(n){ return SK_LETTERS.slice(0,n).split('') }
function skSnapAng(a){ const q=Math.PI/4; return Math.round(a/q)*q }
function skNormAng(a){ while(a<=-Math.PI) a+=2*Math.PI; while(a>Math.PI) a-=2*Math.PI; return a }
function skUnit(a){ const c=Math.cos(a),s=Math.sin(a); return [Math.abs(c)<1e-12?0:c,Math.abs(s)<1e-12?0:s] }
function skDirs(V,snap){ const n=V.length; return V.map((p,i)=>{ const q=V[(i+1)%n]; const a=Math.atan2(q[1]-p[1],q[0]-p[0]); return snap?skSnapAng(a):a }) }
function skBuildVerts(dirs,len,start){ const out=[[start[0],start[1]]]; for(let i=0;i<dirs.length-1;i++){ const u=skUnit(dirs[i]),p=out[i]; out.push([p[0]+u[0]*len[i],p[1]+u[1]*len[i]]) } return out }

/* corner drag with alignment guides and 45° snapping; the sketch changes, confirmed numbers don't */
function skDragTo(r,i,x,y,view){
  const V=r.poly.verts.map(v=>[v.x,v.y]), n=V.length, prev=V[(i-1+n)%n], next=V[(i+1)%n]; let p=[x,y], snapped=false; const guides=[];
  if(S.settings.angleSnap!==false){
    const ray=o=>{ const a=Math.atan2(p[1]-o[1],p[0]-o[0]), as=skSnapAng(a); return Math.abs(skNormAng(a-as))<0.14?as:null };
    const a1=ray(prev), a2=ray(next);
    if(a1!=null&&a2!=null){ const u1=skUnit(a1),u2=skUnit(a2), det=-u1[0]*u2[1]+u1[1]*u2[0];
      if(Math.abs(det)>1e-6){ const sd=(-(next[0]-prev[0])*u2[1]+(next[1]-prev[1])*u2[0])/det; if(sd>0){ p=[prev[0]+u1[0]*sd,prev[1]+u1[1]*sd]; snapped=true } } }
    if(!snapped){ const o=a1!=null?prev:a2!=null?next:null, a=a1!=null?a1:a2; if(o){ const u=skUnit(a), L=(p[0]-o[0])*u[0]+(p[1]-o[1])*u[1]; p=[o[0]+u[0]*L,o[1]+u[1]*L]; snapped=true } } }
  if(!snapped){ const tol=10/view.s; let bx=null,by=null;
    V.forEach((q,j)=>{ if(j===i) return; if(Math.abs(q[0]-p[0])<tol&&(bx==null||Math.abs(q[0]-p[0])<Math.abs(bx-p[0]))) bx=q[0]; if(Math.abs(q[1]-p[1])<tol&&(by==null||Math.abs(q[1]-p[1])<Math.abs(by-p[1]))) by=q[1] });
    if(bx!=null) p[0]=bx; if(by!=null) p[1]=by }
  p=[Math.round(p[0]/10)*10,Math.round(p[1]/10)*10];
  V.forEach((q,j)=>{ if(j===i) return; if(Math.abs(q[0]-p[0])<1&&!guides.some(g=>g.x===q[0])) guides.push({x:q[0]}); if(Math.abs(q[1]-p[1])<1&&!guides.some(g=>g.y===q[1])) guides.push({y:q[1]}) });
  return {p,guides};
}

const WS_TYPES=[['floor','layers'],['room','room'],['bath','bath'],['kitchen','kitchen'],['balcony','balcony'],['outdoor','tree'],['other','folder']];
const wsType=w=>w&&w.type||'floor';
const wsIcon=w=>(WS_TYPES.find(x=>x[0]===wsType(w))||WS_TYPES[0])[1];
const WSP=(p,id)=>p&&p.floors.find(f=>f.id===id);
const wsItems=w=>w.items||(w.items=[]);
const wsRooms=(p,w)=>p.rooms.filter(r=>r.floorId===w.id);
const repOf=it=>it.rep!=null?it.rep:it.kind!=='note';
const KIND_IC={room:'room',drawing:'pen',photo:'camera',note:'note'};
function wsSuggest(p,type){
  if(type==='floor') return t('pr.floorName',{n:p.floors.filter(f=>wsType(f)==='floor').length+1});
  const base=t('ws.t.'+type), n=p.floors.filter(f=>{ const nm=floorName(f); return nm===base||nm.startsWith(base+' ') }).length;
  return n?base+' '+(n+1):base;
}
function wsStoreName(p,nm,type){
  for(let k=1;k<=p.floors.length+1;k++) if(type==='floor'&&nm===t('pr.floorName',{n:k})) return '@floor:'+k;
  return nm===t('ws.t.'+type)?'@ws.t.'+type:nm;
}
function wsCounts(p,w){
  const rs=wsRooms(p,w).length, its=wsItems(w), c=k=>its.filter(x=>x.kind===k).length;
  return [[rs,'ws.cRoom'],[c('drawing'),'ws.cDraw'],[c('photo'),'ws.cPhoto'],[c('note'),'ws.cNote']].filter(x=>x[0]).map(([n,k])=>t(k,{n})).join(', ');
}
function itemOf(rt){ const p=P(rt.pid), w=WSP(p,rt.wid), it=w&&wsItems(w).find(x=>x.id===rt.iid); return {p,w,it} }
const keepKey=(old,val)=>dn(old)===val?old:val;
function wsEntries(p,w){
  return [...wsRooms(p,w).map(r=>({k:'room',id:r.id,r,ts:r.created||0})),...wsItems(w).map(it=>({k:it.kind,id:it.id,it,ts:it.created||0}))].sort((a,b)=>b.ts-a.ts);
}
function entryName(e){ return e.k==='room'?dn(e.r.name):e.k==='note'?(dn(e.it.name)||t('it.untitled')):dn(e.it.name) }

{ const base=roomsTab; roomsTab=function(p,rt){ const v=(rt&&rt.view)||'list'; if(v!=='list'&&p.rooms.length) return base(p,rt); return wsList(p) } }

  const rows=p.floors.map(w=>{ const rs=wsRooms(p,w), area=rs.reduce((a,r)=>{ const ar=areas(r); return a+(ar?ar.floor:0) },0);
    return `<button class="wsrow" data-a="openSpace" data-id="${w.id}"><span class="ws-ic">${ic(wsIcon(w))}</span><span class="tx"><b>${esc(floorName(w))}</b><small>${esc(wsCounts(p,w)||t('ws.empty'))}</small></span>${area?`<span class="ar">${fmtArea(area)} ${esc(M2())}</span>`:''}${ic('chev','i s')}</button>` }).join('');
  return `<div class="pad" style="padding-top:12px">${seg}<div class="lgroup ws-list">${rows}</div></div>`;
}

};
/* the workspace's own totals: net wall, floor, measurements confirmed ("+?" while some rooms lack values) */
function wsNums(p,w){
  const rs=wsRooms(p,w); let net=0,nn=0,fl=0,fn=0,need=0,conf=0;
  rs.forEach(r=>{ const a=areas(r); if(a){ fl+=a.floor; fn++; if(a.net!=null){ net+=a.net; nn++ } } const ks=hmDimKeys(r); need+=ks.length; conf+=ks.filter(k=>dimStatus(r.dims[k])==='conf').length });
  const v=(sum,n)=>n?`${fmtArea(sum)} <small>${esc(M2())}${n<rs.length?' +?':''}</small>`:'?';
  return `<div class="pj-nums"><div><span>${esc(t('pl.wall'))}</span><b>${v(net,nn)}</b></div><div><span>${esc(t('ws.floor'))}</span><b>${v(fl,fn)}</b></div><div><span>${esc(t('pl.meas'))}</span><b>${need?conf+'/'+need:'—'}</b></div></div>`;
}
function wsCard(p,w,e){
  let th='',meta='',cls='';
  if(e.k==='room'){ const r=e.r, ar=areas(r), sc=110/Math.max(r.dims.A.v||4000,r.dims.B.v||3000), nx=hmNext(r);
    th=`<div class="wc-th plan">${r.shape==='poly'?thumbSVG(r,120,90):miniPlan(r,sc)}</div>`;
    meta=nx.cls==='ok'?`<small class="okc">${ic('check','i xs')}${esc(ar&&ar.net!=null?t('ws.netWall',{v:fmtArea(ar.net)}):ar?fmtArea(ar.floor)+' '+M2():t('hm.next.ok'))}</small>`
      :`<small class="${nx.cls==='bad'?'errc':nx.cls==='unset'?'':'pend'}">${ic(nx.ic,'i xs')}${esc(nx.txt)}</small>` }
  else if(e.k==='note'){ const it=e.it, ck=it.checks||[], d=ck.filter(c=>c.done).length;
    th=`<div class="wc-th note"><p>${esc(dn(it.text)||'')}</p>${ck.length?`<span class="ckp">${ic('boxok','i xs')}${esc(t('it.items',{d,n:ck.length}))}</span>`:''}</div>`;
    meta=`<small>${esc(fmtDate(it.edited||it.created))}</small>` }
  else { const it=e.it, ds=mkEls(it).filter(x=>x.t==='line'||x.t==='dim'), open=ds.filter(x=>x.v==null).length;
    th=`<div class="wc-th ${e.k==='photo'?'photo':'paper'}">${mkSVG(it,{thumb:true})}</div>`;
    meta=open?`<small class="pend">${ic('clock','i xs')}${esc(t('it.dimsOpen',{n:open}))}</small>`:ds.length?`<small>${ic('dim','i xs')}${esc(t('it.dims',{n:ds.length}))}</small>`:`<small>${esc(mkEls(it).length?fmtDate(it.edited||it.created):t('it.blankDraw'))}</small>` }
  const rep=e.k==='room'?p.report.rooms[e.id]!==false:repOf(e.it);
  return `<div class="wcard" data-card="${e.k}" data-id="${e.id}"><button class="wc-open" data-a="wsOpen" data-k="${e.k}" data-id="${e.id}">${th}<span class="wc-b"><span class="wc-k">${ic(KIND_IC[e.k],'i xs')}${esc(t('it.k.'+e.k))}</span><b>${esc(entryName(e))}</b>${meta}</span></button><button class="ib wc-more" data-a="itemMenu" data-k="${e.k}" data-id="${e.id}" aria-label="menu">${ic('more','i s')}</button>${rep?'<span class="wc-pdf">PDF</span>':''}</div>`;

function findEntry(p,k,id){
  if(k==='room'){ const r=R(p,id); return r&&{k,id,r} }

function wsNewNote(pid,wid){ const p=P(pid), w=WSP(p,wid); const it={id:uid(),kind:'note',name:'',text:'',checks:[],created:Date.now(),edited:Date.now(),rep:false}; wsItems(w).push(it); p.edited=Date.now(); commit(); wsOpenNote(pid,wid,it.id,true) }
function noteForm(it){ const f={ntitle:dn(it.name),ntext:dn(it.text)}; (it.checks||[]).forEach(c=>f['ck_'+c.id]=dn(c.text)); initForm(f); U.formFor=it.id }
function wsOpenNote(pid,wid,iid,fresh){ const {it}=itemOf({pid,wid,iid}); noteForm(it); push({s:'note',pid,wid,iid}); if(fresh){ setFocus('ntitle','text','ntext'); render() } }
function noteSync(){ const r=top(); if(!r||r.s!=='note') return; const {p,it}=itemOf(r); if(!it||U.formFor!==it.id) return; let ch=false;
  const set=(o,k,v)=>{ if(v===undefined) return; const nv=keepKey(o[k],v); if(nv!==o[k]){ o[k]=nv; ch=true } };
  set(it,'name',U.form.ntitle); set(it,'text',U.form.ntext); (it.checks||[]).forEach(c=>set(c,'text',U.form['ck_'+c.id]));
  if(ch){ it.edited=Date.now(); p.edited=Date.now(); clearTimeout(U.ntT); U.ntT=setTimeout(()=>{ commit() },700) } }
PAGES.note=(rt)=>{
  const {p,w,it}=itemOf(rt); if(!it) return PAGES.space(rt);
  if(U.formFor!==it.id&&!U.sheet) noteForm(it);
  const ck=it.checks||[], done=ck.filter(c=>c.done).length, rep=repOf(it);
  const rows=ck.map((c,i)=>`<div class="ck-row ${c.done?'done':''}"><button class="ck-box" data-a="ntToggle" data-id="${c.id}" aria-pressed="${c.done}" aria-label="${esc(t('nt.tick'))}">${ic(c.done?'boxok':'box')}</button>${field('ck_'+c.id,'',{ph:t('nt.itemPh'),next:ck[i+1]?'ck_'+ck[i+1].id:''})}<button class="ib" data-a="ntDel" data-id="${c.id}" aria-label="${esc(t('nt.del'))}">${ic('x','i s')}</button></div>`).join('');
  return `<section class="page ${U.anim||''}">${bar({backIcon:true,title:t('it.k.note'),sub:floorName(w),right:savedChip()+`<button class="ib" data-a="itemMenu" data-k="note" data-id="${it.id}" aria-label="menu">${ic('more')}</button>`})}<div class="scroll" data-scroll="note-${it.id}"><div class="pad form nt">
    ${field('ntitle',t('nt.title'),{ph:t('nt.titlePh'),next:'ntext'})}
    ${field('ntext',t('nt.text'),{area:true,ph:t('nt.textPh')})}
    <div class="fld"><span class="lab">${esc(t('nt.list'))}${ck.length?` <small>${esc(t('it.items',{d:done,n:ck.length}))}</small>`:''}</span><div class="ck-list">${rows}</div><button class="btn sec sm" data-a="ntAdd">${ic('plus','i s')}${esc(t('nt.add'))}</button></div>
    <button class="listrow sw-row" data-a="ntRep" aria-pressed="${rep}">${ic('doc')}<span class="tx"><b>${esc(t('it.report'))}</b></span><span class="switch ${rep?'on':''}"></span></button>
  </div></div></section>`;
};
const noteIt=()=>itemOf(top()).it;
/* leaving a note that was never filled in (no title, text or list items) removes it, so stray empty notes don't pile up */
{ const basePop=pop; pop=function(){ const r=top(); if(r&&r.s==='note'){ noteSync(); const {w,it}=itemOf(r), blank=v=>!String(dn(v)||'').trim();
    if(it&&blank(it.name)&&blank(it.text)&&!(it.checks||[]).some(c=>!blank(c.text))){ const a=wsItems(w), i=a.indexOf(it); if(i>=0){ a.splice(i,1); commit() } } }
  return basePop.apply(this,arguments) } }
A.ntAdd=()=>{ if(!guard()) return; noteSync(); const it=noteIt(); const c={id:uid(),text:'',done:false}; (it.checks||(it.checks=[])).push(c); U.form['ck_'+c.id]=''; it.edited=Date.now(); commit(); setFocus('ck_'+c.id,'text',''); render() };
A.ntToggle=d=>{ if(!guard()) return; noteSync(); const c=noteIt().checks.find(x=>x.id===d.id); c.done=!c.done; noteIt().edited=Date.now(); commit(); render() };
A.ntDel=d=>{ if(!guard()) return; noteSync(); const it=noteIt(); it.checks=it.checks.filter(x=>x.id!==d.id); delete U.form['ck_'+d.id]; if(U.focus&&U.focus.id==='ck_'+d.id) blur(); it.edited=Date.now(); commit(); render() };

  if(c.tool==='brick'){ if(!g(0)||!g(1)) return null; const op=c.bop&&g(2)&&g(3)?g(2)*g(3):0, net=g(0)*g(1)-op; if(net<=0) return {k:'qc.rBrick',err:t('qc.opBig')};
    const r=qbCount(net); return {k:'qc.rBrick',txt:qbInt(r.bricks)+' <small>'+esc(t('u.pcs'))+'</small>',sub:t('qb.mortar')+' '+r.mortar.toFixed(2).replace('.',DEC())+' '+M()+'³',area:fmtArea(net)+' '+M2()} }
}
function qcCalc(){
  const c=qc(), slots=QC_SLOTS[c.tool], v=c.vals[c.tool], act=qcActive();
  const slot=(i,lab)=>{ const x=v[i]; return `<button class="qm-slot ${x?'':'empty'} ${act===i?'act':''}" data-a="qcSlot" data-i="${i}"><b>${x?fmtLen(x.mm,null,true):'?'}</b><small>${esc(t('qc.'+lab))}</small></button>` };
  let rows='';
  if(c.tool==='sum') rows=`<div class="qm-row" style="flex-wrap:wrap">${v.map((x,i)=>`${i?'<span class="op">+</span>':''}<button class="qm-slot" style="flex:0 0 auto;padding:7px 10px" data-a="qcSlot" data-i="${i}"><b>${fmtLen(x.mm,null,true)}</b></button>`).join('')}${v.length?'<span class="op">+</span>':''}<button class="qm-slot empty act" style="flex:0 0 auto;padding:7px 14px" data-a="noop"><b>?</b></button></div>`;
  else if(c.tool==='wall') rows=`<div class="qm-row">${slot(0,'L')}<span class="op">×</span>${slot(1,'H')}</div><span class="qm-optl">${esc(t('qc.open'))}</span><div class="qm-row">${slot(2,'ow')}<span class="op">×</span>${slot(3,'oh')}</div>`;
  else if(c.tool==='brick'){ const b=qb();
    rows=`<div class="qm-row">${slot(0,'L')}<span class="op">×</span>${slot(1,'H')}</div>
      ${c.bop?`<div class="qm-row">${slot(2,'ow')}<span class="op">×</span>${slot(3,'oh')}</div>`:''}
      <button class="qm-lnk" data-a="qbOpening">${ic(c.bop?'x':'plus','i xs')}${esc(t(c.bop?'qb.openDel':'qb.openAdd'))}</button>
      <span class="qm-optl">${esc(t('qb.thick'))}</span>
      <div class="qm-th">${[1,2,3,4].map(n=>`<button class="${b.halves===n?'on':''}" data-a="qbHalves" data-v="${n}" aria-pressed="${b.halves===n}"><b>${['½','1','1'+DEC()+'5','2'][n-1]}</b><small>${qbThick(b,n)} ${esc(t('qb.mm'))}</small></button>`).join('')}</div>` }
  else rows=`<div class="qm-row">${slots.map((s,i)=>(i?'<span class="op">×</span>':'')+slot(i,s)).join('')}</div>`;
  const r=qcResult();
  const b=c.tool==='brick'?qb():null;
  const extra=b?`${r&&r.sub?`<div class="qm-sub"><span>${esc(r.sub)}</span><span>${esc(r.area)}</span></div>`:''}<div class="qm-sub"><span>${esc(t('qb.spec',{l:b.l,w:b.w,h:b.h,j:b.j,s:b.s}))}</span><button data-a="qbOpen">${esc(t('qb.change'))}</button></div>`:'';
  return `<div class="qm-calc">${rows}<div class="qm-res"><span>${esc(t(r?r.k:{area:'qc.rArea',wall:'qc.rWall',vol:'qc.rVol',sum:'qc.rSum',brick:'qc.rBrick'}[c.tool]))}</span>${r&&r.err?`<em class="qm-err">${ic('alert','i s')}${esc(r.err)}</em>`:r?`<b>${r.txt}</b>`:'<b style="color:#B7C3D9">—</b>'}<button data-a="qcClear">${esc(t('qc.clear'))}</button></div>${extra}</div>`;
}

  const rs=S.readings.slice().reverse(), b=S.demo.bt, m=U.meas||(U.meas={mode:'single',live:false,val:null}), c=qc();

  const main=b!=='connected'?`<button class="btn pri" data-a="device">${ic('bt','i s')}${esc(t('qc.connect'))}</button>`
    :m.mode==='cont'?`<button class="btn pri ${m.val==null?'dis':''}" data-a="qmSaveLive">${ic('save','i s')}${esc(t('qc.saveLive'))}</button>`
    :`<button class="btn pri" data-a="qmMeasure">${ic('laser','i s')}${esc(t('qc.measure'))}</button>`;
  return `<section class="page ${U.anim||''}">${bar({right:devChip()})}<div class="h1">${esc(t('tab.measure'))}</div>${banners()}<div class="scroll" data-scroll="measure"><div class="qm">${meter}${tools}${qcCalc()}${rs.length&&!c.vals[c.tool].some(Boolean)?`<p class="qm-hint">${esc(t('qc.pick'))}</p>`:''}
    <div class="qm-sech"><b>${esc(t('qc.readings'))}</b>${rs.length?`<button data-a="qmList">${esc(t(U.qmList?'qc.hide':'qc.list'))}</button>`:''}</div>${chips}${list}</div></div>
    <div class="footer qm-foot"><div class="btnrow"><button class="btn sec" data-a="qmManual">${ic('kbd','i s')}${esc(t('ed2.manual'))}</button>${main}</div></div></section>`;

A.rpGo=d=>{ const v=appEl.querySelector('[data-rpv]'); if(!v) return; v.scrollBy({left:Number(d.v)*v.clientWidth,behavior:'smooth'}) };
function rpAfter(){
  const v=appEl.querySelector('[data-rpv]'); if(!v) return;
  const n=v.children.length, fit=()=>{ const w=v.clientWidth; v.querySelectorAll('.rp-sc').forEach(s=>{ s.style.transform=`scale(${(w/595).toFixed(4)})`; s.parentNode.style.height=Math.round(w*842/595)+'px' }) };
  const upd=()=>{ const i=Math.min(n-1,Math.max(0,Math.round(v.scrollLeft/Math.max(1,v.clientWidth)))); const el=appEl.querySelector('#rpN'); if(el) el.textContent=t('rp2.of',{i:i+1,n}); const bs=appEl.querySelectorAll('[data-a="rpGo"]'); if(bs[0]) bs[0].disabled=i===0; if(bs[1]) bs[1].disabled=i===n-1 };
  fit(); upd(); v.addEventListener('scroll',upd,{passive:true});
}
{ const base=render; render=function(){ base(); rpAfter() } }

function authDb(){ let db=null; try{ db=JSON.parse(localStorage.getItem(AUTH_KEY)||'null') }catch(e){} if(!db||typeof db!=='object') db={}; if(!db['935551234']) db['935551234']={name:'@smp.builder',pw:'metrx2026'}; return db }

const pwRules=v=>{ v=String(v||''); return {len:v.length>=8,num:/\d/.test(v),let:/\p{L}/u.test(v)} };
const pwOk=v=>{ const r=pwRules(v); return r.len&&r.num&&r.let };
function pwScore(v){ v=String(v||''); if(!v) return 0; const r=pwRules(v); let s=(r.len?1:0)+(r.num&&r.let?1:0)+(r.len&&(v.length>=12||/[^\p{L}\d]/u.test(v))?1:0); return Math.max(1,s) }

function auStep(){ const s=S.firstRunStep; return s===2?'local':(s==null||s===1)?'splash':s }
function auGo(step,dir,focus){ S.firstRunStep=step; if(step==='welcome'||step==='su1') U.exBack=null; U.auErr=null; U.codeErr=null; U.resent=false; U.showPw=false; U.gpick=false; U.langMenu=false; U.auSheet=null; blur(); if(focus) setFocus(focus[0],focus[1],focus[2]||''); U.anim=dir==='back'?'pop':'push'; commit(); render() }
function auExit(){ const fromProf=S.authFromProfile; S.firstRun=false; delete S.firstRunStep; delete S.authFromProfile; U.gpick=false; U.langMenu=false; U.auSheet=null; U.exBack=null; U.su=null; U.fp=null; blur(); if(fromProf){ S.nav.tab='profile'; S.nav.stacks.profile=[{s:'profile'}] } U.anim=null; commit(); render() }
function auSignIn(acc,msg){ S.account=acc; const b=S.settings.builder; if(!b.name&&acc.name) b.name=dn(acc.name); if(!b.phone&&acc.phone) b.phone=acc.phone; auExit(); if(msg){ toast(msg); render() } }
function auNet(){ if(S.demo.offline){ U.auErr='offline'; blur(); render(); return false } return true }
const AU_BACK={su1:'welcome',su2:'su1',su3:'su1',li:'welcome',fp1:'li',fp2:'fp1',fp3:'fp1',local:'welcome',gphone:'welcome',fpDone:'li'};
function auBack(){
  if(U.gpick){ U.gpick=false; render(); return true }
  if(U.auSheet){ U.auSheet=null; render(); return true }
  if(U.langMenu){ U.langMenu=false; render(); return true }
  const s=auStep();
  if(s==='splash'){ A.auSplashDone(); return true }
  if(s==='welcome'){ if(S.authFromProfile){ auExit(); return true } return false }
  if(s==='suDone'){ auExit(); return true }
  if(s==='fpDone'){ A.auToLogin(); return true }
  /* sent to log in or reset by the "this number has an account" sheet: Back returns to the sign-up form as it was */
  if(U.exBack&&s===U.exBack.to){ initForm(U.exBack.form); auGo('su1','back'); return true }
  const b=AU_BACK[s];
  /* going back to a phone step keeps what was already typed there */
  if(b==='su1'&&U.su) initForm({bname:U.su.name,bphone:U.su.phone});
  if(b==='fp1'&&U.fp) initForm({fpphone:U.fp.phone});
  if(b){ auGo(b,'back'); return true }
  return false;
}

A.auLogin=()=>{ const pe=phoneErr(U.form.liphone,true), pw=String(U.form.lipw||''); if(pe||!pw){ U.submitTry=true; render(); return } if(!auNet()) return; blur(); U.busy=true; U.auErr=null; render();

/* in-app keyboards for the sign-in screens: a number pad card for the phone, a 4-column pad with the SMS suggestion for the code;
   the simulated text keyboard only gets the sign-in colours */
{ const kb=keyboard; keyboard=function(){
  if(!S.firstRun||!U.focus) return kb();
  const K=k=>`<button class="k" data-a="key" data-k="${k}">${k}</button>`, BS=`<button class="k fn" data-a="key" data-k="bs" aria-label="backspace">${AUI.bsp}</button>`, GAP=`<span class="k gap"></span>`;
  if(U.focus.kind==='tel') return `<div class="kb aukb pad"><div class="aupad"><div class="ph"><span>${esc(t('akb.num'))}</span><button data-a="kbHide">${esc(t('common.close'))}</button></div>${['123','456','789'].map(r=>`<div class="krow">${r.split('').map(K).join('')}</div>`).join('')}<div class="krow"><button class="k fn clr" data-a="auClear">${esc(t('akb.clear'))}</button>${K('0')}${BS}</div></div></div>`;
  if(U.focus.kind==='code') return `<div class="kb aukb code"><button class="au-sugg" data-a="auPaste">${ic('send','i xs')}<b>SMS:</b><b class="c">${SMS_CODE}</b><span>(${esc(t('vc.oneTap'))})</span></button><div class="krow">${K('1')+K('2')+K('3')+BS}</div><div class="krow">${K('4')+K('5')+K('6')+GAP}</div><div class="krow">${K('7')+K('8')+K('9')+GAP}</div><div class="krow">${GAP+K('0')+GAP}<button class="k go" data-a="key" data-k="enter">${esc(t('common.done'))}</button></div></div>`;
  return kb().replace('<div class="kb','<div class="kb aukb');
} }
/* the number pad has no Next key, so a complete number moves on to the next field by itself (log in: phone → password) */
{ const tk=typeKey; typeKey=function(k){ const f=U.focus; tk(k); if(S.firstRun&&f&&f.kind==='tel'&&f.next&&/^\d$/.test(k)&&U.focus&&U.focus.id===f.id&&digits(U.form[f.id]).length===9){ const el=document.querySelector(`[data-f="${f.next}"]`); setFocus(f.next,el?el.dataset.k:'text',el?el.dataset.n:''); render() } } }

/* timers that live outside the full re-render: splash auto-advance + reading counter, SMS resend countdown */
{ const base=render; render=function(){ base(); auAfter() } }
function auAfter(){
  const s=S.firstRun?auStep():null;
  /* with a keyboard open, keep the main button in view as well as the field being typed in */
  if(s&&U.focus){ const b=appEl.querySelector('.onb.au .au-cta'), f=appEl.querySelector(`[data-f="${U.focus.id}"]`); if(b) b.scrollIntoView({block:'nearest'}); if(f) (f.closest('.fld')||f).scrollIntoView({block:'nearest'}) }
  if(s==='splash'&&!U.splashT){
    const t0=performance.now(), rm=reduceMotion();
    U.splashT=setTimeout(()=>{ U.splashT=null; A.auSplashDone() },rm?1200:3100);
    if(!rm){ const tick=now=>{ const el=document.getElementById('spVal'); if(!el||auStep()!=='splash') return; const p=Math.min(1,Math.max(0,(now-t0-1050)/520)); el.textContent=fmtLen(Math.round(5000*(1-Math.pow(1-p,3))),null,true)+' '+M(); if(p<1) requestAnimationFrame(tick) }; requestAnimationFrame(tick) }
  }
  if((s==='su2'||s==='fp2')&&(U.resendAt||0)>Date.now()&&!U.rsT){
    U.rsT=setInterval(()=>{ const el=document.getElementById('resendT'), left=Math.ceil((U.resendAt-Date.now())/1000);
      if(!el||left<=0){ clearInterval(U.rsT); U.rsT=null; if(el&&left<=0) render(); return }
      el.textContent=t('vc.resendIn',{t:'0:'+pad2(left)}) },1000);
  }
}

/* Native wrapper hook: the Android build calls this on the system Back gesture. Returns true when the prototype handled it. */
window.metrxBack=()=>{
  if(U.compare){ closeCompare(); return true }
  if(panelEl.classList.contains('open')){ panelEl.classList.remove('open'); return true }
  if(U.viewer!=null){ A.closeViewer(); return true }
  const hk=hintKey(); if(hk){ A.hintOk({v:hk}); return true }
  if(U.focus){ blur(); render(); return true }
  if(U.sheet){ A.closeSheet(); return true }
  if(S.firstRun) return auBack();
  if(stack().length>1){ A.back({}); return true }
  if(S.nav.tab!=='home'){ switchTab('home'); return true }
  return false;
};

function fitDevice(){
  deviceEl.dataset.size=S.demo.size;
  if(isFull()){ deviceEl.style.zoom=''; return }
  const dims={s:[360,740],m:[393,852],l:[440,956]}[S.demo.size];
  const avail=window.innerHeight-48; const z=Math.min(1,avail/(dims[1]+18));
  deviceEl.style.zoom=z<1?z.toFixed(3):'';
}
setInterval(()=>{ const sb=appEl.querySelector('.sb > span'); if(sb){ const d=new Date(); sb.textContent=pad2(d.getHours())+':'+pad2(d.getMinutes()) } },20000);
fitDevice(); render();
})();
