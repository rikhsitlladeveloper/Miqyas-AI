.pj-kv .btn{flex:none;min-height:40px;font-size:13.5px;padding:0 12px;text-decoration:none;color:var(--ink)}
.pj-fab{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:6px;height:54px;padding:0 20px 0 16px;border-radius:27px;background:var(--cobalt);color:#fff;font-weight:600;font-size:15px;box-shadow:0 8px 20px rgba(28,75,209,.35)}
.pj-fab:active{background:var(--cobalt2)}
.pj-fab.locked{background:var(--lockw);color:var(--ink2);box-shadow:none;border:1.5px dashed var(--ink3)}
/*@@CSS:editor@@*/
/* Room editor: big plan (A) + step card (B) + measurement list (C) in one bottom panel */
.ed2 .bar .ttl small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed2-dev{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;position:relative}
.ed2-dev .i{width:20px;height:20px}
.ed2-dev i{position:absolute;right:7px;top:7px;width:8px;height:8px;border-radius:50%;border:2px solid var(--paper)}
.ed2-dev.on{color:#0B7A5A}.ed2-dev.on i{background:#0B7A5A}
.ed2-dev.off{color:var(--amber)}.ed2-dev.off i{background:var(--amber)}
.ed2 .canvas{border-bottom:0}
.ed2-fl{position:absolute;right:10px;top:10px;display:grid;gap:8px;z-index:2}
.ed2-fl button{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 12px 0 10px;border-radius:20px;background:var(--sheet);box-shadow:var(--sh);font-size:13px;font-weight:600;color:var(--ink)}
.ed2-panel{flex:none;display:flex;flex-direction:column;max-height:64%;min-height:0;background:var(--sheet);border-radius:20px 20px 0 0;box-shadow:0 -6px 20px rgba(16,24,40,.10);position:relative;z-index:3}
.ed2-grab{flex:none;display:grid;place-items:center;width:100%;height:22px;touch-action:none}
.ed2-grab::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--rule)}
.ed2-body{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 14px;display:grid;gap:10px}
.ed2-card{display:grid;gap:10px}
.ed2-q{display:flex;align-items:flex-end;gap:10px}
.ed2-q .tx{flex:1;min-width:0;display:grid;gap:2px}
.ed2-q .tx small{font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.ed2-v{font:600 34px/1.05 var(--f-num);letter-spacing:-.01em}
.ed2-v small{font-size:16px;font-weight:500;color:var(--ink2);margin-left:3px}
.ed2-v.recv{color:var(--amber)}
.ed2-v.unset{color:var(--ink3)}
.ed2-st{flex:none;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.ed2-st.recv{background:var(--amberw);color:var(--amber)}
.ed2-st.conf{background:#E6F4EF;color:#0B7A5A}
.ed2-st.unset{background:var(--fill);color:var(--ink2)}
.ed2-acts{display:flex;gap:8px}
.ed2-acts .btn{flex:1;min-width:0;min-height:52px;border-radius:14px;font-size:15px}
.ed2-acts .btn.pri{flex:1.5}
.ed2-acts .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed2-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px;font-size:13px;color:var(--ink2)}
.ed2-foot span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed2-foot button{flex:none;display:inline-flex;align-items:center;gap:4px;color:var(--cobalt);font-weight:600;min-height:36px}
.ed2-ok{display:flex;align-items:center;gap:10px;padding:2px 0}
.ed2-ok .ic{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:#E6F4EF;color:#0B7A5A}
.ed2-ok .tx{flex:1;min-width:0;display:grid;gap:2px}
.ed2-ok b{font-size:16px;font-weight:600}
.ed2-ok small{font-size:13px;color:var(--ink2)}
.ed2-sec{display:grid;gap:4px}
.ed2-sec h4{margin:6px 0 0;font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--ink3)}
.ed2-row{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 0;border-bottom:1px solid var(--rule2);text-align:left}
.ed2-row:last-child{border-bottom:0}
.ed2-k{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:9px;background:var(--fill);font:700 13px var(--f-num)}
.ed2-k.sel{background:var(--cobalt);color:#fff}
.ed2-row .tx{flex:1;min-width:0;display:grid;gap:1px;line-height:1.25}
.ed2-row .tx b{font-size:14.5px;font-weight:600}
.ed2-row .tx small{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed2-row .val{flex:none;font:600 15.5px var(--f-num);text-align:right}
.ed2-row .val.recv{color:var(--amber)}
.ed2-row .val.unset{color:var(--ink3)}
.ed2-row .ok{flex:none;color:#0B7A5A}
.ed2-row .act{flex:none;min-height:36px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:600;background:var(--cobalt);color:#fff}
.ed2-row .act.sec{background:var(--fill);color:var(--ink)}
.ed2-wa{display:grid}
.ed2-wa .h,.ed2-wa .r{display:grid;grid-template-columns:minmax(0,1fr) 66px 58px 66px;gap:6px;align-items:center;padding:7px 0}
.ed2-wa .h{font-size:11.5px;color:var(--ink2);border-bottom:1px solid var(--rule2)}
.ed2-wa .h span:not(:first-child),.ed2-wa .r span:not(:first-child){text-align:right}
.ed2-wa .r{border-bottom:1px solid var(--rule2);font:500 14px var(--f-num)}
.ed2-wa .r span:first-child{font-family:var(--f-ui);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed2-wa .r b{font-weight:600}
.ed2-wa .tot{border-bottom:0;background:var(--fill);margin:0 -8px;padding:8px;border-radius:10px}
.ed2-need{font-size:13px;color:var(--ink2);padding:6px 0}
.ed2-add{justify-self:start;display:inline-flex;align-items:center;gap:6px;min-height:40px;color:var(--cobalt);font-weight:600;font-size:14px}
.area:has(.page.ed2) .toast{top:8px;bottom:auto!important}
/*@@CSS:estimate@@*/
/* Estimate (option A): BOM table, missing values in amber */
.et{display:grid;gap:12px;padding:10px 16px 20px}
.et .banner{margin:0}
.et-miss{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--amberw);color:var(--amber);font-size:13.5px;font-weight:500}
.et-tbl{display:grid;grid-template-columns:minmax(0,1fr);background:var(--sheet);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.et-h,.et-r{display:grid;grid-template-columns:minmax(0,1fr) 52px 66px 80px;gap:4px;align-items:center;padding:8px 10px 8px 12px}
.et-h{font-size:11.5px;color:var(--ink2);border-bottom:1px solid var(--rule)}
.et-h b{font-size:14px;font-weight:600;color:var(--ink)}
.et-h span:not(:first-child),.et-r>span:not(:first-child){text-align:right}
.et-r{width:100%;min-height:50px;border-bottom:1px solid var(--rule2);text-align:left;font:500 13.5px/1.25 var(--f-num)}
.et-r:active{background:var(--fill)}
.et-r .nm{font:500 14px/1.25 var(--f-ui);overflow-wrap:anywhere;min-width:0}
.et-r .nm small{display:block;font-size:11.5px;color:var(--ink3);font-weight:400}
.et-r .sum{font-weight:600}
.et-r .miss{color:var(--amber);font-weight:700}
.et-r.lab{grid-template-columns:minmax(0,1fr) 96px}
.et-h.lab{grid-template-columns:minmax(0,1fr) 96px}
.et-add{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;color:var(--cobalt);font-weight:600;font-size:14px;border-bottom:1px solid var(--rule2)}
.et-sub{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:var(--fill);font-size:13.5px;font-weight:600}
.et-sub span:last-child{font:600 14px var(--f-num)}
.et-empty{padding:12px;font-size:13.5px;color:var(--ink2);border-bottom:1px solid var(--rule2)}
.et-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink2)}
.et-meta button{color:var(--cobalt);font-weight:500;min-height:36px}
/*@@CSS:measure@@*/
/* Measure (option C): one-press meter + quick geometry calculator */
.qm{display:grid;gap:12px;padding:2px 16px 16px}
.qm-meter{display:grid;justify-items:center;gap:6px;padding:10px 12px 12px;background:var(--sheet);border-radius:20px;box-shadow:var(--sh)}
.qm-meter .st{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;font-size:12.5px;color:var(--ink2)}
.qm-meter .st button{color:var(--cobalt);font-weight:500;min-height:30px}
.qm-v{font:600 54px/1 var(--f-num);letter-spacing:-.02em;white-space:nowrap}
.qm-v small{font-size:22px;font-weight:500;color:var(--ink2);margin-left:4px}
.qm-meter .seg{width:100%}
.qm-meter .seg button{min-height:36px;font-size:13.5px}
.qm-live{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:18px;background:var(--fill);font-weight:600;font-size:13.5px}
.qm-tools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.qm-tools button{display:grid;justify-items:center;gap:3px;min-width:0;min-height:54px;padding:8px 1px;border-radius:12px;background:var(--sheet);box-shadow:var(--sh);font-size:11.5px;font-weight:600;color:var(--ink2);text-align:center!important}
.qm-tools button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qm-tools button.on{background:var(--cobalt);color:#fff;box-shadow:0 4px 12px rgba(28,75,209,.25)}
.qm-calc{display:grid;gap:8px;padding:12px;border-radius:18px;background:#0E1C36;color:#fff}
.qm-row{display:flex;align-items:center;gap:6px}
.qm-row .op{flex:none;color:#B7C3D9;font:600 18px var(--f-num)}
.qm-slot{flex:1;min-width:0;display:grid;justify-items:center;gap:1px;min-height:58px;padding:7px 4px;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;text-align:center!important}
.qm-slot b{font:600 20px/1.1 var(--f-num)}
.qm-slot small{max-width:100%;font-size:11px;color:#B7C3D9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qm-slot.empty{background:transparent;border:1.5px dashed rgba(255,255,255,.35)}
.qm-slot.empty b{color:#B7C3D9}
.qm-slot.act{box-shadow:0 0 0 2px #FFB547 inset}
.qm-optl{font-size:11.5px;color:#B7C3D9}
.qm-res{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.15)}
.qm-res span{font-size:13px;color:#B7C3D9}
.qm-res b{font:700 30px/1 var(--f-num);white-space:nowrap}
.qm-err{flex:1;display:flex;align-items:center;gap:5px;min-width:0;font-style:normal;font-size:13px;font-weight:600;color:#FFB547}
.qm-res button{color:#B7C3D9;font-size:13px;min-height:32px}
.qm-hint{font-size:13px;color:var(--ink2)}
.qm-chips{display:flex;flex-wrap:wrap;gap:6px}
.qm-chips button{min-height:40px;padding:0 12px;border-radius:12px;background:var(--sheet);font:600 15px var(--f-num);box-shadow:inset 0 0 0 1px var(--rule)}
.qm-chips button.used{background:var(--wash);color:var(--cobalt2);box-shadow:inset 0 0 0 1.5px var(--cobalt)}
.qm-chips button.sim{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(14,28,54,.05) 6px 12px)}
.qm-sech{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 2px}
.qm-sech b{font-size:15px;font-weight:600}
.qm-sech button{color:var(--cobalt);font-weight:500;font-size:14px;min-height:36px}
.qm-foot .btnrow .btn{min-height:56px;border-radius:16px;font-size:16px}
.qm-foot .btnrow .btn.pri{flex:1.6}
/* brick tool */
.qm-lnk{display:inline-flex;align-items:center;gap:5px;justify-self:start;min-height:44px;margin:-6px 0;color:#A9C0FF;font-size:13px;font-weight:600}
.qm-th{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;padding:3px;border-radius:12px;background:rgba(255,255,255,.1)}
.qm-th button{display:grid;justify-items:center;align-content:center;gap:1px;min-height:44px;border-radius:9px;color:#B7C3D9;text-align:center!important}
.qm-th button b{font:600 16px/1 var(--f-num)}
.qm-th button small{font-size:10.5px;white-space:nowrap}
.qm-th button.on{background:#fff;color:#0E1C36}
.qm-res b small{font:500 14px var(--f-ui);color:#B7C3D9}
.qm-sub{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:#B7C3D9}
.qm-sub span{min-width:0}
.qm-sub button{flex:none;min-height:44px;min-width:44px;margin:-8px 0;color:#A9C0FF;font-weight:600;font-size:13px}
.qb-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qb-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qb-3 .ferr,.qb-2 .ferr{font-size:12px}
/*@@CSS:board@@*/
/* Board (option A): stage strip + vertical stage lists */
.bd{display:grid;gap:10px;padding:2px 16px 20px}
.bd-pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.bd-pipe button{display:grid;justify-items:center;gap:3px;min-width:0;min-height:52px;padding:7px 2px 6px;border-radius:12px;text-align:center!important}
.bd-pipe button b{font:700 19px/1 var(--f-num)}
.bd-pipe button em{max-width:100%;font-style:normal;font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-pipe button.zero{opacity:.55}
.bd .st-measure{background:#FFF1DF;color:#8A4500}
.bd .st-estimate{background:var(--wash);color:var(--cobalt2)}
.bd .st-quote{background:#ECE7FC;color:#4A2FB0}
.bd .st-work{background:#E3E7EE;color:var(--ink)}
.bd .st-done{background:#E3F3EC;color:#0B6B4F}
.bd-sec{display:grid;gap:6px;scroll-margin-top:8px}
.bd-h{display:flex;align-items:center;gap:8px;padding:4px 2px 0;font-weight:600;font-size:15px;width:100%;text-align:left}
.bd-h .dot{width:12px;height:12px;border-radius:4px;flex:none}
.bd-h .dot.st-measure{background:#E8963A}.bd-h .dot.st-estimate{background:#5B7FE6}.bd-h .dot.st-quote{background:#8B6FE0}.bd-h .dot.st-work{background:#7C8699}.bd-h .dot.st-done{background:#2E9C78}
.bd-h .n{font:600 14px var(--f-num);color:var(--ink2)}
.bd-h .sp{flex:1}
.bd-h.fold{min-height:44px;padding:0 12px;border-radius:14px;background:var(--sheet);box-shadow:var(--sh)}
.bd-h.fold .lk{font-size:13.5px;font-weight:500;color:var(--cobalt)}
.bd-card{background:var(--sheet);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.bd-row{display:grid;padding:10px 12px 10px;border-bottom:1px solid var(--rule)}
.bd-row:last-child{border-bottom:0}
.bd-main{display:grid;gap:1px;min-width:0;width:100%;text-align:left}
.bd-main b,.bd-main span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-main b{font-size:15.5px;font-weight:600}
.bd-main span{font-size:13px;color:var(--ink2)}
.bd-lr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;min-height:40px}
.bd-tk{flex:1;min-width:0;display:flex;align-items:center;gap:7px;min-height:40px;font-size:14px;text-align:left;color:var(--ink)}
.bd-tk span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-tk small{flex:none;font:600 12.5px var(--f-num);color:var(--ink2)}
.bd-tk .i{color:var(--ink3)}
.bd-tk.muted{color:var(--ink2)}
.bd-wt{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink2)}
.bd-wt span{min-width:0}
.bd-wt.late{color:#4A2FB0;font-weight:600}
.bd-acts{flex:none;display:flex;gap:6px}
.bd-go{display:inline-flex;align-items:center;gap:3px;min-height:40px;padding:0 9px 0 12px;border-radius:12px;background:var(--wash);color:var(--cobalt2);font-size:13.5px;font-weight:600;white-space:nowrap}
.bd-call{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#E3F3EC;color:#0B6B4F}
.bd-local{padding:4px 2px 0;font-size:12.5px}
.bd-h .rot{transform:rotate(90deg)}
/*@@CSS:profile@@*/
/* Profile (option A): status first, short groups */
.pf{display:grid;padding:2px 0 20px}
.pf .lgroup{margin-top:6px}
.pf .grouph{padding-top:14px}
.pf-me{margin:0 16px;background:var(--sheet);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.pf-who{display:flex;align-items:center;gap:12px;width:100%;padding:12px 12px 8px;text-align:left}
.pf-who .tx{flex:1;min-width:0;display:grid;line-height:1.25}
.pf-who .tx b{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-who .tx small{font-size:13.5px;color:var(--ink2)}
.pf-who .ib{flex:none;background:var(--fill);border-radius:12px}
.pf-cap{display:flex;align-items:center;gap:7px;padding:8px 12px 10px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink2)}
.pf-cap .i{color:var(--ink3)}
.pf-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 16px 0}
.pf-st{display:grid;gap:3px;justify-items:start;align-content:start;min-width:0;min-height:72px;padding:10px 10px 9px;border-radius:14px;background:var(--sheet);box-shadow:var(--sh);text-align:left!important;font-size:12px;color:var(--ink2)}
.pf-st .i{color:var(--ink)}
.pf-st span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-st b{max-width:100%;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.2;overflow-wrap:anywhere}
.pf-st.ok{box-shadow:var(--sh),inset 0 0 0 1.5px #9FD3BF}
.pf-st.ok b,.pf-st.ok .i{color:#0B6B4F}
.pf-st.warn{background:#FFF1DF;box-shadow:inset 0 0 0 1.5px #F2C48A}
.pf-st.warn b,.pf-st.warn .i{color:#8A4500}
.pf-more{display:flex;align-items:center;gap:10px;margin:14px 16px 0;min-height:52px;padding:0 14px;border-radius:14px;background:var(--sheet);box-shadow:var(--sh);font-weight:600;font-size:15px;text-align:left}
.pf-more span{flex:1}
.pf-local{padding:12px 18px 0;font-size:12.5px}
/*@@CSS:report@@*/
/* Report (option A): read it first */
.rp-in{display:grid;gap:10px;padding:4px 16px 16px}
.rp-setup{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:12px;background:var(--sheet);box-shadow:var(--sh);font-weight:600;font-size:14px;color:var(--ink)}
.rp-sum{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:16px;background:#0E1C36;color:#fff}
.rp-sum div{display:grid;gap:2px;min-width:0}
.rp-sum span{font-size:12.5px;color:#B7C3D9}
.rp-sum b{font:700 22px/1.05 var(--f-num);white-space:nowrap}
.rp-sum .r{text-align:right;justify-items:end}
.rp-view{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;border-radius:6px;scrollbar-width:none}
.rp-view::-webkit-scrollbar{display:none}
.rp-pg{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:#fff;border-radius:6px;box-shadow:0 2px 14px rgba(16,24,40,.14);cursor:zoom-in;padding:0}
.rp-view .rp-pg+.rp-pg{margin-left:0}
.rp-sc{width:595px;transform-origin:0 0;text-align:left}
.rp-nav{display:flex;align-items:center;justify-content:center;gap:14px;font:600 14px var(--f-num);color:var(--ink2)}
.rp-nav .ib{background:var(--sheet);box-shadow:var(--sh);border-radius:12px}
.rp-nav .ib:disabled{opacity:.35}
.rp-nav .rp-fw .i{transform:scaleX(-1)}
.rp-hint{margin:-4px 0 0;text-align:center;font-size:12.5px;color:var(--ink2)}
.btn.rp-2l span{line-height:1.15;text-align:center}
/*@@CSS:targets@@*/
/* Touch targets (Stage 3 review): nothing tappable under 44 px on its short side.
   These controls measured 22-36 px on the emulator. Each rule only raises the size; `.app` lifts specificity
   above the base rule wherever it is defined. */
.app .ed2-st[data-a]{min-height:44px;padding:0 14px}
.app .ed2-foot button{min-height:44px}
.app .qm-meter .st button{min-height:44px}
.app .qm-meter .seg button{min-height:44px}
.app .qm-res button{min-height:44px;min-width:44px}
.app .qm-sech button{min-height:44px;min-width:44px}
.app .sech button,.app .hm-sech button{min-height:44px;min-width:44px}
.app .et-meta button{min-height:44px}
.app .hm-dev{min-height:44px}
.app .mk-sw{width:44px;height:44px}
.app .sw{width:44px;height:44px}
.app .choice .opt{min-width:44px;min-height:44px!important}
.app .btn{min-height:44px}
.app .seg button{min-height:44px}
.app button.act{min-height:44px}
.app .rp-setup,.app .ed2-add,.app .pc-top{min-height:44px}
.app .ed2-dev,.app .pj-ic{width:44px;height:44px}
.app .pwtgl,.app .au-lang,.app .devchip,.app .bd-go,.app .bd-main,.app [data-a="plSeg"]{min-height:44px}
.app .bd-call{width:44px;height:44px}
.app .bd-tk{min-height:44px}
.app .qm-chips button{min-height:44px}
.app .ed2-foot button{min-width:44px;justify-content:center}
.app .ed2-fl button{min-height:44px}
/* the panel handle stays slim; its hit area extends above and below it instead */
.app .ed2-grab{position:relative}
.app .ed2-grab::after{content:"";position:absolute;left:0;right:0;top:-12px;bottom:-10px}
.app .pwtgl{min-width:44px}
/* Toasts (Stage 3 review): on a page with a footer or the 3D controls, a bottom toast covered the main button
   for five seconds. There it appears under the app bar instead. Its action button is a full-size target. */
.app .area:has(.page > .footer) .toast,.app .area:has(.page canvas) .toast{top:60px;bottom:auto!important}
.app .toast button{min-height:44px;min-width:44px}
.app .toast{border-radius:12px}

/* Layering (found while capturing screenshots): floating "+" buttons must not sit on top of an open bottom sheet,
   and the readings chip keeps its own height when the plan area shrinks behind a sheet. */
.area:has(.sheet) .pj-fab,.area:has(.sheet) .pl-fab,.area:has(.sheet) .ws-fab{display:none}
.app .rtray{height:44px;top:auto}
/*@@CSS:auth@@*/
/* auth: opening animation, welcome, sign up, log in, forgot password.
   Look taken from the founder's Figma file (white pages, light-blue outlines, IBM Plex Sans + Mono, blue #3355B4).
   The colours are scoped to .app.auth, so the rest of the app keeps its own palette. */
.app.auth{--cobalt:#3355B4;--cobalt2:#27448F;--wash:#EBF2FC;--paper:#FFFFFF;--ink:#0B1226;--ink2:#56627A;--ink3:#626E87;--au-line:#C9D6E8;--au-hair:#E7ECF3;--au-tint:#F1F6FA;--au-kb:#F3F4F9;--f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
.au-ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.au-ic.s{width:18px;height:18px}
.au-flag{width:22px;height:16px;flex:none}

/* ---------- opening animation ---------- */
.au-splash{flex:1;width:100%;display:grid;place-items:center;align-content:center;gap:26px;background:#fff;color:var(--ink)}
.au-plan{display:block;width:100%;height:100%}
.au-splash .au-plan{width:min(86%,340px);height:auto}
.au-splash .au-wm{font:700 30px/1 var(--f-mono);letter-spacing:.26em;padding-left:.26em}
.au-splash .au-wm span{display:inline-block;animation:auWm .45s cubic-bezier(.3,.7,.2,1) backwards}
.w-walls{stroke-dasharray:1}
.splash .w-beam{stroke-dasharray:1}
.splash .w-walls{animation:auDraw 1s ease-in-out .1s backwards}
.splash .w-open{animation:auFade .3s ease 1s backwards}
.splash .w-beam{animation:auDraw .5s ease-out 1.05s backwards}
.splash .w-dot{animation:auFade .1s linear 1.5s backwards}
.splash .w-read{animation:auFade .2s ease 1.05s backwards,auOut .35s ease 2.05s forwards}
.splash .w-dimx,.splash .w-dimy{animation:auFade .35s ease 1.75s backwards}
.splash .w-lab{animation:auFade .35s ease 1.9s backwards}
@keyframes auDraw{from{stroke-dashoffset:1}}
@keyframes auFade{from{opacity:0}}
@keyframes auOut{to{opacity:0}}
@keyframes auWm{from{opacity:0;transform:translateY(10px)}}
@keyframes auUp{from{transform:translateY(100%)}}
@keyframes auRise{from{opacity:0;transform:translateY(10px)}}

/* ---------- welcome ---------- */
.auw-s{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:13px;padding:4px 20px 10px}
.auw.in .auw-s>*{animation:auRise .45s cubic-bezier(.3,.7,.2,1) backwards}
.auw.in .auw-s>:nth-child(n+3){animation-delay:.08s}
.auw.in .auw-s>:nth-child(n+5){animation-delay:.16s}
.auw-top{flex:none;display:flex;align-items:center;gap:10px;min-height:48px;container-type:inline-size}
.auw-top .au-x{margin-left:-12px}
.auw-wm{display:inline-flex;align-items:center;gap:9px;font:700 17px/1 var(--f-mono);letter-spacing:.2em;color:var(--ink)}
.auw-wm i{width:8px;height:8px;border-radius:50%;background:var(--cobalt)}
.auw-tag{flex:1;min-width:0;padding-left:10px;border-left:1px solid var(--au-line);font:500 10.5px/1.6 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.auw-top .sp{flex:1}
@container (max-width:356px){.auw-tag{display:none}}
.au-lang{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px 0 12px;border-radius:999px;border:1.5px solid var(--au-line);background:#fff;color:var(--ink);font-size:13.5px;font-weight:600}
.au-lang .i{color:var(--cobalt)}
.au-lang .au-ic{color:var(--ink2)}
.au-lang:active{background:var(--wash)}
.au-menu{position:absolute;right:20px;top:58px;z-index:6;display:grid;gap:2px;min-width:210px;padding:6px;background:#fff;color:var(--ink);border:1px solid var(--au-hair);border-radius:14px;box-shadow:0 12px 32px rgba(11,18,38,.18)}
.au-menu button{min-height:44px;padding:0 12px;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.au-menu button.on{background:var(--wash);color:var(--cobalt2);font-weight:600}
.auw-card{flex:1 1 210px;min-height:158px;max-height:330px;display:flex;flex-direction:column;border:1.5px solid var(--au-line);border-radius:16px;background:#fff;box-shadow:0 6px 18px rgba(51,85,180,.07);overflow:hidden}
.auw-ch,.auw-cf{flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap;font:500 10.5px/1.5 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.auw-ch{padding:10px 12px 0}
.auw-ch .chip{display:inline-flex;align-items:center;gap:6px;min-height:22px;padding:0 9px;border-radius:999px;background:#D3DFEF;border:0;font:inherit;font-weight:600;letter-spacing:inherit}
.auw-ch .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cobalt)}
.auw-ch .r{color:var(--cobalt)}
.auw-ch .r b,.auw-cf b{font-weight:500;text-transform:none;letter-spacing:.02em}
.auw-pl{flex:1;min-height:0;padding:2px 8px}
.auw-cf{margin:0 12px;padding:8px 0 9px;border-top:1px solid var(--au-hair);font-weight:600}
.auw-cf b{color:var(--cobalt)}
.auw-s h1{margin:4px 0 0;font-size:27px;font-weight:700;letter-spacing:-.015em;line-height:1.18;color:var(--ink);text-wrap:balance}
.auw-s .lead{margin-top:-6px;color:var(--ink2);font-size:15px;line-height:1.45}
.auw-s .banner{margin:0}
.au-btns{flex:none;display:grid;gap:10px;margin-top:4px}
.app.auth .btn{min-height:52px;border-radius:12px;font-size:16px}
.app.auth .btn.pri{box-shadow:0 6px 14px rgba(51,85,180,.22)}
.app.auth .btn.pri.dis{box-shadow:none}
.app.auth .btn.out,.app.auth .btn.gbtn{background:#fff;border:1.5px solid var(--au-line);color:var(--ink)}
.app.auth .btn.out:active,.app.auth .btn.gbtn:active{background:var(--wash)}
.app.auth .btn.gbtn{font-size:15px}
.gbtn svg,.gchip svg,.gsheet .gh>svg,.gico svg{width:20px;height:20px;flex:none}
.au-or{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:13px}
.au-or::before,.au-or::after{content:"";flex:1;height:1px;background:var(--au-hair)}
.au-skip{flex:none;display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px 12px 12px;border:1.5px solid var(--au-line);border-radius:14px;background:var(--au-tint);text-align:left}
.au-skip:active{background:var(--wash)}
.au-skip .dv{width:44px;height:44px;flex:none;display:grid;place-items:center;border:1px solid var(--au-line);border-radius:10px;background:#fff;color:var(--cobalt)}
.au-skip .tx{flex:1;min-width:0;display:grid;gap:3px}
.au-skip .t1{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap}
.au-skip b{color:var(--ink);font-weight:600;font-size:15px}
.au-skip .tag{padding:3px 7px;border-radius:4px;background:var(--cobalt);color:#fff;font:600 10px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.au-skip small{color:var(--ink2);font-size:13px;line-height:1.35}
.au-skip>.i:last-child{color:var(--cobalt)}
.au-terms{flex:none;margin-top:auto!important;padding-top:2px;font-size:12px;color:var(--ink3);text-align:center;line-height:1.45;text-wrap:balance}
.au-terms u,.au-foot u{color:var(--ink2);font-weight:500;text-underline-offset:2px}

/* ---------- steps: header, progress, body ---------- */
.aup .bar{min-height:56px;padding:0 8px}
.au-ttl{text-align:center;padding-left:0}
.aup .bar .ttl b{font-weight:700}
.aup .bar .ttl small{font-family:var(--f-mono);font-size:12.5px;color:var(--ink2)}
.au-steps{flex:none;display:flex;gap:8px;padding:0 20px 12px}
.au-steps i{height:4px;flex:1;border-radius:2px;background:#E4E9ED}
.au-steps i.on{background:var(--cobalt)}
.au-hr{flex:none;height:1px;background:var(--au-hair)}
.onb.au{gap:16px;padding:22px 20px 20px}
.onb.au h2{font-size:26px;letter-spacing:-.012em;color:var(--ink);text-wrap:balance}
.onb.au .lead{margin-top:-8px;font-size:15px;line-height:1.45}
.onb.au .banner{margin:0}
.onb.au .lead b,.au-bs p b{color:var(--ink);font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.au-link{color:var(--cobalt);font-weight:600;min-height:44px;display:inline-flex;align-items:center;padding:0 4px}
.au-row{display:flex;align-items:center;justify-content:center;gap:2px 6px;flex-wrap:wrap;font-size:14.5px;color:var(--ink2);text-align:center}
.au-row.r{justify-content:flex-end;margin-top:-10px}
.au-row.sp{justify-content:space-between;font-size:14px}
.au-row.sp .dv{width:1px;height:16px;background:var(--au-line)}
.au-row #resendT{min-height:44px;display:inline-flex;align-items:center;font-variant-numeric:tabular-nums}
.au-foot{flex:none;padding:8px 20px 12px;font-size:12px;color:var(--ink3);text-align:center;line-height:1.45;text-wrap:balance}
.app.auth .footer{padding:10px 20px 12px;box-shadow:0 -1px 0 var(--au-hair)}
.app.auth .note{color:var(--ink2)}

/* ---------- fields ---------- */
.auf>label{font-size:13.5px;font-weight:600;color:var(--ink2)}
.aubox{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 4px 0 14px;border:1.5px solid var(--au-line);border-radius:12px;background:#fff}
.aubox.f{border-color:var(--cobalt);box-shadow:0 0 0 1px var(--cobalt),0 0 0 4px var(--wash)}
.aubox.bad{border-color:var(--err)}
.aubox.f.bad{box-shadow:0 0 0 1px var(--err),0 0 0 4px var(--errw)}
.aubox>.i{color:var(--ink3)}
.aubox.f>.i{color:var(--cobalt)}
.auin{flex:1;min-width:0;align-self:stretch;display:flex;align-items:center;padding:8px 10px 8px 0;font-size:16px;font-weight:500;color:var(--ink);text-align:left;cursor:text}
.auin .v{min-width:0;overflow-wrap:anywhere}
.auin .ph{color:var(--ink3);font-weight:400}
.aubox.tel{padding-left:6px}
.au-cc{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 10px;border-radius:8px;background:#F1F4FB;font:600 15px/1 var(--f-mono);color:var(--ink)}
.aubox.tel .auin{font:600 22px/1.1 var(--f-mono);letter-spacing:.01em}
.aubox.tel .auin .ph{font-weight:400}
.aubox.tel .caret{height:1.05em}
.au-clr{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:10px;color:var(--ink3)}
.au-clr:active{background:var(--wash)}
.pwtgl{flex:none;color:var(--cobalt);font-weight:600;font-size:13.5px;padding:0 10px}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%;cursor:text}
.otp span{position:relative;height:64px;display:grid;place-items:center;border:2px solid var(--au-line);border-radius:12px;background:#fff;font:600 26px/1 var(--f-mono);color:var(--ink)}
.otp span.fill{border-color:#AEBFD6}
.otp span.cur{border-color:var(--cobalt);box-shadow:0 0 0 3px var(--wash)}
.otp.bad span{border-color:var(--err);background:var(--errw)}
.pwrules{display:grid;gap:8px;margin:-2px 0 0;padding:0;list-style:none;font-size:14.5px}
.pwrules li{display:flex;align-items:center;gap:10px;color:var(--ink2)}
.pwrules li.ok{color:var(--ink)}
.pwrules li .i{width:20px;height:20px;padding:3px;border-radius:50%;background:var(--cobalt);color:#fff;stroke-width:2.6}
.pwrules .dot{width:20px;height:20px;margin:0;border-radius:50%;border:1.5px solid var(--au-line);flex:none}
.pwmeter{display:flex;align-items:center;gap:10px;margin-top:-6px;font-size:13px;color:var(--ink2)}
.pwmeter .bars{display:flex;gap:4px;flex:1}
.pwmeter .bars i{height:4px;flex:1;border-radius:2px;background:#E4E9ED}
.pwmeter .bars i.on{background:var(--cobalt)}
.pwmeter.weak .bars i.on{background:var(--amber)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;animation:auSpin .8s linear infinite;flex:none}
@keyframes auSpin{to{transform:rotate(360deg)}}

/* ---------- result screens ---------- */
.au-done{display:grid;justify-items:center;text-align:center;gap:14px;padding-top:28px}
.au-done .ok,.au-bs .ico{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--wash);border:1.5px solid #D6E2F4;color:var(--cobalt)}
.au-done .ok{width:84px;height:84px}
.au-done .ok .i{width:38px;height:38px;stroke-width:2.2}
.au-done .lead{margin-top:-4px!important}
.au-card{display:flex;align-items:center;gap:12px;width:100%;margin-top:6px;padding:12px 14px;background:#fff;border:1.5px solid var(--au-line);border-radius:14px;text-align:left}
.au-card .avatar{width:44px;height:44px;font:600 15px var(--f-mono);flex:none;background:var(--cobalt)}
.au-card .tx{display:grid;min-width:0}
.au-card small{color:var(--ink2);font:500 13.5px var(--f-mono)}
.gchip{display:inline-flex;align-items:center;gap:8px;max-width:100%;justify-self:start;padding:6px 12px 6px 8px;border-radius:999px;background:var(--au-tint);border:1px solid var(--au-line);font-size:13.5px}
.gchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- bottom sheets: "this number has an account", Google account picker ---------- */
.gscrim{position:absolute;inset:0;z-index:20;background:rgba(11,18,38,.42);animation:auFade .2s ease backwards}
.au-bs{position:absolute;left:0;right:0;bottom:0;z-index:21;display:grid;justify-items:center;gap:12px;padding:10px 24px 18px;background:#fff;color:var(--ink);border-radius:28px 28px 0 0;box-shadow:0 -10px 30px rgba(11,18,38,.18);text-align:center;animation:auUp .28s cubic-bezier(.3,.7,.2,1) backwards}
.au-bs .grab{width:48px;height:4px;border-radius:2px;background:#DAE1E9;margin-bottom:10px}
.au-bs .ico .au-ic{width:40px;height:40px;stroke-width:1.6}
.au-bs h3{margin:6px 0 0;font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
.au-bs p{margin:-4px 0 8px;font-size:15px;line-height:1.5;color:var(--ink2);text-wrap:pretty}
.app.auth .au-bs .btn.out{background:#F6F7FB;border-color:#E1E5EE}
.au-bs .au-link{margin-top:2px}
.gsheet{position:absolute;left:0;right:0;bottom:0;z-index:21;padding:18px 0 12px;background:#fff;color:#1F1F1F;border-radius:28px 28px 0 0;box-shadow:0 -10px 30px rgba(11,18,38,.18);animation:auUp .28s ease backwards}
.gsheet .gh{display:grid;justify-items:center;gap:6px;padding:0 20px 14px;text-align:center;border-bottom:1px solid var(--au-hair)}
.gsheet .gh b{font-size:18px;font-weight:600}
.gsheet .gh small{color:var(--ink2);font-size:14px}
.gacc{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 20px;border-bottom:1px solid var(--au-hair);text-align:left}
.gacc:active{background:var(--au-tint)}
.gacc .av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:#0B7A5A;color:#fff;font-weight:600;font-size:14px}
.gacc .av.add{background:var(--au-tint);color:var(--ink2)}
.gacc .tx{display:grid;min-width:0}
.gacc small{color:var(--ink2);font-size:13.5px;overflow:hidden;text-overflow:ellipsis}
.gsheet .gn{display:flex;gap:8px;align-items:flex-start;padding:12px 20px 0;font-size:12.5px;color:var(--ink2);line-height:1.4}
.gico{width:36px;height:36px;padding:8px;border-radius:10px;background:var(--fill);display:grid;place-items:center;flex:none}

/* ---------- in-app keyboards ---------- */
.kb.aukb{background:var(--au-kb);border-top:1px solid #E3E7EF;padding:8px 6px 6px;gap:7px}
.kb.aukb .k{border-radius:8px;box-shadow:0 1px 0 rgba(11,18,38,.1);color:var(--ink)}
.kb.aukb .k.fn{background:#DBDFE8}
.kb.aukb .k.go{background:var(--cobalt);color:#fff}
.kb.aukb .kbh{color:var(--ink2)}
.kb.aukb.code{padding:10px 12px 8px;gap:8px}
.kb.aukb.code .krow,.kb.aukb.pad .krow{gap:8px}
.kb.aukb.code .k,.kb.aukb.pad .k{height:52px;border-radius:12px;font:600 20px/1 var(--f-mono)}
.kb.aukb.code .k.gap{visibility:hidden}
.kb.aukb.code .k.go{font:600 15px/1 var(--f-ui);box-shadow:0 4px 10px rgba(51,85,180,.2)}
.au-sugg{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;width:100%;min-height:44px;padding:6px 12px;border:1.5px solid var(--au-line);border-radius:12px;background:#fff;font-size:13.5px;color:var(--ink2)}
.au-sugg:active{background:var(--wash)}
.au-sugg .i{color:var(--cobalt)}
.au-sugg b{color:var(--ink);font-weight:600}
.au-sugg b.c{color:var(--cobalt);font-family:var(--f-mono)}
.kb.aukb.pad{background:#fff;border-top:0;padding:0 16px 8px}
.aupad{display:grid;gap:8px;padding:2px 10px 10px;border-radius:20px;background:#EEF2FC}
.aupad .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 6px;font:500 10.5px/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.aupad .ph button{min-height:44px;min-width:44px;padding:0 4px;font:600 13.5px/1 var(--f-ui);letter-spacing:0;text-transform:none;color:var(--cobalt)}
.kb.aukb.pad .k{height:48px;border-radius:10px;box-shadow:0 1px 2px rgba(51,85,180,.1)}
.kb.aukb.pad .k.fn{background:#E6EBFA;box-shadow:none}
.kb.aukb.pad .k.clr{font:600 11px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
@media (prefers-reduced-motion:reduce){.auw.in .auw-s>*,.au-bs,.gsheet,.gscrim{animation:none}}
/*@@CSS:authend@@*/
/* location */
.loc{background:var(--sheet);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.loc .map{height:120px;position:relative;background:#E9EEF5;background-image:linear-gradient(90deg,rgba(255,255,255,.9) 6px,transparent 6px),linear-gradient(rgba(255,255,255,.9) 5px,transparent 5px),linear-gradient(90deg,rgba(255,255,255,.55) 2px,transparent 2px),linear-gradient(rgba(255,255,255,.55) 2px,transparent 2px);background-size:110px 100%,100% 70px,28px 100%,100% 24px;background-position:40px 0,0 30px,0 0,0 0}
.loc .map .pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-90%);color:var(--cobalt)}
.loc .map .pin .i{width:34px;height:34px;fill:var(--sheet)}
.loc .map .acc{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(28,75,209,.14);border:1px solid rgba(28,75,209,.35)}
.loc .meta{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:14px}
.loc .meta b{font-family:var(--f-num);font-weight:600}
.loc .acts{display:flex;border-top:1px solid var(--rule2)}
.loc .acts button{flex:1;min-height:44px;color:var(--cobalt);font-weight:500;font-size:14px;text-align:center!important}
.loc .acts button+button{border-left:1px solid var(--rule2)}
.fromset{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--fill);font-size:13.5px;color:var(--ink2)}
.fromset button{color:var(--cobalt);font-weight:600;white-space:nowrap}
/* editor extras: readings tray, hints, switches, opening chooser */
.scrim,.sheet{z-index:3}
.kv .tot b{font:600 15px var(--f-num);border-bottom:0}
.kv .tot span{font-size:14px;color:var(--ink)}
.rtray{position:absolute;left:12px;bottom:12px;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px 0 10px;border-radius:22px;background:var(--sheet);box-shadow:var(--sh);font-size:13.5px;font-weight:600;color:var(--ink)}
.rtray .n{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--cobalt);color:#fff;font-size:12px;padding:0 5px}
.rtray .n.z{background:var(--fill);color:var(--ink2)}
.bigopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bigopt{display:grid;justify-items:center;gap:8px;padding:14px 6px 12px;border-radius:14px;background:var(--fill);font-weight:600;font-size:14px;text-align:center!important;min-height:96px}
.bigopt .i{width:30px;height:30px;color:var(--cobalt)}
.bigopt[disabled]{opacity:.5;cursor:default}
.bigopt small{font-weight:400;font-size:11.5px;color:var(--ink2)}
.actrow{display:flex;gap:4px;overflow-x:auto;margin:0 -4px;scrollbar-width:none}
.actrow::-webkit-scrollbar{display:none}
.actrow button{flex:0 0 auto;min-width:70px;display:grid;justify-items:center;gap:4px;padding:8px 6px;border-radius:12px;font-size:12.5px;color:var(--cobalt);text-align:center!important}
.actrow button .i{width:24px;height:24px}
.actrow button.danger{color:var(--err)}
.actrow button[disabled]{opacity:.4}
.switch{width:46px;height:28px;border-radius:14px;background:var(--rule);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.25);transition:transform .15s}
.switch.on{background:var(--cobalt)}
.switch.on::after{transform:translateX(18px)}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;width:100%;text-align:left;border-bottom:1px solid var(--rule2)}
.chk .i{color:var(--cobalt)}
.hint-ov{position:absolute;inset:0;z-index:6;background:rgba(14,28,54,.45);display:grid;place-items:center;padding:24px}
.hint-card{width:100%;max-width:320px;background:var(--sheet);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(14,28,54,.35)}
.hint-card .hh{display:flex;align-items:center;gap:8px;padding:12px 8px 8px 16px;font-weight:600;font-size:14px;color:var(--ink2)}
.hint-card .hh .i{color:var(--cobalt)}
.hint-card .ill{background:var(--fill);display:grid;place-items:center;padding:14px}
.hint-card .hb{padding:14px 16px 16px;display:grid;gap:10px}
.hint-card h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.hint-card p{color:var(--ink2);font-size:14.5px}
.kb .kbh .nav{display:flex;gap:2px}
.kb .kbh .nav button{min-width:36px;min-height:28px;font-size:18px;font-weight:600}
.kb .kbh .nav button[disabled]{opacity:.3}
/* ---- module: wall view ---- */
/* wall view (Devor ko‘rinishi) */
.wv-pager{display:flex;align-items:center;gap:4px;padding:0 8px 6px}
.wv-pager .ib{color:var(--cobalt);border-radius:12px}
.wv-pager .ib .i{width:24px;height:24px}
.wv-dots{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
.wv-dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);box-shadow:inset 0 0 0 1px var(--ink3)}
.wv-dots i.on{width:12px;height:12px;background:var(--ink);box-shadow:none}
.wv-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wv-elev{margin:0 16px;background-color:var(--sheet);background-image:linear-gradient(var(--rule2) 1px,transparent 1px),linear-gradient(90deg,var(--rule2) 1px,transparent 1px);background-size:23px 23px;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;touch-action:pan-y}
.wv-top{display:flex;align-items:center;gap:10px;padding:8px 10px 0}
.wv-loc{flex:none;width:80px;height:62px;display:grid;place-items:center;border-radius:12px;background:var(--sheet);box-shadow:0 0 0 1px var(--rule),0 2px 6px rgba(16,24,40,.08)}
.wv-loc:active{background:var(--wash)}
.wv-cap{min-width:0;font-size:12.5px;line-height:1.3;color:var(--ink2)}
.wv-draw svg{display:block;width:100%;height:auto}
.wv-draw svg [data-a]{cursor:pointer}
.wv-in-next{animation:wvInN .22s ease-out}
.wv-in-prev{animation:wvInP .22s ease-out}
@keyframes wvInN{from{transform:translateX(28px);opacity:.35}}
@keyframes wvInP{from{transform:translateX(-28px);opacity:.35}}
.wv-ban{margin:10px 16px 0}
.wv-stats{display:grid;gap:8px;padding:12px 16px 0}
.wv-cnt{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--fill);font-size:12.5px;font-weight:600}
.wv-strip{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 10px;scroll-snap-type:x proximity;scrollbar-width:none}
.wv-strip::-webkit-scrollbar{display:none}
.wv-op{flex:none;width:152px;min-height:96px;scroll-snap-align:start;display:grid;align-content:start;gap:3px;padding:10px 12px;background:var(--sheet);border-radius:14px;box-shadow:var(--sh);text-align:left}
.wv-op:active{background:var(--wash)}
.wv-op.sel{box-shadow:0 0 0 2px var(--cobalt),var(--sh)}
.wv-op.bad{box-shadow:inset 3px 0 0 var(--err),var(--sh)}
.wv-op.bad.sel{box-shadow:inset 3px 0 0 var(--err),0 0 0 2px var(--cobalt),var(--sh)}
.wv-op .wv-ot{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14.5px;color:var(--ink);min-width:0}
.wv-op .wv-ot>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wv-op .wv-ot .i{color:var(--cobalt)}
.wv-op .wv-sz{font:600 16px var(--f-num)}
.wv-op small{font-size:12.5px;color:var(--ink2);overflow-wrap:anywhere}
.wv-op small.wv-badtx{display:flex;align-items:center;gap:4px;color:var(--err);font-weight:600}
.wv-none{padding:0 16px 6px}
.wv-addrow{display:flex;justify-content:center;padding:8px 16px 24px}
.wv-add{min-width:200px;border-radius:999px}
.wv-opl{display:flex;align-items:center;gap:10px}
.wv-opl .i{color:var(--cobalt)}

/*@@CSS:wallview@@*/
/* ---- module: sketch ---- */
/* sketch module: polygon rooms */
.sk-pad{touch-action:none;cursor:crosshair;overflow:hidden}
.sk-pad svg{touch-action:none}
.sk-tip{position:absolute;left:16px;right:16px;top:14px;display:flex;gap:8px;align-items:center;justify-content:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.94);color:var(--ink2);font-size:14px;line-height:1.3;text-align:center;pointer-events:none;box-shadow:var(--sh)}
.sk-tip .i{color:var(--cobalt)}
.sk-msg{margin:8px 16px;flex:none}
.sk-msg .tx{min-width:0}
.sk-snap{min-height:44px}
.sk-snap[aria-pressed="true"]{border-color:var(--cobalt);background:var(--wash);color:var(--cobalt2);font-weight:600}
.sk-snap .i{flex:none}
.sk-chips .chip{min-height:44px}
.sk-bar{align-items:center;gap:8px}
.sk-bar>.i{color:var(--cobalt)}
.sk-bartx{flex:1 1 auto;min-width:0;font-size:13px;line-height:1.25;color:var(--ink2);white-space:normal}
.sk-bar .btn.sm{flex:none;min-height:44px}
.sk-edit{touch-action:none}
.sk-edit [data-skv]{cursor:grab}
.sk-legend{position:absolute;left:10px;bottom:8px;display:flex;flex-wrap:wrap;gap:2px 12px;max-width:calc(100% - 20px);padding:3px 9px;border-radius:8px;background:rgba(255,255,255,.9);font-size:12px;color:var(--ink2);pointer-events:none}
.sk-legend b{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.hintline.sk-hint{font-size:13.5px;line-height:1.3;padding:2px 12px}
.hintline.sk-hint button{text-align:center!important;justify-content:center}
.banner.sk-hint{flex:none;margin:0;border-radius:0;font-size:13px}
.banner.sk-hint .act{min-height:44px}
.sk-msg .act{min-height:44px}
.sk-walls .opt{min-height:44px;min-width:56px;padding:0 12px;justify-content:center}
.sk-walls .opt small{font-family:var(--f-num)}

/*@@CSS:sketch@@*/
/* report pages */
.pages{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px}
.pthumb{flex:none;border:1px solid var(--rule);background:#fff;position:relative;overflow:hidden;cursor:zoom-in;box-shadow:0 2px 6px rgba(14,28,54,.12)}
.pthumb .pn{position:absolute;right:4px;bottom:4px;background:var(--ink);color:#fff;font-size:11px;padding:1px 6px;border-radius:2px}
.a4{width:595px;height:842px;background:#fff;color:#0E1C36;padding:36px 38px;font:400 10px/1.35 var(--f-ui);position:relative;overflow:hidden;transform-origin:0 0;text-align:left}
.a4 .rh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1.5px solid #0E1C36;padding-bottom:8px;margin-bottom:12px}
.a4 .rh .wm{font:700 14px var(--f-num);letter-spacing:.14em}
.a4 .rh h1{margin:0;font-size:18px;font-weight:600;text-align:right}
.a4 .rh small{display:block;text-align:right;font-size:10px;color:#3E4A61}
.a4 table{width:100%;border-collapse:collapse;margin:6px 0 10px}
.a4 th,.a4 td{border:0.75px solid #9AA8BF;padding:3px 5px;text-align:left;vertical-align:top}
.a4 th{font-weight:600;background:#F3F6FA;font-size:9px}
.a4 .r{text-align:right;font-family:var(--f-num)}
.a4 h2{font-size:12px;margin:12px 0 4px;font-weight:600}
.a4 .tb td{width:50%}
.a4 .tb span{display:block;font-size:8.5px;color:#3E4A61}
.a4 .roomblk{display:grid;grid-template-columns:270px 1fr;gap:14px;align-items:start}
.a4 .roomblk svg{width:270px;height:auto;border:0.75px solid #C3CEDF}
.a4 .views{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.a4 .views img{width:100%;border:0.75px solid #C3CEDF;display:block}
.a4 .gt td{font-weight:700;font-size:11px}
.a4 .gt .r{border-bottom:3px double #0E1C36}
.a4 .fn{font-size:8.5px;color:#3E4A61;margin-top:4px}
.a4 .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:22px;font-size:9px;color:#3E4A61}
.a4 .sig div{border-top:0.75px solid #0E1C36;padding-top:3px}
.a4 .pf{position:absolute;left:38px;right:38px;bottom:20px;display:flex;justify-content:space-between;font-size:8.5px;color:#5F6B82}
.a4 .wmk{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) rotate(-30deg);font:700 86px var(--f-num);color:rgba(28,75,209,.07);letter-spacing:.1em;pointer-events:none;white-space:nowrap}
.a4 .prov{color:#9A4D00;font-style:italic}
.viewer{position:absolute;inset:0;background:#2A3346;display:flex;flex-direction:column;z-index:5}
.viewer .vb{flex:none;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;color:#fff;background:#0E1C36;min-height:52px}
.viewer .vb b{flex:1;font-weight:600}
.viewer .vs{flex:1;overflow:auto;padding:12px;display:grid;gap:12px;justify-items:center;align-content:start;justify-content:safe center}

/* toast + keyboard */
.toast{position:absolute;left:12px;right:12px;bottom:12px;background:var(--ink);color:#fff;border-radius:4px;padding:10px 8px 10px 14px;display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.35;animation:up .2s;z-index:4;box-shadow:0 8px 20px rgba(14,28,54,.3)}
.toast .tx{flex:1;min-width:0}
.toast button{color:#A9C0FF;font-weight:600;min-height:36px;padding:0 8px;white-space:nowrap}
.kb{flex:none;background:#D3D8E0;padding:4px 4px 6px;display:grid;gap:6px;border-top:1px solid #B9C0CC;user-select:none}
.kb .kbh{display:flex;align-items:center;justify-content:space-between;padding:0 4px;font-size:11.5px;color:#3E4A61;min-height:24px}
.kb .kbh button{font-size:12px;font-weight:600;color:#0E1C36;padding:2px 6px}
.kb .krow{display:flex;gap:5px;justify-content:center}
.kb .k{flex:1;min-width:0;height:44px;border-radius:6px;background:#fff;box-shadow:0 1.5px 0 #9AA3B2;display:grid;place-items:center;font:500 19px var(--f-ui);color:#0E1C36;text-align:center!important}
.kb .k:active{background:#B7C3D9}
.kb .k.fn{background:#AEB6C4;font-size:14px;font-weight:600}
.kb .k.go{background:var(--cobalt);color:#fff;font-size:14px;font-weight:600}
.kb.txt .k{height:42px;font-size:17px}
.kb.txt .krow{gap:4px}

/* overflow marker for language review */
.ovf-mark{outline:2px solid #E5484D!important;outline-offset:-1px;background-color:rgba(229,72,77,.12)!important}
</style>

const cyrCache={};
function cyr(s){
  if(cyrCache[s]) return cyrCache[s];
  const out=s.split(/(⟦[^⟧]*⟧|\{[^}]*\})/).map(part=>{
    if(part.startsWith('⟦')||part.startsWith('{')) return part;
    return part.split(/(\s+)/).map(w=>(/^[A-Z0-9²№%+\-.,:;()]+$/.test(w)&&/[A-Z]{2}|\d/.test(w))?w:cyrWord(w)).join('');

  return cyrCache[s]=out;
}
function cyrWord(s){
  let o='';
  for(let i=0;i<s.length;i++){
    const c=s[i],n=s[i+1]||'',n2=s[i+2]||'',lc=c.toLowerCase(),ln=n.toLowerCase();
    const up=c!==lc&&/[a-z]/i.test(c), prev=i>0?s[i-1]:'';
    const ws=!prev||/[^a-zA-Z‘’ʻʼ']/.test(prev);
    let r=null,adv=0;
    if((lc==='o'||lc==='g')&&OK.test(n)){r=lc==='o'?'ў':'ғ';adv=1}
    else if(lc==='s'&&ln==='h'){r='ш';adv=1}
    else if(lc==='c'&&ln==='h'){r='ч';adv=1}
    else if(lc==='t'&&ln==='s'&&/[iI]/.test(n2)){r='ц';adv=1}
    else if(lc==='y'&&ln==='o'&&OK.test(n2)){r='йў';adv=2}
    else if(lc==='y'&&ln==='o'){r='ё';adv=1}
    else if(lc==='y'&&ln==='u'){r='ю';adv=1}
    else if(lc==='y'&&ln==='a'){r='я';adv=1}
    else if(lc==='y'&&ln==='e'){r='е';adv=1}
    else if(lc==='e'){r=(ws||/[aeiou]/i.test(prev))?'э':'е'}
    else if(TUT.test(c)){r=(/[a-z]/i.test(prev)&&/[a-z]/i.test(n))?'ъ':c}
    else if(/[a-z]/i.test(c)) r=CM[lc]||c;
    else r=c;
    if(up){const allUp=adv&&n&&n===n.toUpperCase()&&/[a-z]/i.test(n); r=allUp?r.toUpperCase():r[0].toUpperCase()+r.slice(1)}
    o+=r; i+=adv;
  }
  return o;
}

function parseDec(str,maxDec){

  const L=r.dims.A.v??(r.dims.A.pending?r.dims.A.pending.mm:5000), W=r.dims.B.v??(r.dims.B.pending?r.dims.B.pending.mm:4000);
  return [
    {id:'A',corner:1,len:r.dims.A.v,dimKey:'A',derived:false,p0:[0,0],p1:[L,0]},
    {id:'B',corner:2,len:r.dims.B.v,dimKey:'B',derived:false,p0:[L,0],p1:[L,W]},

}

  const pt=(w,mm,k=0)=>{const W_=WL[w],n=nrm(w);return [W_.s[0]+W_.u[0]*mm*s-n[0]*k, W_.s[1]+W_.u[1]*mm*s-n[1]*k]};
  const P_=p=>p[0].toFixed(1)+' '+p[1].toFixed(1);
  const ink='#0E1C36',ink2='#3E4A61',cob='#1C4BD1',amb='#9A4D00',paper=rep?'#FFFFFF':'#F3F6FA';
  let g='';

  const L=r.dims.A.v,W=r.dims.B.v,s=Math.min((w-14)/L,(h-14)/W),iw=L*s,ih=W*s,x=(w-iw)/2,y=(h-ih)/2,tw=Math.max(2,(r.dims.T.v||200)*s);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><rect x="${(x-tw/2).toFixed(1)}" y="${(y-tw/2).toFixed(1)}" width="${(iw+tw).toFixed(1)}" height="${(ih+tw).toFixed(1)}" fill="#fff" stroke="#0E1C36" stroke-width="${tw.toFixed(1)}"/></svg>`;

function miniPlan(r,s,l){
  const d=r.dims, ok=d.A.v!=null&&d.B.v!=null, L=ok?d.A.v:4000, W=ok?d.B.v:3000, T=d.T.v||200;
  const t_=Math.max(2.5,T*s), iw=L*s, ih=W*s, pad=18, x0=pad+t_, y0=pad+t_, x1=x0+iw, y1=y0+ih, VW=x1+t_+pad, VH=y1+t_+pad;
  const ink='#0E1C36'; let g='';
  g+=ok?`<path d="M${(x0-t_).toFixed(1)} ${(y0-t_).toFixed(1)}H${(x1+t_).toFixed(1)}V${(y1+t_).toFixed(1)}H${(x0-t_).toFixed(1)}Z M${x0.toFixed(1)} ${y0.toFixed(1)}V${y1.toFixed(1)}H${x1.toFixed(1)}V${y0.toFixed(1)}Z" fill="${ink}" fill-rule="evenodd"/>`:`<rect x="${x0}" y="${y0}" width="${iw}" height="${ih}" fill="none" stroke="#5F6B82" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  if(ok){ const WL={A:[[x0,y0],[1,0]],B:[[x1,y0],[0,1]],C:[[x1,y1],[-1,0]],D:[[x0,y1],[0,-1]]};
    r.openings.forEach(o=>{ const [st,u]=WL[o.wall], n=[-u[1],u[0]]; const P0=[st[0]+u[0]*o.off*s,st[1]+u[1]*o.off*s], P1=[st[0]+u[0]*(o.off+o.w)*s,st[1]+u[1]*(o.off+o.w)*s]; const Q0=[P0[0]-n[0]*t_,P0[1]-n[1]*t_], Q1=[P1[0]-n[0]*t_,P1[1]-n[1]*t_]; const pts=[P0,P1,Q1,Q0].map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
      g+=`<polygon points="${pts}" fill="#fff"/>`;
      if(o.type==='door'){ const R_=o.w*s, tip=[P0[0]+n[0]*R_,P0[1]+n[1]*R_]; g+=`<path d="M${P0[0].toFixed(1)} ${P0[1].toFixed(1)}L${tip[0].toFixed(1)} ${tip[1].toFixed(1)}" stroke="${ink}" stroke-width="1.4"/><path d="M${P1[0].toFixed(1)} ${P1[1].toFixed(1)}A${R_.toFixed(1)} ${R_.toFixed(1)} 0 0 1 ${tip[0].toFixed(1)} ${tip[1].toFixed(1)}" fill="none" stroke="${ink}" stroke-width=".8" stroke-dasharray="2 2"/>` }
      else g+=`<polygon points="${pts}" fill="#fff" stroke="${ink}" stroke-width=".8"/><path d="M${((P0[0]+Q0[0])/2).toFixed(1)} ${((P0[1]+Q0[1])/2).toFixed(1)}L${((P1[0]+Q1[0])/2).toFixed(1)} ${((P1[1]+Q1[1])/2).toFixed(1)}" stroke="${ink}" stroke-width=".8"/>`;
    });
    g+=`<text x="${((x0+x1)/2).toFixed(1)}" y="${(y0-t_-5).toFixed(1)}" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" fill="#3E4A61">${fmtLen(L,l)}</text><text x="${(x0-t_-5).toFixed(1)}" y="${((y0+y1)/2).toFixed(1)}" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" fill="#3E4A61" transform="rotate(-90 ${(x0-t_-5).toFixed(1)} ${((y0+y1)/2).toFixed(1)})">${fmtLen(W,l)}</text>`;
  }
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  g+=`<text x="${cx.toFixed(1)}" y="${(cy-2).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing=".05em" fill="#0E1C36">${esc(dn(r.name,l)).toUpperCase()}</text><text x="${cx.toFixed(1)}" y="${(cy+11).toFixed(1)}" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" fill="#3E4A61">${ok?fmtArea(L*W,l):'?'} ${t('u.m2',null,l)}</text>`;
  return `<svg width="${VW.toFixed(0)}" height="${VH.toFixed(0)}" viewBox="0 0 ${VW.toFixed(1)} ${VH.toFixed(1)}" font-family="IBM Plex Sans, sans-serif" role="img" aria-label="${esc(dn(r.name,l))}">${g}</svg>`;
}

    return `<div class="pad" style="padding-top:12px">${seg}${p.floors.length>1?`<div class="choice" style="margin-bottom:10px">${p.floors.map(f=>`<button class="opt ${fid===f.id?'on':''}" style="min-height:40px" data-a="pfloor" data-v="${f.id}">${esc(floorName(f))}</button>`).join('')}</div>`:''}${rs.length?`<div class="three p3d" id="three"><span class="hint">${esc(t('3d.hint'))}</span></div><p class="note" style="margin-top:10px">${ic('info','i s')}<span>${esc(t('v3d.note',{n:rs.length}))}</span></p>`:`<p class="fhint">${esc(t('v3d.none'))}</p>`}</div>`;

  });

function sheetWrap(title,body,foot,o={}){
  return `<div class="scrim ${o.light?'light':''}" data-a="closeSheet"></div><div class="sheet ${U.sheetAnim?'anim':''}" role="dialog" aria-label="${esc(title)}"><div class="grab"></div><div class="sh"><h3>${esc(title)}</h3>${o.extra||''}<button class="ib" data-a="closeSheet" aria-label="${esc(t('common.close'))}">${ic('x')}</button></div><div class="sb2" data-scroll="sheet">${body}</div>${foot?`<div class="sf">${foot}</div>`:''}</div>`;

const SHEETS={};
SHEETS.measure=(sh)=>{
  const p=P(sh.pid), r=R(p,sh.rid); const d=r.dims[sh.dim]; const b=S.demo.bt;
  const cur=d.v!=null?`${fmtLen(d.v,null,true)} ${M()} (${t('src.'+(d.src||'manual'))})`:t('ms.none');
  let body='',foot='';
  const sw=`<button class="btn ghost sm" style="justify-self:center" data-a="msPhase" data-v="${sh.phase==='manual'?'waiting':'manual'}">${ic(sh.phase==='manual'?'laser':'kbd','i s')}${esc(t(sh.phase==='manual'?'ms.useLaser':'ms.manual'))}</button>`;
  if(sh.phase==='received'&&d.pending){
    seen('received');
    body=`<div class="reading"><span class="v">${fmtLen(d.pending.mm,null,true)}</span><span class="u">${M()}</span>${d.pending.src==='sim'?simtag():''}</div>
      <div class="state">${ic('clock','i s')}<span><b>${esc(t('ms.received'))}</b> ${esc(t('ms.current',{v:cur}))}${d.pending.from==='quick'?' '+esc(t('ms.fromQuick')):''}</span></div>${sw}`;
    foot=`<div class="btnrow"><button class="btn sec" data-a="remeasure">${esc(t('ms.remeasure'))}</button><button class="btn pri" data-a="confirmDim">${ic('check','i s')}${esc(t('ms.confirm'))}</button></div>`;
  } else if(sh.phase==='waiting'&&b==='connected'){
    seen('waiting');
    body=`<div class="wait"><span class="pulse">${ic('laser','i l')}</span><b style="font-size:16px">${esc(t('ms.waiting'))}</b><span class="fhint">${esc(t('ms.current',{v:cur}))}</span></div><button class="simbtn" data-a="simReading">${ic('laser')}${esc(t('ms.simPress'))} ${simtag()}</button><p class="fhint" style="text-align:center">${esc(t('ms.simNote'))}</p>${sw}`;
  } else {
    if(b!=='connected') seen('disconnected');
    const err=lenFieldErr('ms.val',DIM_MAX[sh.dim]||100000); if(err&&U.touched['ms.val']) seen('invalid');
    body=`${b!=='connected'?`<div class="banner warn" style="margin:0">${ic('btoff','i s')}<span class="tx">${esc(t(b==='off'?'dv.offBody':b==='denied'?'dv.deniedBody':'ms.discBody'))}</span><button class="act" data-a="device">${esc(t('ms.connect'))}</button></div>`:''}
      ${field('ms.val',DIMNAME(sh.dim),{num:true,suf:M(),err,hint:t('ms.hint')})}<span class="fhint">${esc(t('ms.current',{v:cur}))}</span><p class="note">${ic('info','i s')}<span>${esc(t('ms.manualNote'))}</span></p>${b==='connected'?sw:''}`;
    foot=`<div class="btnrow"><button class="btn sec" data-a="closeSheet">${esc(t('common.cancel'))}</button><button class="btn pri ${err?'dis':''}" data-a="saveManual">${esc(t('common.save'))}</button></div>`;
  }
  return sheetWrap(DIMNAME(sh.dim),body,foot,{light:true});
};
SHEETS.opening=(sh)=>{
  const p=P(sh.pid), r=R(p,sh.rid); const F=U.form; const type=F.otype;
  const WALLS_=roomWalls(r); const wall=F.owall; const wi=Math.max(0,WALLS_.findIndex(x=>x.id===wall)); const corner=wallCorner(r,wall), nextCorner=WALLS_[(wi+1)%WALLS_.length].corner;
  const errs={}; const parsed={};
  [['ow','w',DIM_MAX.A],['oh','h',DIM_MAX.H],['ooff','off',DIM_MAX.A],['osill','sill',DIM_MAX.H]].forEach(([id,k,max])=>{ if(id==='osill'&&type!=='window') return; const res=id==='ooff'||id==='osill'?(()=>{const x=parseDec(F[id],3); if(x.err) return {err:x.err==='precision'?t('err.precision',{n:3}):t('err.'+x.err)}; return {mm:Number(x.val)}})():lenErr(F[id],max); if(res.err) errs[id]=res.err; else parsed[k]=res.mm });
  let geoErr=null;
  if(!Object.keys(errs).length){ const o={id:sh.oid||'new',type,wall,w:parsed.w,h:parsed.h,off:parsed.off,sill:type==='window'?parsed.sill:0}; const iss=openingIssue(r,o,r.openings); if(iss){ geoErr=iss; seen('invalid') } }
  const L=wallLen(r,wall);
  const dia=(()=>{ const len=L||5000; const w_=parsed.w||0, off=parsed.off||0; const sx=280/len; return `<svg viewBox="0 0 320 54" class="minidia" style="width:100%"><path d="M20 30H300" stroke="#0E1C36" stroke-width="6"/><circle cx="20" cy="30" r="5" fill="#1C4BD1"/><text x="20" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#1C4BD1">${corner}</text><text x="300" y="16" text-anchor="middle" font-size="11" fill="#3E4A61">${nextCorner}</text><rect x="${(20+off*sx).toFixed(1)}" y="25" width="${Math.max(2,w_*sx).toFixed(1)}" height="10" fill="#fff" stroke="${geoErr?'#B42318':'#1C4BD1'}" stroke-width="1.5"/><path d="M20 46H${(20+off*sx).toFixed(1)}" stroke="#1C4BD1" stroke-width="1.2"/><path d="M${(20+off*sx-5).toFixed(1)} 43l5 3-5 3" stroke="#1C4BD1" fill="none" stroke-width="1.2"/></svg>` })();
  const body=`${sh.oid?'':`<div class="seg wide">${['door','window'].map(x=>`<button class="${type===x?'on':''}" data-a="setForm" data-k="otype" data-v="${x}">${esc(t(x==='door'?'op.door':'op.window'))}</button>`).join('')}</div>`}
    <div class="fld"><span class="lab">${esc(t('op.wall'))}</span><div class="seg wide" style="overflow-x:auto">${WALLS_.map(x=>x.id).map(w=>`<button class="${wall===w?'on':''}" style="min-width:44px" data-a="setForm" data-k="owall" data-v="${w}">${w} <small style="font-weight:400">${wallLen(r,w)!=null?fmtLen(wallLen(r,w)):'?'}</small></button>`).join('')}</div></div>
    ${dia}<span class="fhint">${esc(t('op.offsetHelp',{c:corner}))}</span>
    <div class="btnrow" style="align-items:start">${field('ow',t('op.width'),{num:true,suf:M(),err:errs.ow,next:'oh'})}${field('oh',t('op.height'),{num:true,suf:M(),err:errs.oh,next:'ooff'})}</div>
    <div class="btnrow" style="align-items:start">${field('ooff',t('op.offset',{c:corner}),{num:true,suf:M(),err:errs.ooff,next:type==='window'?'osill':''})}${type==='window'?field('osill',t('op.sill'),{num:true,suf:M(),err:errs.osill}):'<div style="flex:1"></div>'}</div>
    ${geoErr?`<div class="banner err" style="margin:0">${ic('alert','i s')}<span class="tx">${esc(geoErr.msg)}</span></div>`:''}
    ${sh.oid?'':`<p class="note">${ic('info','i s')}<span>${esc(t('re.sample'))}</span></p>`}`;
  const bad=Object.keys(errs).length||geoErr;
  const foot=`<div class="btnrow">${sh.oid?`<button class="btn danger" data-a="delOpening">${ic('trash','i s')}${esc(t('common.delete'))}</button>`:`<button class="btn sec" data-a="closeSheet">${esc(t('common.cancel'))}</button>`}<button class="btn pri ${bad?'dis':''}" data-a="saveOpening">${esc(t('common.save'))}</button></div>`;
  return sheetWrap(sh.oid?t(type==='door'?'op.door':'op.window'):t('op.new.'+type),body,foot);
};

/* ============================== keyboard ============================== */
function kbFields(){ const root=appEl.querySelector('.sheet')||appEl.querySelector('.page'); return root?[...root.querySelectorAll('[data-a="focus"][data-f]')]:[] }
function kbNav(){ const f=kbFields(); const i=f.findIndex(e=>e.dataset.f===(U.focus&&U.focus.id)); return `<span class="nav"><button data-a="kbMove" data-v="-1" aria-label="previous" ${i<=0?'disabled':''}>‹</button><button data-a="kbMove" data-v="1" aria-label="next" ${i<0||i>=f.length-1?'disabled':''}>›</button></span>` }
function keyboard(){
  if(!U.focus) return '';
  const go=U.focus.kind==='area'?'↵':U.focus.next?t('common.next'):t('common.done');
  const navh=kbNav();
  if(U.focus.kind==='tel'||U.focus.kind==='code'){ const head=`<div class="kbh">${U.focus.kind==='code'?`<button class="kb-sms" data-a="auPaste">${ic('send','i xs')}${esc(t('vc.fromSms',{c:SMS_CODE}))}</button>`:`<span>+998 · ${esc(t('common.sim'))}</span>`}${navh}<button data-a="kbHide">${esc(t('common.close'))} ▾</button></div>`; return `<div class="kb">${head}${[['1','2','3','⌫'],['4','5','6',''],['7','8','9',''],['','0','','go']].map(r=>`<div class="krow">${r.map(k=>k==='go'?`<button class="k go" data-a="key" data-k="enter">${esc(go)}</button>`:k==='⌫'?`<button class="k fn" data-a="key" data-k="bs" aria-label="backspace">⌫</button>`:k===''?`<span class="k" style="visibility:hidden"></span>`:`<button class="k" data-a="key" data-k="${k}">${k}</button>`).join('')}</div>`).join('')}</div>` }
  const num=U.focus.kind==='num'&&!U.kbNum;
  const head=`<div class="kbh"><span>${num?'123':'abc'} · ${esc(t('common.sim'))}</span>${navh}<button data-a="kbHide">${esc(t('common.close'))} ▾</button></div>`;
  if(num) return `<div class="kb">${head}${[['1','2','3','⌫'],['4','5','6',','],['7','8','9','.'],['abc','0','-','go']].map(r=>`<div class="krow">${r.map(k=>k==='go'?`<button class="k go" data-a="key" data-k="enter">${esc(go)}</button>`:k==='⌫'?`<button class="k fn" data-a="key" data-k="bs" aria-label="backspace">⌫</button>`:k==='abc'?`<button class="k fn" data-a="key" data-k="abc">abc</button>`:`<button class="k" data-a="key" data-k="${k}">${k}</button>`).join('')}</div>`).join('')}</div>`;
  const cy=CUR==='ru'||CUR==='uzc';
  const rows=cy?(CUR==='uzc'?['йцукенгшўзх','фқвапролджэ','ячсмитьбюғҳ']:['йцукенгшщзх','фывапролджэ','ячсмитьбю']):['qwertyuiop','asdfghjkl‘','zxcvbnm'];
  const cap=s=>U.shift?s.toUpperCase():s;
  return `<div class="kb txt">${head}<div class="krow">${'1234567890'.split('').map(k=>`<button class="k" data-a="key" data-k="${k}">${k}</button>`).join('')}</div>${rows.map((r,i)=>`<div class="krow">${i===2?`<button class="k fn" data-a="key" data-k="shift" style="flex:1.4">⇧</button>`:''}${r.split('').map(k=>`<button class="k" data-a="key" data-k="${esc(cap(k))}">${esc(cap(k))}</button>`).join('')}${i===2?`<button class="k fn" data-a="key" data-k="bs" style="flex:1.4" aria-label="backspace">⌫</button>`:''}</div>`).join('')}<div class="krow"><button class="k fn" data-a="key" data-k="123" style="flex:1.4">123</button><button class="k" data-a="key" data-k=",">,</button><button class="k" data-a="key" data-k=" " style="flex:4">␣</button><button class="k" data-a="key" data-k=".">.</button><button class="k go" data-a="key" data-k="enter" style="flex:2">${esc(go)}</button></div></div>`;

function typeKey(k){
  const id=U.focus.id; let v=U.form[id]??'';

// Pure geometry helpers (unit-tested in node).
function wvNorm(a,b){ const dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy)||1; return [dx/l,dy/l] }
// Signed area in plan coordinates (y down). Positive = clockwise on screen, which puts the room interior on the right of each wall.
function wvSignedArea(walls){ let s=0; walls.forEach(w=>{ s+=w.p0[0]*w.p1[1]-w.p1[0]*w.p0[1] }); return s/2 }
// Mini plan locator: outline fitted into W×H, current wall endpoints, and a triangle inside the room pointing at the wall.
function wvMiniGeo(walls,idx,W,H,pad){
  let mnx=Infinity,mny=Infinity,mxx=-Infinity,mxy=-Infinity;
  walls.forEach(w=>[w.p0,w.p1].forEach(p=>{ mnx=Math.min(mnx,p[0]); mny=Math.min(mny,p[1]); mxx=Math.max(mxx,p[0]); mxy=Math.max(mxy,p[1]) }));
  const bw=Math.max(mxx-mnx,1), bh=Math.max(mxy-mny,1);
  const s=Math.min((W-2*pad)/bw,(H-2*pad)/bh);
  const ox=(W-bw*s)/2, oy=(H-bh*s)/2;
  const m=p=>[ox+(p[0]-mnx)*s, oy+(p[1]-mny)*s];
  const w=walls[idx]; const a=m(w.p0), b=m(w.p1); const u=wvNorm(w.p0,w.p1);
  const k=wvSignedArea(walls)>=0?1:-1; const n=[-u[1]*k,u[0]*k]; // inward normal
  const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const tip=[mid[0]+n[0]*3.5,mid[1]+n[1]*3.5], c=[mid[0]+n[0]*10,mid[1]+n[1]*10];
  const tri=[tip,[c[0]+u[0]*4.5,c[1]+u[1]*4.5],[c[0]-u[0]*4.5,c[1]-u[1]*4.5]];
  return {poly:walls.map(x=>m(x.p0)),a,b,tri,n,s};
}
// Chain dimension along the wall: corner → opening edges → end. len null → last segment unknown (mm:null, b:null).
function wvChain(ops,len){
  const lim=x=>Math.max(0,len!=null?Math.min(len,x):x);
  const pts=[0]; ops.forEach(o=>{ pts.push(lim(o.off),lim(o.off+o.w)) }); if(len!=null) pts.push(len);
  const u=[...new Set(pts)].sort((a,b)=>a-b); const segs=[];
  for(let i=0;i<u.length-1;i++) segs.push({a:u[i],b:u[i+1],mm:u[i+1]-u[i]});
  if(len==null) segs.push({a:u[u.length-1],b:null,mm:null});
  return segs;
}
// Window offset that centres it on the wall, rounded to 10 mm, never negative.
function wvCentre(len,w){ return Math.max(0,Math.round((len-w)/20)*10) }
function wvFit(Lx,Hx,availW,availH){ return Math.min(availW/Math.max(Lx,1),availH/Math.max(Hx,1)) }
function wvWallStats(lenMM,hMM,ops){ const open=ops.reduce((a,o)=>a+o.w*o.h,0); if(lenMM==null||hMM==null) return {gross:null,open,net:null}; const gross=lenMM*hMM; return {gross,open,net:gross-open} }
/*wv:pure-end*/

  else { st=wall.len!=null?'conf':'unset'; mm=wall.len }

}
function wvHInfo(r){ const d=r.dims.H; const st=dimStatus(d); return {st,mm:st==='recv'?d.pending.mm:st==='conf'?d.v:null} }
const wvTxt=(st,mm)=>st==='unset'||mm==null?'?':st==='recv'?fmtLen(mm,null,true):fmtLen(mm);

const wvTick=(x,y,col)=>`<path d="M${wvF(x-4)} ${wvF(y+4)}L${wvF(x+4)} ${wvF(y-4)}" stroke="${col}" stroke-width="1.6"/>`;

function wvMiniSVG(walls,i){

function wvElevSVG(r,walls,i){
  const wall=walls[i], endCorner=walls[(i+1)%walls.length].corner;
  const ink='#0E1C36',ink2='#3E4A61',cob='#1C4BD1',err='#B42318';
  const li=wvLenInfo(r,wall), hi=wvHInfo(r);
  const ops=r.openings.filter(x=>x.wall===wall.id).slice().sort((a,b)=>a.off-b.off);
  const ext=ops.reduce((m,x)=>Math.max(m,x.off+x.w),0), hTop=ops.reduce((m,x)=>Math.max(m,(x.sill||0)+x.h),0);
  const geoLen=Math.hypot(wall.p1[0]-wall.p0[0],wall.p1[1]-wall.p0[1]);

  g+=`<rect x="${wvF(x0)}" y="${wvF(yT)}" width="${wvF(ww)}" height="${wvF(wh)}" fill="#FFFFFF"/>`;
  const dl=li.st!=='conf'?'stroke-dasharray="5 4"':'', dh=hi.st!=='conf'?'stroke-dasharray="5 4"':'';
  g+=`<path d="M${wvF(x0)} ${wvF(yF)}V${wvF(yT)}M${wvF(x0+ww)} ${wvF(yF)}V${wvF(yT)}" stroke="${ink}" stroke-width="1.6" ${dl}/><path d="M${wvF(x0)} ${wvF(yT)}H${wvF(x0+ww)}" stroke="${ink}" stroke-width="1.6" ${dh}/>`;
  g+=`<path d="M${wvF(x0-14)} ${wvF(yF)}H${wvF(xE+14)}" stroke="${ink}" stroke-width="2.4"/>`;
  // corner numbers: start corner left, end corner right

    const ox=x0+o.off*s, ow=Math.max(2,o.w*s), oh=Math.max(2,o.h*s), oy=yF-((o.sill||0)+o.h)*s;
    const nm=t(o.type==='door'?'op.door':'op.window');

    if(ow>30&&oh>26) g+=`<text x="${wvF(ox+ow/2)}" y="${wvF(oy+oh/2+4)}" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" fill="${ink2}" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">${fmtLen(o.h)}</text>`;
    if(iss){ g+=`<rect x="${wvF(ox)}" y="${wvF(oy)}" width="${wvF(ow)}" height="${wvF(oh)}" fill="none" stroke="${err}" stroke-width="2.6" stroke-dasharray="4 3"/><circle cx="${wvF(ox+ow)}" cy="${wvF(oy)}" r="8" fill="${err}"/><text x="${wvF(ox+ow)}" y="${wvF(oy+4)}" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">!</text>` }
    g+=`<rect x="${wvF(ox-4)}" y="${wvF(oy-4)}" width="${wvF(ow+8)}" height="${wvF(oh+8)}" fill="transparent" data-a="editOpening" data-id="${esc(o.id)}" role="button" aria-label="${esc(nm+', '+fmtLen(o.w)+' × '+fmtLen(o.h)+' '+M()+(iss?'. '+iss.msg:''))}"/>`;

  { const yO=yF+chainH+30, col=li.st==='recv'?'#9A4D00':li.st==='unset'?'#5F6B82':ink, xb=x0+ww;

    const txt=wvTxt(li.st,li.mm), cx=(x0+xb)/2, tg=wvTag(cx,yO,li.st,txt,!!li.key&&msSel===li.key);

    g+=`<g data-a="wvDim" data-w="${esc(wall.id)}" role="button" aria-label="${esc(lab)}"><rect x="${wvF(cx-tg.wd/2-8)}" y="${wvF(yO-21)}" width="${wvF(tg.wd+16)}" height="42" fill="transparent"/>${tg.h}${src?`<text x="${wvF(cx+tg.wd/2+6)}" y="${wvF(yO+4)}" font-size="12" fill="${ink2}">= ${esc(src.id)}</text>`:''}</g>`;
  }
  // room height on the left (tap = measure H)
  { const xH=x0-26, col=hi.st==='recv'?'#9A4D00':hi.st==='unset'?'#5F6B82':ink, my=(yT+yF)/2;
    g+=`<path d="M${wvF(x0-5)} ${wvF(yT)}H${wvF(xH-6)}M${wvF(x0-5)} ${wvF(yF)}H${wvF(xH-6)}" stroke="${col}" stroke-width="0.9"/><path d="M${wvF(xH)} ${wvF(yT)}V${wvF(yF)}" stroke="${col}" stroke-width="1.1" ${hi.st!=='conf'?'stroke-dasharray="5 4"':''}/>${wvTick(xH,yT,col)}${wvTick(xH,yF,col)}`;

  return `<svg viewBox="0 0 ${VW} ${wvF(VH)}" data-s="${s}" font-family="IBM Plex Sans, sans-serif" role="group" aria-label="${esc(t('wv.title',{w:wall.id}))}"><defs>${hatch}</defs>${g}</svg>`;

PAGES.wallView=(rt)=>{
  const p=P(rt.pid), r=R(p,rt.rid); if(!r) return PAGES.projects();
  const walls=roomWalls(r); if(!walls.length) return PAGES.projects();
  let i=walls.findIndex(w=>w.id===rt.wall); if(i<0){ i=0; rt.wall=walls[0].id }
  const wall=walls[i], n=walls.length, lk=isLocked();
  const anim=U.wvAnim; U.wvAnim=null;
  const h=U.hist[r.id]||{u:[],r:[]};
  const right=`<button class="ib" data-a="undo" ${h.u.length?'':'disabled'} aria-label="${esc(t('common.undo'))}">${ic('undo')}</button><button class="ib" data-a="redo" ${h.r.length?'':'disabled'} aria-label="redo">${ic('redo')}</button>`;
  const pager=`<div class="wv-pager"><button class="ib" data-a="wvStep" data-v="-1" ${n<2?'disabled':''} aria-label="${esc(t('wv.prev'))}">${ic('back')}</button><div class="wv-dots" aria-hidden="true">${walls.map((w,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div><span class="wv-sr" aria-live="polite">${esc(t('wv.pos',{i:i+1,n}))}</span><button class="ib" data-a="wvStep" data-v="1" ${n<2?'disabled':''} aria-label="${esc(t('wv.next'))}">${ic('chev')}</button></div>`;
  const elev=`<div class="wv-elev"><div class="wv-top"><button class="wv-loc" data-a="wvToPlan" aria-label="${esc(t('wv.toPlan'))}">${wvMiniSVG(walls,i)}</button><span class="wv-cap">${esc(t('wv.inside'))}</span></div><div class="wv-draw ${anim?'wv-in-'+anim:''}">${wvElevSVG(r,walls,i)}</div></div>`;
  const ops=r.openings.filter(o=>o.wall===wall.id).slice().sort((a,b)=>a.off-b.off);
  const issues=ops.map(o=>({o,iss:openingIssue(r,o,r.openings)})).filter(x=>x.iss);
  const ban=issues.map(x=>`<div class="banner err wv-ban">${ic('alert','i s')}<span class="tx">${esc(x.iss.msg)}</span><button class="act" data-a="editOpening" data-id="${esc(x.o.id)}">${esc(t('ed.fix'))}</button></div>`).join('');
  // stats: confirmed values, else received (pending) values marked provisional, else "—"
  const li=wvLenInfo(r,wall), hi=wvHInfo(r);
  // a received reading never replaces a confirmed value in the totals; it only fills in when nothing is confirmed yet
  const cL=wall.len!=null?wall.len:(li.st==='recv'?li.mm:null), cH=r.dims.H.v!=null?r.dims.H.v:(hi.st==='recv'?hi.mm:null);
  const st=wvWallStats(cL,cH,ops); const prov=st.gross!=null&&((wall.len==null&&li.st==='recv')||(r.dims.H.v==null&&hi.st==='recv'));
  const av=v=>v==null?'—':fmtArea(v)+' '+M2();
  const stats=`<div class="wv-stats"><div class="kv"><div><span>${esc(t('wv.gross'))}</span><b>${av(st.gross)}</b></div><div><span>${esc(t('rp.openings'))}</span><b>${av(st.open)}</b></div><div class="tot"><span>${esc(t('wv.net'))}</span><b>${av(st.net)}</b></div></div>
    ${prov?`<div class="state">${ic('clock','i s')}<span>${esc(t('wv.prov'))}</span></div>`:st.gross==null?`<p class="fhint">${esc(t('wv.missing'))}</p>`:''}</div>`;
  const opSel=U.sheet&&U.sheet.type==='opening'?U.sheet.oid:null;
  const card=o=>{ const iss=openingIssue(r,o,r.openings); const nm=t(o.type==='door'?'op.door':'op.window');
    return `<button class="wv-op ${iss?'bad':''} ${opSel===o.id?'sel':''}" data-a="editOpening" data-id="${esc(o.id)}"><span class="wv-ot">${ic(o.type==='door'?'door':'window','i s')}<span>${esc(nm)}</span></span><span class="wv-sz">${fmtLen(o.w)} × ${fmtLen(o.h)} ${esc(M())}</span><small class="${opApprox(o)?'wv-approx':''}">${esc(t('wv.off',{c:wall.corner,v:(o.offDrag?'≈ ':'')+fmtLen(o.off)+' '+M()}))}</small>${o.type==='window'?`<small class="${o.sillDrag?'wv-approx':''}">${esc(t('wv.sill',{v:(o.sillDrag?'≈ ':'')+fmtLen(o.sill||0)+' '+M()}))}</small>`:''}${iss?`<small class="wv-badtx">${ic('alert','i xs')}${esc(t('room.bad'))}</small>`:''}</button>` };
  const strip=`<div class="sech"><b>${esc(t('wv.openings'))}</b><span class="wv-cnt">${ops.length}</span></div>${ops.length?`<div class="wv-strip" data-scroll="wvs-${esc(wall.id)}">${ops.map(card).join('')}</div>`:`<p class="fhint wv-none">${esc(t('wv.none'))}</p>`}

function wvStep(dir){
  const rt=top(); if(!rt||rt.s!=='wallView') return; const r=R(P(rt.pid),rt.rid); if(!r) return;
  const ws=roomWalls(r); if(ws.length<2) return; let i=ws.findIndex(w=>w.id===rt.wall); if(i<0) i=0;
  rt.wall=ws[(i+dir+ws.length)%ws.length].id; U.wvAnim=dir>0?'next':'prev'; closeSheet(true); U.anim=null; render();
}
A.wallView=d=>{
  const rt=top(); if(!rt||!rt.pid||!rt.rid) return; const r=R(P(rt.pid),rt.rid); if(!r) return;
  const ws=roomWalls(r); if(!ws.length) return;
  let want=d&&d.w; if(!want&&U.sheet&&U.sheet.type==='measure') want=(ws.find(x=>x.id===U.sheet.dim)||{}).id;
  const w=want&&ws.some(x=>x.id===want)?want:ws[0].id;
  if(rt.s==='wallView'){ if(rt.wall!==w){ rt.wall=w; render() } return }
  push({s:'wallView',pid:rt.pid,rid:rt.rid,wall:w});
};
A.wvStep=d=>wvStep(Number(d.v)||1);
A.wvToPlan=()=>{ const st=stack(); if(st.length>1){ const prev=st[st.length-2]; if(prev.s==='editor') prev.mode='plan' } pop() };
A.wvDim=d=>{
  if(!guard()) return; const rt=top(); const p=P(rt.pid), r=R(p,rt.rid); if(!r) return;
  if(d.k==='H'){ openMeasure(p.id,r.id,'H'); return }
  const ws=roomWalls(r); const w=ws.find(x=>x.id===d.w); if(!w) return;
  const key=w.dimKey; if(!key||!r.dims[key]){ toast(t('wv.computed',{w:w.id})); render(); return }
  if(w.derived){ const src=ws.find(x=>x.dimKey===key&&!x.derived); toast(t('wv.derived',{w:w.id,s:src?src.id:key})) }
  openMeasure(p.id,r.id,key);
};
A.wvAdd=()=>{ if(!guard()) return; const rt=top(); openSheet({type:'wvAdd',pid:rt.pid,rid:rt.rid,wall:rt.wall}) };
A.wvAddType=d=>{
  if(!guard()) return; const sh=U.sheet; if(!sh||sh.type!=='wvAdd') return; const p=P(sh.pid), r=R(p,sh.rid); if(!r) return;
  const w=roomWalls(r).find(x=>x.id===sh.wall); if(!w) return;
  const door=d.v==='door'; const def=(S.settings.defaults||{})[d.v]||{};
  const dw=def.w??(door?900:1200), dh=def.h??(door?2100:1500), sill=door?0:(def.sill??900);
  const off=door?500:(w.len!=null?wvCentre(w.len,dw):500);
  const fm=mm=>fmtLen(mm,null,mm%10!==0);
  initForm({otype:door?'door':'window',owall:w.id,ow:fm(dw),oh:fm(dh),ooff:fm(off),osill:fm(sill)});
  U.sheet={type:'opening',pid:p.id,rid:r.id,oid:null}; U.sheetAnim=true; render();
};

/* ---------- swipe + arrow keys ---------- */
let wvPtr=null, wvSwipeAt=0;
appEl.addEventListener('pointerdown',e=>{ const el=e.target.closest&&e.target.closest('.wv-elev'); wvPtr=el&&!U.sheet&&!S.firstRun&&top().s==='wallView'?{id:e.pointerId,x:e.clientX,y:e.clientY}:null });
appEl.addEventListener('pointerup',e=>{ const s=wvPtr; wvPtr=null; if(!s||s.id!==e.pointerId) return; const dx=e.clientX-s.x, dy=e.clientY-s.y; if(Math.abs(dx)<48||Math.abs(dx)<Math.abs(dy)*1.5) return; wvSwipeAt=Date.now(); wvStep(dx<0?1:-1) });

document.addEventListener('keydown',e=>{ if(S.firstRun||U.focus||U.sheet||U.compare||e.ctrlKey||e.metaKey||e.altKey) return; if(e.target.closest&&e.target.closest('#panel')) return; if(top().s!=='wallView') return; if(e.key==='ArrowLeft'){ e.preventDefault(); wvStep(-1) } else if(e.key==='ArrowRight'){ e.preventDefault(); wvStep(1) } });
