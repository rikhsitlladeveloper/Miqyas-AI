<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Devor A — rozetka va quvurlar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B47D9}a:hover{color:#1E36B0}
button{font:inherit}
.g{border:1px solid rgba(255,255,255,0.8);background:rgba(255,255,255,0.45);backdrop-filter:blur(28px) saturate(190%);-webkit-backdrop-filter:blur(28px) saturate(190%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,0.95),0 14px 30px rgba(30,40,110,0.13)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #EEF1F8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F172A">
  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
    <div style="position: absolute; width: 320px; height: 320px; left: -120px; top: -100px; border-radius: 50%; background: #5B7BFF; filter: blur(70px); opacity: 0.55"></div>
    <div style="position: absolute; width: 260px; height: 260px; right: -90px; top: 380px; border-radius: 50%; background: #B07CFF; filter: blur(80px); opacity: 0.4"></div>
  </div>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 56px 20px 24px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Order.dc.html" aria-label="Orqaga" class="g" style="width: 42px; height: 42px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #0F172A">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <div style="flex: 1"><div style="font-size: 19px; font-weight: 800">Devor A — ichkaridan</div><div style="font-size: 12.5px; color: #475569">Oshxona xonasi · 3400 × 2700 mm</div></div>
    </div>

    <div style="margin-top: 12px; display: flex; gap: 6px">
      <span style="height: 32px; padding: 0 14px; border-radius: 16px; background: #0F172A; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center">A · 3400</span>
      <span style="height: 32px; padding: 0 14px; border-radius: 16px; background: rgba(255,255,255,0.55); font-size: 13px; font-weight: 700; display: flex; align-items: center">B · 2600</span>
      <span style="height: 32px; padding: 0 14px; border-radius: 16px; background: rgba(255,255,255,0.55); font-size: 13px; font-weight: 700; display: flex; align-items: center">C</span>
      <span style="height: 32px; padding: 0 14px; border-radius: 16px; background: rgba(255,255,255,0.55); font-size: 13px; font-weight: 700; display: flex; align-items: center">D</span>
    </div>

    <figure style="margin: 12px 0 0; background: #fff; border-radius: 22px; padding: 12px 10px 8px; box-shadow: 0 10px 26px rgba(30,40,110,0.12)">
      <svg width="330" height="300" viewBox="0 0 370 300" role="img" aria-label="Devor A: suv, kanalizatsiya va rozetkalar joyi">
        <rect x="15" y="10" width="340" height="270" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"></rect>
        <path d="M15 194h340" stroke="#94A3B8" stroke-width="1" stroke-dasharray="5 4"></path>
        <text x="20" y="190" font-size="10" fill="#64748B" font-family="Plus Jakarta Sans, sans-serif">stoleshnitsa 860</text>
        <g>
          <circle cx="140" cy="225" r="6" fill="#2563EB"></circle>
          <circle cx="155" cy="225" r="6" fill="#DC2626"></circle>
          <circle cx="147" cy="236" r="7" fill="#64748B"></circle>
          <path d="M147 236v44" stroke="#64748B" stroke-width="1" stroke-dasharray="2 2"></path>
          <text x="166" y="223" font-size="10.5" font-weight="700" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif">suv 550</text>
          <text x="160" y="248" font-size="10.5" font-weight="700" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif">kanal. 450</text>
        </g>
        <g>
          <rect x="296" y="164" width="22" height="12" rx="2" fill="#fff" stroke="#0F172A" stroke-width="1.6"></rect>
          <path d="M302 170h.01M312 170h.01" stroke="#0F172A" stroke-width="3" stroke-linecap="round"></path>
          <text x="282" y="158" font-size="10.5" font-weight="700" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif">rozetka 1100</text>
        </g>
        <g>
          <rect x="62" y="244" width="12" height="12" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.6"></rect>
          <text x="40" y="238" font-size="10.5" font-weight="700" fill="#92400E" font-family="Plus Jakarta Sans, sans-serif">rozetka 300 ⚠</text>
        </g>
        <path d="M15 292h340" stroke="#0F172A" stroke-width="1"></path>
        <path d="M15 288v8M355 288v8" stroke="#0F172A" stroke-width="1"></path>
        <rect x="160" y="285" width="50" height="14" fill="#fff"></rect>
        <text x="185" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif">3400</text>
      </svg>
    </figure>

    <div style="margin-top: 12px; display: flex; justify-content: space-between; align-items: center">
      <h2 style="margin: 0; font-size: 16px; font-weight: 800">Nuqtalar · 5</h2>
      <button type="button" onClick="{{openSheet}}" style="cursor: pointer; height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #3550E0; color: #fff; font-size: 13.5px; font-weight: 700">+ Nuqta</button>
    </div>
    <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{points}}" as="p" hint-placeholder-count="4">
        <div class="g" style="border-radius: 16px; padding: 9px 12px; display: flex; align-items: center; gap: 10px">
          <span aria-hidden="true" style="width: 12px; height: 12px; flex: none; border-radius: 50%; background: {{p.dot}}"></span>
          <span style="flex: 1; font-size: 13.5px; font-weight: 700">{{p.name}}</span>
          <span style="font-size: 12.5px; color: #334155; font-variant-numeric: tabular-nums">{{p.pos}}</span>
          <span style="font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 9px; background: {{p.stBg}}; color: {{p.stFg}}">{{p.st}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: rgba(15,23,42,0.32)">
      <div role="dialog" aria-label="Nuqta qoʻshish" style="position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 28px 28px 0 0; padding: 18px 20px 28px; box-shadow: 0 -10px 30px rgba(15,23,42,0.2)">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <h2 style="margin: 0; font-size: 18px; font-weight: 800">Nuqta qoʻshish</h2>
          <button type="button" onClick="{{closeSheet}}" aria-label="Yopish" style="cursor: pointer; width: 36px; height: 36px; border-radius: 50%; border: 0; background: #F1F5F9; font-size: 18px">×</button>
        </div>
        <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{types}}" as="t" hint-placeholder-count="6">
            <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="cursor: pointer; height: 64px; border-radius: 16px; border: {{t.border}}; background: {{t.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 12px; font-weight: 700; color: #0F172A">
              <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: {{t.dot}}"></span>{{t.name}}
            </button>
          </sc-for>
        </div>
        <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 700; color: #475569">Chap burchakdan
            <span style="height: 48px; border-radius: 14px; border: 1.5px solid #3550E0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 16px; color: #0F172A; font-weight: 700">1250 <span style="font-size: 13px; color: #475569">mm</span></span>
          </label>
          <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 700; color: #475569">Poldan balandlik
            <span style="height: 48px; border-radius: 14px; border: 1.5px solid #CBD5E1; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 16px; color: #94A3B8; font-weight: 700">— <span style="font-size: 13px">mm</span></span>
          </label>
        </div>
        <div style="margin-top: 12px; display: flex; gap: 10px">
          <span style="flex: 1; height: 48px; border-radius: 16px; background: #F1F5F9; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700; color: #2B47D9">Lazerdan olish</span>
          <button type="button" onClick="{{closeSheet}}" style="cursor: pointer; flex: 1; height: 48px; border: 0; border-radius: 16px; background: #3550E0; color: #fff; font-size: 14px; font-weight: 700">Saqlash</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var s = this.state || {};
    var self = this;
    var pick = s.t || 'water';
    var conf = ['Tasdiqlangan', '#DCFCE7', '#166534'], recv = ['Tasdiqlang', '#FEF3C7', '#92400E'];
    var pts = [
      { name: 'Suv (sovuq)', dot: '#2563EB', pos: '1250 · 550', s: conf },
      { name: 'Suv (issiq)', dot: '#DC2626', pos: '1400 · 550', s: conf },
      { name: 'Kanalizatsiya Ø50', dot: '#64748B', pos: '1320 · 450', s: conf },
      { name: 'Rozetka (2 talik)', dot: '#0F172A', pos: '2900 · 1100', s: conf },
      { name: 'Rozetka', dot: '#B45309', pos: '520 · 300', s: recv }
    ];
    var types = [
      ['socket', 'Rozetka', '#0F172A'], ['switch', 'Viklyuchatel', '#475569'], ['water', 'Suv', '#2563EB'],
      ['sewer', 'Kanalizatsiya', '#64748B'], ['gas', 'Gaz quvuri', '#EAB308'], ['meter', 'Gaz hisoblagich', '#CA8A04']
    ];
    return {
      sheet: !!s.sheet,
      openSheet: function () { self.setState({ sheet: true }); },
      closeSheet: function () { self.setState({ sheet: false }); },
      points: pts.map(function (p) { return { name: p.name, dot: p.dot, pos: p.pos, st: p.s[0], stBg: p.s[1], stFg: p.s[2] }; }),
      types: types.map(function (t) {
        var on = pick === t[0];
        return { name: t[1], dot: t[2], on: on, pick: function () { self.setState({ t: t[0] }); },
          border: on ? '2px solid #3550E0' : '1px solid #E2E8F0', bg: on ? 'rgba(53,80,224,0.08)' : '#fff' };
      })
    };
  }
}
</script>
</body>
</html>
