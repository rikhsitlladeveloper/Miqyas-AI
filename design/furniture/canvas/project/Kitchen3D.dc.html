<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Oshxona 3D</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B47D9}a:hover{color:#1E36B0}
button{font:inherit}
.g{border:1px solid rgba(255,255,255,0.8);background:rgba(255,255,255,0.45);backdrop-filter:blur(28px) saturate(190%);-webkit-backdrop-filter:blur(28px) saturate(190%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,0.95),0 14px 30px rgba(30,40,110,0.13)}
.ctl{cursor:pointer;height:44px;border-radius:15px;border:1px solid rgba(255,255,255,0.85);background:rgba(255,255,255,0.65);font-size:13px;font-weight:700;color:#0F172A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #EEF1F8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F172A">
  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
    <div style="position: absolute; width: 300px; height: 300px; left: -120px; top: -110px; border-radius: 50%; background: #5B7BFF; filter: blur(70px); opacity: 0.5"></div>
    <div style="position: absolute; width: 260px; height: 260px; right: -90px; bottom: 80px; border-radius: 50%; background: #FFB58A; filter: blur(80px); opacity: 0.4"></div>
  </div>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 56px 16px 20px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="Kitchen.dc.html" aria-label="Orqaga" class="g" style="width: 42px; height: 42px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #0F172A">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <div style="flex: 1; min-width: 0"><div style="font-size: 18px; font-weight: 800">Oshxona 1 · 3D</div><div style="font-size: 12px; color: #475569">Eshik yoki tortmaga bosing</div></div>
      <div role="tablist" aria-label="Koʻrinish" style="display: flex; padding: 3px; border-radius: 14px; background: rgba(15,23,42,0.07)">
        <a href="Kitchen.dc.html" role="tab" style="text-decoration: none; height: 32px; padding: 0 12px; border-radius: 11px; color: #334155; font-size: 13px; font-weight: 700; display: flex; align-items: center">2D</a>
        <span role="tab" aria-selected="true" style="height: 32px; padding: 0 12px; border-radius: 11px; background: #fff; font-size: 13px; font-weight: 800; display: flex; align-items: center">3D</span>
      </div>
    </div>

    <div style="margin-top: 12px; height: 460px; border-radius: 26px; background: linear-gradient(#F4F6FB, #E3E8F2); position: relative; overflow: hidden; perspective: 1050px; box-shadow: 0 10px 26px rgba(30,40,110,0.12)">
      <div style="position: absolute; left: 50%; top: 56%; width: 0; height: 0; transform-style: preserve-3d; transform: rotateX(-22deg) rotateY({{ang}}deg)">
        <sc-for list="{{els}}" as="e" hint-placeholder-count="40">
          <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: {{e.w}}px; height: {{e.h}}px; transform-origin: {{e.o}}; transform: {{e.tf}}; background: {{e.bg}}; border: {{e.bd}}; box-sizing: border-box"></div>
        </sc-for>
        <sc-for list="{{doors}}" as="d" hint-placeholder-count="20">
          <button type="button" onClick="{{d.tap}}" aria-label="{{d.label}}" aria-pressed="{{d.on}}" style="position: absolute; left: 0; top: 0; padding: 0; margin: 0; cursor: pointer; width: {{d.w}}px; height: {{d.h}}px; transform-origin: {{d.o}}; transform: {{d.tf}}; transition: transform 0.5s ease; background: {{d.bg}}; border: 1px solid rgba(15,23,42,0.45); box-sizing: border-box; display: flex; align-items: center; justify-content: {{d.hj}}"><span style="width: {{d.hw}}px; height: {{d.hh}}px; margin: 0 3px; background: #1E293B; border-radius: 1px"></span></button>
        </sc-for>
      </div>
    </div>

    <div style="margin-top: 10px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <button type="button" class="ctl" onClick="{{left}}" aria-label="Chapga burish">↶</button>
      <button type="button" class="ctl" onClick="{{right}}" aria-label="Oʻngga burish">↷</button>
      <button type="button" class="ctl" onClick="{{openAll}}" style="grid-column: span 2">{{allLabel}}</button>
    </div>
    <div style="margin-top: 8px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <span class="ctl" style="display: flex; align-items: center; justify-content: center">Rang: Kashmir / Oq</span>
      <span class="ctl" style="display: flex; align-items: center; justify-content: center; background: #3550E0; color: #fff; border-color: #3550E0">Hisobotga qoʻshish</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var s = this.state || {};
    var self = this;
    var ang = s.ang === undefined ? 32 : s.ang;
    var open = s.open || {};
    var K = 0.075, CX = 1700, CY = 1100, CZ = 1300;
    var FRONT = '#CDBFAE', BODY = '#F5F5F2', TOP = '#4B4F58', APPL = '#CBD5E1', LINE = '1px solid rgba(15,23,42,0.28)';
    function P(x, y, z) { return [(x - CX) * K, -(y - CY) * K, (z - CZ) * K]; }
    function r(n) { return Math.round(n * 100) / 100; }
    var els = [], doors = [];
    function plane(x, y, z, w, h, rot, bg) {
      var p = P(x, y, z);
      els.push({ w: r(w * K), h: r(h * K), o: '0 0', tf: 'translate3d(' + r(p[0]) + 'px,' + r(p[1]) + 'px,' + r(p[2]) + 'px) ' + rot, bg: bg, bd: '0' });
    }
    function box(x, y, z, w, h, d, bg, skip) {
      var c = P(x + w / 2, y + h / 2, z + d / 2), W = w * K, H = h * K, D = d * K;
      var f = [['front', W, H, 'rotateY(0deg) translateZ(' + r(D / 2) + 'px)'], ['back', W, H, 'rotateY(180deg) translateZ(' + r(D / 2) + 'px)'],
               ['right', D, H, 'rotateY(90deg) translateZ(' + r(W / 2) + 'px)'], ['left', D, H, 'rotateY(-90deg) translateZ(' + r(W / 2) + 'px)'],
               ['top', W, D, 'rotateX(90deg) translateZ(' + r(H / 2) + 'px)']];
      f.forEach(function (q) {
        if (skip === q[0]) return;
        els.push({ w: r(q[1]), h: r(q[2]), o: '50% 50%', tf: 'translate3d(' + r(c[0] - q[1] / 2) + 'px,' + r(c[1] - q[2] / 2) + 'px,' + r(c[2]) + 'px) ' + q[3], bg: bg, bd: LINE });
      });
    }
    // room: floor, wall A (back), wall B (right)
    plane(0, 0, 0, 3400, 2600, 'rotateX(90deg)', '#D6DCE7');
    plane(0, 2500, 0, 3400, 2500, '', 'rgba(236,240,247,0.96)');
    plane(3400, 2500, 0, 2600, 2500, 'rotateY(-90deg)', 'rgba(226,231,240,0.96)');
    var id = 0;
    function addDoors(side, a0, w, y0, h, n, kind, bg, name, fz) {
      fz = fz || 578;
      for (var i = 0; i < n; i++) {
        var key = name + i, on = !!open[key];
        var col = kind === 'drawer';
        var dw = col ? w - 3 : w / n - 3, dh = col ? h / n - 3 : h - 3;
        var da = col ? a0 + 1.5 : a0 + i * w / n + 1.5;
        var dy = col ? y0 + h - i * h / n - 1.5 : y0 + h - 1.5;
        var hingeRight = !col && n === 2 && i === 1;
        var p, base, o = hingeRight ? '100% 50%' : '0 50%';
        if (side === 'A') { p = P(da, dy, fz); base = ''; }
        else { p = P(3400 - fz, dy, da); base = 'rotateY(-90deg) '; }
        var mv = '';
        if (on) mv = col ? 'translateZ(' + r(380 * K) + 'px)' : (hingeRight ? 'rotateY(100deg)' : 'rotateY(-100deg)');
        doors.push({
          w: r(dw * K), h: r(dh * K), o: o, bg: bg, on: on, label: (col ? 'Tortma ' : 'Eshik ') + name,
          tf: 'translate3d(' + r(p[0]) + 'px,' + r(p[1]) + 'px,' + r(p[2]) + 'px) ' + base + mv,
          hj: hingeRight ? 'flex-start' : (col ? 'center' : 'flex-end'), hw: col ? 12 : 1.5, hh: col ? 1.5 : 10,
          tap: (function (k) { return function () { var nx = Object.assign({}, open); nx[k] = !nx[k]; self.setState({ open: nx }); }; })(key)
        });
      }
    }
    // wall A: bases (x, w, fronts), uppers
    [[0, 500, 1, 'door'], [500, 600, 3, 'drawer'], [1100, 800, 2, 'door'], [1900, 600, 1, 'appl'], [2500, 900, 1, 'door']].forEach(function (m, i) {
      box(m[0], 100, 0, m[1], 720, 560, BODY, 'front');
      addDoors('A', m[0], m[1], 100, 720, m[2], m[3] === 'drawer' ? 'drawer' : 'door', m[3] === 'appl' ? APPL : FRONT, 'A' + i);
    });
    [[0, 500, 1], [500, 600, 2], [1100, 800, 2], [1900, 600, 2], [2500, 900, 1]].forEach(function (m, i) {
      box(m[0], 1458, 0, m[1], 720, 300, BODY, 'front');
      var p = P(m[0], 2178 - 1.5, 318);
      for (var j = 0; j < m[2]; j++) {
        var key = 'U' + i + '_' + j, on = !!open[key], hr = m[2] === 2 && j === 1, dw = m[1] / m[2] - 3;
        var q = P(m[0] + j * m[1] / m[2] + 1.5, 2178 - 1.5, 318);
        doors.push({ w: r(dw * K), h: r(717 * K), o: hr ? '100% 50%' : '0 50%', bg: FRONT, on: on, label: 'Yuqori eshik',
          tf: 'translate3d(' + r(q[0]) + 'px,' + r(q[1]) + 'px,' + r(q[2]) + 'px) ' + (on ? (hr ? 'rotateY(100deg)' : 'rotateY(-100deg)') : ''),
          hj: hr ? 'flex-start' : 'flex-end', hw: 1.5, hh: 10,
          tap: (function (k) { return function () { var nx = Object.assign({}, open); nx[k] = !nx[k]; self.setState({ open: nx }); }; })(key) });
      }
    });
    box(0, 820, 0, 3400, 38, 600, TOP);
    box(0, 0, 0, 3400, 100, 500, '#64748B');
    // wall B
    [[600, 600, 3, 'drawer', 720], [1200, 400, 1, 'door', 720], [1600, 600, 2, 'appl', 2100], [2200, 400, 2, 'door', 2100]].forEach(function (m, i) {
      box(3400 - 560, 100, m[0], 560, m[4], m[1], BODY, 'left');
      addDoors('B', m[0], m[1], 100, m[4], m[2], m[3] === 'drawer' ? 'drawer' : 'door', m[3] === 'appl' ? APPL : FRONT, 'B' + i);
    });
    box(3400 - 600, 820, 600, 600, 38, 1000, TOP);
    box(3400 - 500, 0, 600, 500, 100, 2000, '#64748B');
    box(3400 - 300, 1608, 600, 300, 620, 600, BODY, 'left');
    box(3400 - 300, 1458, 1200, 300, 720, 400, BODY, 'left');
    addDoors('B', 600, 600, 1608, 620, 1, 'door', FRONT, 'BH', 318);
    addDoors('B', 1200, 400, 1458, 720, 1, 'door', FRONT, 'BU', 318);
    var anyOpen = Object.keys(open).some(function (k) { return open[k]; });
    return {
      ang: ang, els: els, doors: doors,
      left: function () { self.setState({ ang: ang - 15 }); },
      right: function () { self.setState({ ang: ang + 15 }); },
      allLabel: anyOpen ? 'Hammasini yopish' : 'Hammasini ochish',
      openAll: function () {
        if (anyOpen) { self.setState({ open: {} }); return; }
        var keys = {}; ['A0', 'A1', 'A2', 'A3', 'A4', 'B0', 'B1', 'B2', 'B3', 'BH', 'BU'].forEach(function (p) { for (var i = 0; i < 3; i++) keys[p + i] = true; });
        for (var u = 0; u < 5; u++) for (var j = 0; j < 2; j++) keys['U' + u + '_' + j] = true;
        self.setState({ open: keys });
      }
    };
  }
}
</script>
</body>
</html>
