<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Yangi mebel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B47D9}a:hover{color:#1E36B0}
button{font:inherit}
.g{border:1px solid rgba(255,255,255,0.8);background:rgba(255,255,255,0.45);backdrop-filter:blur(28px) saturate(190%);-webkit-backdrop-filter:blur(28px) saturate(190%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,0.95),0 14px 30px rgba(30,40,110,0.13)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #EEF1F8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F172A">
  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
    <div style="position: absolute; width: 320px; height: 320px; left: -120px; top: -100px; border-radius: 50%; background: #5B7BFF; filter: blur(70px); opacity: 0.55"></div>
    <div style="position: absolute; width: 260px; height: 260px; right: -80px; bottom: 40px; border-radius: 50%; background: #FFB58A; filter: blur(80px); opacity: 0.45"></div>
  </div>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 56px 20px 24px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Order.dc.html" aria-label="Orqaga" class="g" style="width: 42px; height: 42px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #0F172A">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <div style="font-size: 20px; font-weight: 800">Mebel qoʻshish</div>
    </div>

    <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <span style="height: 58px; border-radius: 16px; background: #0F172A; color: #fff; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center">Oshxona</span>
      <a href="Wardrobe.dc.html" style="text-decoration: none; height: 58px; border-radius: 16px; background: rgba(255,255,255,0.6); color: #0F172A; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center">Shkaf</a>
      <span style="height: 58px; border-radius: 16px; border: 1px dashed rgba(71,85,105,0.4); color: #64748B; font-size: 11.5px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.25">Mehmon-<br>xona · 2</span>
      <span style="height: 58px; border-radius: 16px; border: 1px dashed rgba(71,85,105,0.4); color: #64748B; font-size: 11.5px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.25">Yotoq va<br>boshqa · 2</span>
    </div>

    <h2 style="margin: 18px 0 0; font-size: 16px; font-weight: 800">Shakli</h2>
    <div style="margin-top: 8px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{layouts}}" as="l" hint-placeholder-count="4">
        <button type="button" onClick="{{l.pick}}" aria-pressed="{{l.on}}" class="g" style="cursor: pointer; height: 86px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #0F172A; outline: {{l.ring}}">
          <svg width="36" height="30" viewBox="0 0 36 30" fill="none" stroke="#3550E0" stroke-width="4" stroke-linecap="square" aria-hidden="true"><path d="{{l.path}}"></path></svg>
          <span style="font-size: 12px; font-weight: 700">{{l.name}}</span>
        </button>
      </sc-for>
    </div>

    <h2 style="margin: 18px 0 0; font-size: 16px; font-weight: 800">Qaysi devorlar boʻylab</h2>
    <figure style="margin: 8px 0 0; background: #fff; border-radius: 22px; padding: 12px; box-shadow: 0 10px 26px rgba(30,40,110,0.12); display: flex; justify-content: center">
      <svg width="300" height="220" viewBox="0 0 300 220" role="img" aria-label="Xona rejasi, tanlangan devorlar koʻk">
        <rect x="30" y="20" width="238" height="182" fill="#F8FAFC" stroke="#0F172A" stroke-width="5"></rect>
        <path d="M30 20h238" stroke="{{wA}}" stroke-width="9"></path>
        <path d="M268 20v182" stroke="{{wB}}" stroke-width="9"></path>
        <path d="M30 20v182" stroke="{{wD}}" stroke-width="9"></path>
        <path d="M120 202h70" stroke="#fff" stroke-width="7"></path>
        <path d="M120 202h70" stroke="#38BDF8" stroke-width="3"></path>
        <path d="M30 150v36" stroke="#fff" stroke-width="7"></path>
        <path d="M30 186a36 36 0 0 1 36-36" fill="none" stroke="#94A3B8" stroke-width="1.2"></path>
        <sc-if value="{{island}}" hint-placeholder-val="{{false}}">
          <rect x="105" y="100" width="90" height="42" fill="#CDBFAE" stroke="#0F172A" stroke-width="1.5"></rect>
        </sc-if>
        <text x="149" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif">A · 3400</text>
        <text x="284" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif" transform="rotate(90 284 115)">B · 2600</text>
        <text x="16" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif" transform="rotate(-90 16 85)">D · 2600</text>
        <text x="155" y="216" text-anchor="middle" font-size="10" fill="#475569" font-family="Plus Jakarta Sans, sans-serif">C · deraza</text>
      </svg>
    </figure>

    <div class="g" style="margin-top: 12px; border-radius: 20px; padding: 12px 14px; font-size: 13.5px; line-height: 1.5">
      <b style="font-weight: 800">{{runs}}</b><br><span style="color: #475569">{{runsNote}}</span>
    </div>

    <div style="flex: 1"></div>
    <a href="Kitchen.dc.html" style="text-decoration: none; height: 56px; border-radius: 20px; background: #3550E0; color: #fff; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(53,80,224,0.35)">Loyihalashni boshlash</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var s = this.state || {};
    var self = this;
    var L = s.l || 'L';
    var on = '#3550E0', off = '#0F172A';
    var defs = [
      ['I', 'Toʻgʻri', 'M4 8h28'],
      ['L', 'L-shakl', 'M4 6h28v20'],
      ['U', 'U-shakl', 'M4 26V6h28v20'],
      ['O', 'Orol', 'M4 6h28M11 20h14']
    ];
    var info = {
      I: ['Devor A: 3400 mm → 3,4 pog. m', 'Bitta devor. Deraza va eshik hisobga olinadi.'],
      L: ['A 3400 + B 2600 → 5,4 pog. m', 'Burchakda 600 mm burchak moduli; B devorda gaz quvuri bor.'],
      U: ['D 2600 + A 3400 + B 2600 → 7,4 pog. m', 'Ikki burchak. D devordagi eshik 900 mm boʻsh qoldiriladi.'],
      O: ['A 3400 + orol 1800 → 5,2 pog. m', 'Orol: 1800 × 900, atrofida kamida 900 mm oʻtish joyi.']
    };
    return {
      layouts: defs.map(function (d) {
        var o = L === d[0];
        return { name: d[1], path: d[2], on: o, ring: o ? '2.5px solid #3550E0' : 'none', pick: function () { self.setState({ l: d[0] }); } };
      }),
      wA: on,
      wB: L === 'L' || L === 'U' ? on : off,
      wD: L === 'U' ? on : off,
      island: L === 'O',
      runs: info[L][0],
      runsNote: info[L][1]
    };
  }
}
</script>
</body>
</html>
