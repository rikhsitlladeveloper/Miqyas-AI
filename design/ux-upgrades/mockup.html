<style>

  --green:#16A34A;--green-soft:rgba(22,163,74,.16);--red:#DC2626;--red-soft:rgba(220,38,38,.10);--amber:#B45309;
  --glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.78);--rim:rgba(255,255,255,.88);--line:rgba(15,23,42,.09);

  --thumb:#F2F3F7;--iso-wall:#ECE9E3;--iso-wall2:#DFDBD3;--iso-floor:#E4DED5;--elev-wall:#F7F6F3;
  --frame:#12151F;--issue:#E11D48;--issue-soft:rgba(225,29,72,.10);
  --page-a:rgba(91,123,255,.30);--page-b:rgba(176,124,255,.24);--page-c:rgba(255,181,138,.28);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0E1C;--sbg:#0D1224;
  --a1:rgba(91,123,255,.30);--a2:rgba(176,124,255,.22);--a3:rgba(63,216,242,.14);--a4:rgba(255,140,100,.14);
  --ink:#E8ECF7;--ink2:#A9B2C8;--ink3:#69738E;
  --blue:#5B74FF;--blue2:#4A63F0;--blue-soft:rgba(91,116,255,.20);
  --green:#34D399;--green-soft:rgba(52,211,153,.18);--red:#F87171;--red-soft:rgba(248,113,113,.14);--amber:#FBBF24;
  --glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.11);--rim:rgba(255,255,255,.12);--line:rgba(255,255,255,.09);
  --bar:18,23,42;--field:rgba(255,255,255,.08);--key:rgba(255,255,255,.12);
  --dark:#1C2440;--toast:#E8ECF7;--on-toast:#0F172A;--toast-undo:#3550E0;
  --sheet:rgba(22,28,50,.98);--scrim:rgba(0,0,0,.55);
  --shadow:0 12px 28px rgba(0,0,0,.35);
  --sh:0 0 0 1px var(--rim),inset 0 1px 0 rgba(255,255,255,.06),0 10px 24px rgba(0,0,0,.25);
  --thumb:#1B2238;--iso-wall:#3A4260;--iso-wall2:#323956;--iso-floor:#454B63;--elev-wall:#262D47;
  --frame:#05070D;--issue:#FB7185;--issue-soft:rgba(251,113,133,.14);
  --page-a:rgba(91,123,255,.16);--page-b:rgba(176,124,255,.12);--page-c:rgba(255,140,100,.08);
}}
:root[data-theme="dark"]{
  --bg:#0A0E1C;--sbg:#0D1224;
  --a1:rgba(91,123,255,.30);--a2:rgba(176,124,255,.22);--a3:rgba(63,216,242,.14);--a4:rgba(255,140,100,.14);
  --ink:#E8ECF7;--ink2:#A9B2C8;--ink3:#69738E;
  --blue:#5B74FF;--blue2:#4A63F0;--blue-soft:rgba(91,116,255,.20);
  --green:#34D399;--green-soft:rgba(52,211,153,.18);--red:#F87171;--red-soft:rgba(248,113,113,.14);--amber:#FBBF24;
  --glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.11);--rim:rgba(255,255,255,.12);--line:rgba(255,255,255,.09);
  --bar:18,23,42;--field:rgba(255,255,255,.08);--key:rgba(255,255,255,.12);
  --dark:#1C2440;--toast:#E8ECF7;--on-toast:#0F172A;--toast-undo:#3550E0;
  --sheet:rgba(22,28,50,.98);--scrim:rgba(0,0,0,.55);
  --shadow:0 12px 28px rgba(0,0,0,.35);
  --sh:0 0 0 1px var(--rim),inset 0 1px 0 rgba(255,255,255,.06),0 10px 24px rgba(0,0,0,.25);
  --thumb:#1B2238;--iso-wall:#3A4260;--iso-wall2:#323956;--iso-floor:#454B63;--elev-wall:#262D47;
  --frame:#05070D;--issue:#FB7185;--issue-soft:rgba(251,113,133,.14);
  --page-a:rgba(91,123,255,.16);--page-b:rgba(176,124,255,.12);--page-c:rgba(255,140,100,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;line-height:1.4}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(600px 500px at 0% 0%,var(--page-a),transparent 70%),radial-gradient(520px 480px at 100% 20%,var(--page-b),transparent 70%),radial-gradient(600px 500px at 80% 100%,var(--page-c),transparent 70%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:disabled{cursor:default}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icf{width:22px;height:22px;fill:currentColor;flex:none}

/* page */
.wrap{max-width:1140px;margin:0 auto;padding:28px 16px 56px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.hd h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.lead{color:var(--ink2);max-width:720px;margin-top:6px;font-size:15px}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 12px}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--rim);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.seg button{height:40px;padding:0 18px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--blue);color:#fff}
.seg button.on.oldon{background:var(--issue)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.chip{height:36px;padding:0 13px;border-radius:999px;background:var(--glass);border:1px solid var(--rim);font-size:13px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:disabled{opacity:.38}
.stage{display:grid;grid-template-columns:410px minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:880px){.stage{grid-template-columns:minmax(0,1fr)}}
.pwrap{position:relative;width:100%;max-width:410px;margin:0 auto}
.plabel{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:10px;color:var(--ink2)}
.plabel i{width:8px;height:8px;border-radius:50%;background:var(--blue)}
.plabel.old i{background:var(--issue)}
.phone{width:100%;height:820px;padding:10px;border-radius:56px;background:var(--frame);box-shadow:0 30px 60px rgba(20,30,80,.25),inset 0 0 0 2px rgba(255,255,255,.07)}
.phone.buzz{animation:buzz .09s linear 3}
@keyframes buzz{0%,100%{transform:translateX(0)}33%{transform:translateX(-2px)}66%{transform:translateX(2px)}}
@media (max-width:440px){.phone{padding:6px;border-radius:46px;height:790px}.screen{border-radius:40px!important}
  .seg3 button{width:40px}.btn{font-size:15px;padding:6px 12px}.qa button{font-size:12.5px;gap:4px}.pl{font-size:10.5px}.ttl{font-size:17px}}
.hap{position:absolute;top:22px;right:-6px;z-index:5;display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s;pointer-events:none}
.hap.show{opacity:1;transform:none}
.hap .ic{width:16px;height:16px}

/* screen */
.screen{position:relative;height:100%;border-radius:46px;overflow:hidden;isolation:isolate;background-color:var(--sbg);background-image:radial-gradient(330px 330px at 6% 4%,var(--a1),transparent 70%),radial-gradient(300px 300px at 100% 30%,var(--a2),transparent 70%),radial-gradient(340px 340px at 4% 72%,var(--a3),transparent 70%),radial-gradient(300px 300px at 100% 100%,var(--a4),transparent 70%)}
.sb{position:absolute;top:0;left:0;right:0;height:48px;z-index:95;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-size:15px;font-weight:700;pointer-events:none;color:var(--ink)}
.sb .isl{position:absolute;left:50%;top:11px;width:112px;height:32px;margin-left:-56px;border-radius:20px;background:#000}
.sb .sbi{display:flex;gap:6px;align-items:center}
.sb svg{height:12px;width:auto;fill:currentColor}
.hbar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);opacity:.85;z-index:96;pointer-events:none}
#scr{position:absolute;inset:0}
.top{position:absolute;top:0;left:0;right:0;z-index:20;padding:52px 16px 10px;background:linear-gradient(90deg,rgba(var(--bar),.70) 0,rgba(var(--bar),.95) 12%,rgba(var(--bar),.95) 88%,rgba(var(--bar),.70) 100%);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:0 1px 0 var(--line)}
.top.clear{background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.trow{display:flex;align-items:center;gap:10px;min-height:46px}
.bk{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--glass2);box-shadow:var(--sh);flex:none}
.tt{flex:1;min-width:0}
.tsub{font-size:12.5px;font-weight:600;color:var(--blue);display:flex;align-items:center;gap:6px}
.ttl{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.2;overflow-wrap:anywhere}
.tprice{margin-top:8px;font-size:14px}
.papprox{color:var(--ink3);font-weight:700;white-space:nowrap}
.papprox small{font-weight:600}
.pexact{font-weight:800;white-space:nowrap}
.pmuted{color:var(--ink3);font-weight:600}
.body{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;overflow-x:hidden;padding:14px 16px 20px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.bbar{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:10px 16px 26px;background:linear-gradient(90deg,rgba(var(--bar),.70) 0,rgba(var(--bar),.95) 12%,rgba(var(--bar),.95) 88%,rgba(var(--bar),.70) 100%);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:0 -1px 0 var(--line),0 -10px 30px rgba(30,40,110,.08)}
.brow{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.btn{min-height:56px;border-radius:18px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 16px;box-shadow:0 8px 20px rgba(53,80,224,.28);text-align:center;line-height:1.2}
.btn:active{transform:scale(.985)}
.btn:disabled{background:var(--blue-soft);color:var(--ink3);box-shadow:none}
.btn .ic,.btn .icf{width:20px;height:20px}
.btn2{min-height:52px;border-radius:16px;background:var(--glass2);box-shadow:var(--sh);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 14px;text-align:center;line-height:1.2}
.btn2 .ic{width:19px;height:19px}
.wide{width:100%}
.ubtn{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--glass2);box-shadow:var(--sh);flex:none;color:var(--ink)}
.ubtn:disabled{color:var(--ink3);opacity:.6}
.lnk{display:flex;align-items:center;gap:6px;justify-content:center;height:40px;margin:6px auto 0;padding:0 14px;font-size:14px;font-weight:700;color:var(--blue);border-radius:12px}
.lnk .ic{width:18px;height:18px}
.pulse{animation:pulse .7s ease-out 1}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(53,80,224,.55)}100%{box-shadow:0 0 0 18px rgba(53,80,224,0)}}
.card{background:var(--glass);border-radius:24px;box-shadow:var(--sh);padding:16px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.card+.card,.card+.mt,.mt{margin-top:12px}
.sect{font-size:15px;font-weight:800;margin:20px 2px 10px;display:flex;align-items:center;justify-content:space-between}
.sm{font-size:12.5px;color:var(--ink2)}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:#F59E0B;color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;flex:none}
.badge.sm{height:18px;font-size:10px;padding:0 7px}

/* progress */
.prog{display:flex;margin-top:10px}
.ps{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 2px;min-width:0;border-radius:12px}
.ps::before{content:'';position:absolute;top:17px;right:calc(50% + 15px);width:calc(100% - 30px);height:2px;background:var(--line);border-radius:2px}
.ps:first-child::before{display:none}
.ps.done::before,.ps.cur::before,.ps.skip::before{background:var(--blue)}
.pc{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;border:2px solid var(--line);color:var(--ink3);background:var(--field)}
.pc .ic{width:15px;height:15px;stroke-width:3}
.pl{font-size:11.5px;font-weight:700;color:var(--ink3);white-space:nowrap}
.ps.done .pc{background:var(--blue);border-color:var(--blue);color:#fff}
.ps.done .pl{color:var(--ink2)}
.ps.cur .pc{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.ps.cur .pl{color:var(--blue)}
.ps.cur{background:var(--blue-soft)}
.ps.skip .pc{border-style:dashed;border-color:var(--ink3);color:var(--ink3)}
.prog.cmp{margin-top:6px}
.prog.cmp .pc{width:22px;height:22px;font-size:11px}
.prog.cmp .ps::before{top:14px;right:calc(50% + 12px);width:calc(100% - 24px)}
.prog.cmp .pl{font-size:10.5px}

/* home */
.logo{display:flex;align-items:center;gap:10px;flex:1}
.logo b{font-size:17px;letter-spacing:.32em;font-weight:800}
.lg{width:34px;height:34px}
.lz{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:999px;background:var(--glass2);box-shadow:var(--sh);font-size:12.5px;font-weight:700;color:var(--ink2)}
.lz .ic{width:17px;height:17px}
.lz.on{color:var(--green)}
.hi{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.hs{color:var(--ink2);font-size:15px;margin-top:2px}
.oc{position:relative;padding:0;overflow:hidden}
.oc-main{display:block;width:100%;padding:16px}
.oc-b{display:flex;align-items:center;gap:8px;min-height:44px;margin:-6px 0 2px;padding-right:124px}
.oc-h{display:flex;align-items:center;gap:8px;min-height:28px}
.oc-h b{font-size:16.5px;font-weight:800;line-height:1.25}
.oc.mine .oc-h{padding-right:50px}
.oc-s{font-size:13px;color:var(--ink2);margin-top:4px}
.oc-p{margin-top:10px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.oc-next{font-size:12.5px;font-weight:700;color:var(--blue)}
.oc-del{position:absolute;top:10px;right:10px;height:44px;padding:0 12px;border-radius:14px;display:flex;align-items:center;gap:6px;color:var(--red);font-weight:700;font-size:13.5px;background:var(--red-soft)}
.oc-del .ic{width:17px;height:17px}
.oc-call{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green)}
.oc-call .ic{width:19px;height:19px}
.oc.sample{background:linear-gradient(180deg,rgba(245,158,11,.10),transparent 60%),var(--glass)}
.mp{display:flex;gap:4px;margin-top:12px}
.mp i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.mp i.d{background:var(--blue)}
.mp i.c{background:var(--blue);opacity:.35}
.fab{position:absolute;right:16px;bottom:104px;z-index:21;height:54px;padding:0 20px 0 16px;border-radius:27px;background:var(--blue);color:#fff;font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 26px rgba(53,80,224,.38)}
.tabbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:21;display:flex;gap:2px;padding:5px;border-radius:32px;background:rgba(var(--bar),.62);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);box-shadow:var(--sh);width:min(290px,calc(100% - 32px))}
.tabbar button{flex:1;height:54px;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2)}
.tabbar button .ic{width:21px;height:21px}
.tabbar button.on{background:var(--glass2);color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.search{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:16px;background:var(--field);box-shadow:var(--sh);color:var(--ink3);font-size:14px;margin-top:12px}

/* order */
.seg2{display:flex;padding:4px;border-radius:16px;background:var(--glass);box-shadow:var(--sh)}
.seg2 button{flex:1;height:42px;border-radius:12px;font-weight:700;font-size:14px;color:var(--ink2);text-align:center}
.seg2 button.on{background:var(--glass2);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.empty{text-align:center;padding:26px 18px}
.empty .ei{width:56px;height:56px;border-radius:18px;margin:0 auto 12px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.empty b{font-size:16px}
.empty p{font-size:13.5px;color:var(--ink2);margin-top:4px}
.arrow-down{display:flex;justify-content:center;margin-top:12px;color:var(--blue);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.fc{display:flex;gap:12px;align-items:center;width:100%;padding:12px}
.fc .th{width:96px;height:76px;border-radius:16px;background:var(--thumb);flex:none;display:block;overflow:hidden}
.fc .th svg{display:block;width:100%;height:100%}
.fc .fi{flex:1;min-width:0}
.fc .fi b{font-size:15.5px}
.fc .fi div{font-size:12.5px;color:var(--ink2);margin-top:2px}
.fc .fi .fp{margin-top:6px;font-size:13.5px}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;background:var(--glass);box-shadow:var(--sh);font-size:13.5px;margin-top:10px}
.row .ic{width:19px;height:19px}
.row.ok{color:var(--green);background:linear-gradient(0deg,var(--green-soft),var(--green-soft)),var(--glass)}
.row.ok b{color:var(--ink)}
.row .rt{flex:1;min-width:0}
.row .rt div{font-size:12px;color:var(--ink2)}
.row.lock{color:var(--blue)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink2)}
.kv b{text-align:right}
.stl{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:14px}
.stl .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--ink3);flex:none}
.stl.d .n{background:var(--blue);border-color:var(--blue);color:#fff}
.stl.d .n .ic{width:14px;height:14px;stroke-width:3}
.stl.c .n{border-color:var(--blue);color:var(--blue)}
.stl.c{font-weight:800}

/* gallery */
.hsw{position:relative;margin:0 -16px}
.hsw::after{content:'›';position:absolute;right:0;top:0;bottom:0;width:44px;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-size:22px;font-weight:700;color:var(--ink2);background:linear-gradient(90deg,rgba(var(--bar),0),rgba(var(--bar),.96) 60%);pointer-events:none}
.body .hsw::after{background:linear-gradient(90deg,transparent,var(--sbg) 65%)}

  var pill=function(x,y,i){var on=i===step,t=lab(i),w=Math.max(34,t.length*8+18);return '<rect x="'+(x-w/2)+'" y="'+(y-11)+'" width="'+w+'" height="22" rx="11" class="'+(on?'pb':'pr')+'"/><text class="pt'+(on?' on':'')+'" x="'+x+'" y="'+(y+4)+'">'+t+'</text>';};
