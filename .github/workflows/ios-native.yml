# The native iPhone app (ios-native/), in the order that reports problems soonest. Two kinds of job run side by side:
#   build    1. compile (app and both test bundles), so a source error fails in a few minutes with its lines listed;
#            2. the unsigned IPA (the device build), so device-only problems show early and a build to install always exists;
#            3. the unit tests (money, report, PDF), under a minute;
#            5. a cold start recorded as a video.
#   screens  4. the screen tests, split into three groups of classes, each group on its own runner and simulator
#            (each compiles for itself). On one runner they took about 37 minutes and the whole job came within a few
#            minutes of its 60-minute limit; two simulators on one runner ran each test 2-3 times slower and made the 3D
#            test fail, so the groups get a runner each. A failed test is retried once for simulator stalls.
# Artifacts: METRX-ipa, build-logs (build and unit-test logs, the cold-start video) and screens-<group> (the
# screenshots and the screen-test log of each group).
name: iOS native app

on:
  push:
    branches: [ios-native]
    paths:
      - "ios-native/**"
      - "!ios-native/README.md"
      - "android-native/app/src/main/assets/strings.json"
      - ".github/workflows/ios-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-native
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35   # about 20 minutes: compile 2, IPA 7, unit tests 4, cold start 2-5
    defaults:
      run:
        working-directory: ios-native
    steps:
      - uses: actions/checkout@v4

      - name: Newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick a simulator
        id: sim
        run: python3 tools/pick_sim.py | tee -a "$GITHUB_OUTPUT"

      - name: 1. Compile
        id: compile
        run: |
          mkdir -p out/shots
          xcodebuild build-for-testing -project METRX.xcodeproj -scheme METRX -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath out/dd > out/build.log 2>&1 || {
              echo "== source errors"; { grep -E "^/.*\.swift:[0-9]+:[0-9]+: error" out/build.log || true; } | sed 's|.*/ios-native/||' | sort -u | head -n 120
              echo "== other errors"; { grep -nE "error:|FAILED" out/build.log || true; } | head -n 40
              exit 1; }
          echo "compiled"

      - name: 2. Unsigned IPA
        id: ipa
        if: steps.compile.outcome == 'success'
        run: |
          xcodebuild -project METRX.xcodeproj -target METRX -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/out/ipa" OBJROOT="$PWD/out/ipa/obj" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > out/ipa.log 2>&1 || { grep -nE "error:|FAILED" -A5 out/ipa.log | tail -n 120; exit 1; }
          mkdir -p out/pkg/Payload && cp -R out/ipa/Release-iphoneos/METRX.app out/pkg/Payload/
          (cd out/pkg && zip -qry ../METRX-unsigned.ipa Payload)
          ls -la out/METRX-unsigned.ipa

      # the IPA goes up as soon as it exists, so a run cut short later still leaves a build to install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: METRX-ipa
          path: ios-native/out/METRX-unsigned.ipa
          if-no-files-found: ignore

      - name: 3. Unit tests
        id: unit
        if: always() && steps.compile.outcome == 'success'
        run: |
          R=0
          TEST_RUNNER_SHOTS="$PWD/out/shots" xcodebuild test-without-building -project METRX.xcodeproj -scheme METRX \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath out/dd -only-testing:METRXTests \
            > out/unit.log 2>&1 || R=$?
          grep -E "Test [Cc]ase .*(passed|failed)|error: -\[|Executed" out/unit.log | sed 's/^.*Test [Cc]ase //' | tail -n 40
          exit $R

      - name: 5. Record a cold start
        if: always() && steps.compile.outcome == 'success'
        run: |
          APP=$(find out/dd/Build/Products -name "METRX.app" -path "*iphonesimulator*" | head -1)
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl terminate "$UDID" uz.metrx.app || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl io "$UDID" recordVideo --codec h264 --force out/shots/coldstart.mp4 > out/rec.log 2>&1 &
          REC=$!
          # the recorder needs a few seconds to start; launch only once it says so
          for i in $(seq 1 40); do grep -q "Recording started" out/rec.log && break; sleep 0.5; done
          cat out/rec.log
          SIMCTL_CHILD_UI_LANG=uz xcrun simctl launch "$UDID" uz.metrx.app
          sleep 7
          kill -INT $REC; wait $REC || true
          ls -la out/shots/coldstart.mp4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            ios-native/out/shots
            ios-native/out/build.log
            ios-native/out/unit.log
          if-no-files-found: ignore

  screens:
    name: screens (${{ matrix.group }})
    runs-on: macos-latest
    timeout-minutes: 35   # each group's tests take about 11-13 minutes, plus 2 to compile
    strategy:
      fail-fast: false
      matrix:
        include:
          # grouped by their last measured times, about 10-12 minutes of tests each; a new screen-test class
          # (METRXUITests/ScreenTests.swift) runs only once it is added to one of these lists
          - group: builder
            tests: Part1Tests Part2Tests Part3Tests Part4Tests Part5Tests Furniture2Tests UXTests
          - group: report-measure
            tests: Part6Tests Part7Tests EdgeMeasureTests Furniture1Tests Furniture3Tests Furniture8Tests RoomShapeTests Furniture7Tests
          - group: furniture
            tests: Furniture4Tests Furniture5Tests Furniture6Tests Modern3DShots
    defaults:
      run:
        working-directory: ios-native
    steps:
      - uses: actions/checkout@v4

      - name: Newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick a simulator
        id: sim
        run: python3 tools/pick_sim.py | tee -a "$GITHUB_OUTPUT"

      - name: Compile
        id: compile
        run: |
          mkdir -p out/shots
          xcodebuild build-for-testing -project METRX.xcodeproj -scheme METRX -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath out/dd > out/build.log 2>&1 || {
              echo "== source errors (the build job lists them all)"; { grep -E "^/.*\.swift:[0-9]+:[0-9]+: error" out/build.log || true; } | sed 's|.*/ios-native/||' | sort -u | head -n 20
              exit 1; }
          echo "compiled"

      - name: 4. Screen tests (${{ matrix.group }})
        id: screens
        if: steps.compile.outcome == 'success'
        run: |
          ONLY=""
          for c in ${{ matrix.tests }}; do ONLY="$ONLY -only-testing:METRXUITests/$c"; done
          R=0
          TEST_RUNNER_SHOTS="$PWD/out/shots" xcodebuild test-without-building -project METRX.xcodeproj -scheme METRX \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath out/dd $ONLY \
            -parallel-testing-enabled NO -retry-tests-on-failure -test-iterations 2 \
            > out/test.log 2>&1 || R=$?
          echo "== results"; grep -E "Test [Cc]ase .*(passed|failed)" out/test.log | sed 's/^.*Test [Cc]ase //' | sort | uniq | tail -n 60
          echo "== failures"; { grep -E "error: -\[|error: .*Test" out/test.log || true; } | sed 's|.*/ios-native/||' | sort -u | head -n 40
          ls out/shots | head -n 300
          exit $R

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.group }}
          path: |
            ios-native/out/shots
            ios-native/out/test.log
          if-no-files-found: ignore
