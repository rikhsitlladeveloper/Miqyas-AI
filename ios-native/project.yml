# The METRX iPhone app (SwiftUI). Generate the Xcode project with `xcodegen generate` (done in CI; see
# .github/workflows/ios-native.yml). Texts come from the Android app's strings.json so both apps say the same.
name: METRX
options:
  bundleIdPrefix: uz.metrx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  METRX:
    type: application
    platform: iOS
    sources:
      - path: METRX
      - path: ../android-native/app/src/main/assets/strings.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.metrx.app
        INFOPLIST_FILE: METRX/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  METRXTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: METRXTests
      # the furniture core's test cases, shared with the Android unit tests
      - path: ../android-native/app/src/test/resources/furniture-cases.json
        buildPhase: resources
      # photo edge measuring: the shared test photos and what must be found on them
      - path: ../android-native/app/src/test/resources/edge-cases.json
        buildPhase: resources
      - path: ../android-native/app/src/test/resources/edges
        type: folder
        buildPhase: resources
    dependencies:
      - target: METRX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/METRX.app/METRX"
        BUNDLE_LOADER: "$(TEST_HOST)"
  METRXUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [METRXUITests]
    dependencies:
      - target: METRX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: METRX
schemes:
  METRX:
    build:
      targets:
        METRX: all
        METRXTests: [test]
        METRXUITests: [test]
    test:
      targets: [METRXTests, METRXUITests]
